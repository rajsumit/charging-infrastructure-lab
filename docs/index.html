page({ id: 'rectifier', mod: 'm2', wk: 1, stars: 2, topic: true, title: 'Single-phase diode rectifier & capacitor filter', kw: 'half wave full wave bridge average vrrm ripple capacitor', lede: 'The simplest AC-DC converter, and the reason power-factor correction exists: a capacitor makes the grid current spiky.',
  render(body) {
    H(body, `<h2>Averages you must know</h2>${F('Half-wave:  Vavg = Vpk / π ,   Vrms = Vpk / 2', 'W1Q7')}${F('Full-wave:  Vavg = 2·Vpk / π ,   Vrms = Vpk / √2')}${F('Diode reverse voltage (VRRM) = Vpk  (half-wave with R load, and each diode of a bridge)', 'W1Q8')}
    <p>${HOT('Always use the peak from the figure', 'W1Q7')}: a 220 V rms source has Vpk = 311 V; if the diagram prints "310 sin ωt" use 310. Frequency (50 or 60 Hz) does not change the average.</p>`);
    const L = lab(body, 'Rectifier lab: half-wave, bridge, with and without a capacitor', 'Add a capacitor and watch the input current collapse into narrow pulses. Narrow pulses mean high peak current, high THD and poor power factor, so the next topics add PFC.');
    const s1 = L.scope({ xmin: 0, xmax: 60, ymin: -400, ymax: 400, yt: 4, xt: 6, xl: 'ms', yl: 'volts', h: 210 });
    L.legend([['source vs', '--ch-b'], ['output vo', '--ch-v']]);
    const s2 = L.scope({ xmin: 0, xmax: 60, ymin: -1, ymax: 1, yt: 2, xt: 6, xl: 'ms', yl: 'i (norm.)', h: 130 }); L.legend([['source current (normalised)', '--ch-i']]);
    const ro = L.readout(); let mode = 'full';
    segmented(L.body, [['half', 'Half-wave (1 diode)'], ['full', 'Full bridge (4 diodes)']], 'full', m => { mode = m; upd(); });
    const v = controls(L.body, [{ k: 'vpk', label: 'Peak voltage', min: 100, max: 400, step: 5, v: 325, unit: 'V', d: 0 }, { k: 'C', label: 'Filter capacitor', min: 0, max: 2000, step: 10, v: 470, unit: 'µF', d: 0 }, { k: 'R', label: 'Load resistance', min: 20, max: 400, step: 5, v: 100, unit: 'Ω', d: 0 }], upd);
    function upd() {
      const dt = 0.05, N = 60 / dt, X = [], vs = [], vo = [], ii = []; let vc = 0; const C = v.C * 1e-6, R = v.R; let sum = 0, mn = 1e9, mx = -1e9, cnt = 0, ipk = 1e-9;
      const raw = [];
      for (let k = 0; k <= N; k++) {
        const t = k * dt, s = v.vpk * Math.sin(T2 * 50 * t / 1000); const vin = mode === 'full' ? Math.abs(s) : Math.max(s, 0);
        let i = 0, out;
        if (C === 0) { out = vin; i = vin / R * Math.sign(s); }
        else if (vin > vc) { const nv = vin; i = (C * (nv - vc) / (dt * 1e-3) + nv / R) * (s >= 0 ? 1 : -1); vc = nv; out = vc; }
        else { vc -= vc / (R * C) * dt * 1e-3; out = vc; }
        X.push(t); vs.push(s); vo.push(out); raw.push(i); ipk = Math.max(ipk, Math.abs(i));
        if (t > 30) { sum += out; cnt++; mn = Math.min(mn, out); mx = Math.max(mx, out); }
      }
      s1.draw([{ x: X, y: vs, c: '--ch-b', w: 1.6, dash: [4, 3] }, { x: X, y: vo, c: '--ch-v', w: 2.4 }]);
      s2.draw([{ x: X, y: raw.map(a => a / ipk), c: '--ch-i', fill: true }]);
      const avg = sum / cnt;
      ro([['Vo average', avg.toFixed(0) + ' V'], ['Ripple (pk-pk)', (mx - mn).toFixed(1) + ' V'], ['Peak source current', ipk.toFixed(1) + ' A'], ['Theory (no C)', (mode === 'full' ? 2 * v.vpk / Math.PI : v.vpk / Math.PI).toFixed(0) + ' V']]);
    }
    upd();
    H(body, `<h2>Why the capacitor hurts the grid</h2><p>The bridge only conducts when |vs| &gt; vc, i.e. near the voltage peak. All the charge must be delivered in that short window, so current is a narrow, tall pulse. The line current is rich in 3rd, 5th, 7th harmonics. Result: ${HOT('power factor ≈ 0.5-0.7 even though the load is resistive')}.</p>
    <h3>Capacitor sizing (conduction-time method)</h3>${F('Iavg = P / Vavg ;   ΔV = Iavg · t_discharge / C   →   C = Iavg · t_dis / ΔV')}
    <p>The discharge time is almost the whole half-cycle (10 ms for a 50 Hz bridge) minus the short conduction angle.</p>`);
    calc(body, 'Calculator: filter capacitor for a bridge rectifier', [{ k: 'Vr', l: 'Mains rms', v: 230, u: 'V' }, { k: 'f', l: 'Line frequency', v: 50, u: 'Hz' }, { k: 'P', l: 'Power', v: 500, u: 'W' }, { k: 'rip', l: 'Allowed ripple', v: 5, u: '% of Vpk' }], (x) => { const r = C.capFilter(x.Vr, x.f, x.P, x.rip / 100); return [['Vpk', r.Vpk.toFixed(1) + ' V'], ['Vmin', r.Vmin.toFixed(1) + ' V'], ['Iavg', r.Iavg.toFixed(2) + ' A'], ['t discharge', (r.tdis * 1e3).toFixed(2) + ' ms'], ['C min', (r.Cmin * 1e6).toFixed(0) + ' µF']]; });
    H(body, MUST(`${HOT('Half-wave Vavg = Vpk/π; full-wave 2Vpk/π', 'W1Q7')}. Diode VRRM = Vpk.`, `Capacitor-input rectifier = narrow current pulses = low PF, high THD. That is the motivation for PFC.`, `A resistive load gives unity PF for a plain rectifier without C; the problem appears with C.`));
  } });

page({ id: 'boost-pfc', mod: 'm2', wk: 2, stars: 3, topic: true, title: 'Boost PFC: duty ratio, inductor & ripple', kw: 'boost pfc duty ratio inductor ripple ccm d(t)', lede: 'The most heavily examined topic of Week 2. If you understand one picture, make it d(t) = 1 − |vs|/Vo.',
  render(body) {
    H(body, `<h2>Idea in 30 seconds</h2><p>Put a boost converter after the diode bridge and control its <b>input current</b> to be a sine in phase with the voltage. The converter then looks like a resistor to the grid (PF ≈ 1), and the DC link is boosted above the grid peak (typically 380-450 V for 230 V mains).</p>
    <ol class="steps"><li><div>The bridge rectifies: input to the boost stage is |vs| = Vpk|sin ωt|.</div></li><li><div>Switch S1 on for <b>d·Ts</b>: inductor sees +|vs| and its current rises. Off for (1−d)Ts: inductor sees |vs|−Vo (negative) and current falls.</div></li><li><div>Volt-second balance gives ${HOT('d(t) = 1 − |vs(t)| / Vo', 'W2Q1')}. d is smallest at the voltage peak, 1 at the zero crossing.</div></li><li><div>A current loop varies d so that average iL follows |vs|: iL,avg = Ipk|sin ωt|, with ${F('Ipk = √2 · P / Vrms')}</div></li></ol>`);
    const L = lab(body, 'Line-cycle view: |vs| and duty ratio d(t)', 'The source voltage and duty ratio for one line cycle. Raise Vo: more headroom, lower d at the peak. Lower Vo below Vpk and the boost stage can no longer work (d would be negative).');
    const sA = L.scope({ xmin: 0, xmax: 20, ymin: 0, ymax: 500, yt: 5, xt: 4, xl: 'ms', yl: 'volts', h: 190 }); L.legend([['|vs|', '--ch-b'], ['Vo', '--ch-v']]);
    const sB = L.scope({ xmin: 0, xmax: 20, ymin: 0, ymax: 1, yt: 4, xt: 4, xl: "ms", yl: "duty d", h: 170 }); L.legend([['d(t) = 1 − |vs|/Vo', '--ch-i']]);
    const ro = L.readout();
    const v = controls(L.body, [{ k: 'Vr', label: 'Grid rms', min: 180, max: 265, step: 1, v: 230, unit: 'V', d: 0 }, { k: 'Vo', label: 'DC link Vo', min: 300, max: 500, step: 5, v: 400, unit: 'V', d: 0 }], u1);
    function u1() {
      const Vpk = v.Vr * Math.SQRT2; const f = t => Math.abs(Vpk * Math.sin(T2 * 50 * t / 1000));
      sA.draw([{ fn: f, c: '--ch-b', w: 2.4, fill: true }], { h: [{ y: v.Vo, c: '--ch-v', t: 'Vo' }] });
      sB.draw([{ fn: t => Math.max(0, 1 - f(t) / v.Vo), c: '--ch-i', w: 2.4, fill: true, fillTo: 0 }]);
      ro([['Vpk', Vpk.toFixed(0) + ' V'], ['d at peak (min)', Vpk < v.Vo ? (1 - Vpk / v.Vo).toFixed(3) : 'invalid'], ['d at zero cross', '1.00'], ['Vo > Vpk ?', Vpk < v.Vo ? 'yes ✔' : 'NO ✘']]);
    }
    u1();
    const L2 = lab(body, 'Inside one switching cycle: inductor current ripple', 'Pick where in the line cycle you are (θ). The inductor current is a triangle ripple around its line-frequency average. The ripple height changes along the cycle and is largest when |vs| = Vo/2.');
    const sI = L2.scope({ xmin: 0, xmax: 150, ymin: 0, ymax: 30, yt: 3, xt: 5, xl: 'µs', yl: 'iL (A)', h: 190 }); const sG = L2.scope({ xmin: 0, xmax: 150, ymin: -.2, ymax: 1.3, yt: 1, xt: 5, xl: 'µs', yl: 'gate', h: 90, yfmt: v => v === 0 || v === 1 ? v : '' });
    const sR = L2.scope({ xmin: 0, xmax: 325, ymin: 0, ymax: 1.1, yt: 4, xt: 5, xl: '|vs| (V)', yl: 'ripple / max', h: 150 }); L2.legend([['ripple ΔI ∝ |vs|(1−|vs|/Vo)', '--ch-d']]);
    const ro2 = L2.readout();
    const w = controls(L2.body, [{ k: 'th', label: 'Position in half-cycle θ', min: 5, max: 175, step: 1, v: 90, unit: '°', d: 0 }, { k: 'L', label: 'Inductance', min: 100, max: 1500, step: 10, v: 400, unit: 'µH', d: 0 }, { k: 'fs', label: 'Switching frequency', min: 20, max: 150, step: 5, v: 70, unit: 'kHz', d: 0 }], u2);
    function u2() {
      const Vpk = 325.3, Vo = 400, P = 3300, Ipk = Math.SQRT2 * P / 230, s = Math.sin(w.th * Math.PI / 180), vs = Vpk * s, d = 1 - vs / Vo, T = 1e3 / w.fs; // µs
      const Iav = Ipk * s, dI = vs * d / (w.L * 1e-6 * w.fs * 1e3); const X = [], Y = [], G = [], Gx = [];
      const p = (t, y) => { X.push(t); Y.push(y); };
      for (let k = 0; k < 3; k++) { const t0 = k * T; p(t0, Iav - dI / 2); p(t0 + d * T, Iav + dI / 2); p(t0 + T, Iav - dI / 2); Gx.push(t0, t0 + d * T, t0 + d * T, t0 + T); G.push(1, 1, 0, 0); }
      sI.set({ xmax: 3 * T, ymax: Math.max(10, Math.ceil((Iav + dI / 2) * 1.15 / 5) * 5) }); sG.set({ xmax: 3 * T });
      sI.draw([{ x: X, y: Y, c: '--ch-i', w: 2.4 }], { h: [{ y: Iav, c: '--ch-b', t: 'average = Ipk·sin θ' }] }); sG.draw([{ x: Gx, y: G, c: '--ch-x', step: false, w: 2 }]);
      sR.draw([{ fn: x => 4 * (x / Vo) * (1 - x / Vo), c: '--ch-d', w: 2.4, fill: true }], { v: [{ x: Vo / 2, c: '--hot', t: 'Vo/2 = 200 V' }, { x: vs, c: '--ch-i' }] });
      ro2([['|vs| now', vs.toFixed(0) + ' V'], ['duty d', d.toFixed(3)], ['avg iL', Iav.toFixed(1) + ' A'], ['ripple ΔI', dI.toFixed(2) + ' A'], ['max ripple Vo/(4L·fs)', (Vo / (4 * w.L * 1e-6 * w.fs * 1e3)).toFixed(2) + ' A']]);
    }
    u2();
    H(body, `<h2>Sizing the inductor</h2>${F('ΔI(t) = |vs|·d(t) / (L·fsw)  →  max at |vs| = Vo/2:   ΔImax = Vo / (4·L·fsw)', 'W2Q4')}${F('L = Vo / (4 · ΔImax · fsw)      with ΔImax = r · Ipk,   Ipk = √2 · P / Vrms', 'W2Q8')}`);
    calc(body, 'Calculator: boost PFC inductor (like W2Q8)', [{ k: 'P', l: 'Power', v: 3300, u: 'W' }, { k: 'Vr', l: 'Grid rms', v: 230, u: 'V' }, { k: 'Vo', l: 'Vo', v: 400, u: 'V' }, { k: 'r', l: 'Ripple of Ipk', v: 20, u: '%' }, { k: 'fs', l: 'fsw', v: 20, u: 'kHz' }], x => { const Ipk = C.boostIpk(x.P, x.Vr), dI = x.r / 100 * Ipk; return [['Ipk', Ipk.toFixed(2) + ' A'], ['ΔImax', dI.toFixed(2) + ' A'], ['L', (C.boostL(x.Vo, dI, x.fs * 1e3) * 1e3).toFixed(2) + ' mH'], ['dmin', (1 - x.Vr * Math.SQRT2 / x.Vo).toFixed(3)]]; }, 'Try the W2Q8 numbers: P = 1100, Vr = 230, Vo = 450, r = 10 %, fs = 60 kHz → about 2.77 mH (ripple = % of peak input current).');
    H(body, `<h2>Four-switch (full-bridge) version</h2><p>If the diode bridge is replaced by a full bridge of switches switched in pairs (S1+S4 for d, S2+S3 for 1−d) the signed source voltage obeys vs = (2d−1)Vo, so ${HOT('d = (1 + vs/Vo)/2 and S1/S4 conduct longer than S2/S3', 'W2Q2')}. At vs = 0, d = 0.5.</p>
    <h2>Typical trap questions</h2><ul><li>${HOT('d takes the same value 4 times per line cycle', 'W2Q3')} (2 per half-cycle, two half-cycles).</li><li>Minimum duty occurs at the <b>highest</b> peak: for a 265 V rms input and Vo = 500 V, dmin = 1 − 375/500 = ${HOT('0.25', 'W2Q10')}.</li><li>During the on-time the inductor sees +|vs|, not Vo.</li></ul>`);
    H(body, MUST(`${F('d(t) = 1 − |vs|/Vo')}`, `${F('L = Vo / (4·ΔImax·fsw)')}`, `${F('Ipk = √2·P/Vrms ;  dmin = 1 − Vpk/Vo')}`, `Ripple is maximum where |vs| = Vo/2, <b>not</b> at the peak.`, `Vo must be larger than the grid peak (boost converter).`));
  } });

page({ id: 'pfc-stress', mod: 'm2', wk: 3, stars: 3, topic: true, title: 'PFC stresses: RMS currents & 100 Hz ripple', kw: 'rms current switch stress capacitor ripple 100 hz double line frequency', lede: 'Two quick-fire question types: "RMS current of the switch" and "what is the dominant ripple frequency / ripple volts".',
  render(body) {
    H(body, `<h2>1 · RMS current of a switch</h2><p>If a switch carries a (nearly) constant current Io for a fraction D of the period and zero otherwise:</p>${F('Irms = Io · √D', 'W3Q2')}<p>${HOT('D is the switch\'s own conduction fraction', 'W3Q3')}. In a full bridge with S1/S4 on for 30 µs and S2/S3 for 20 µs (T = 50 µs): D(S1) = 0.6, Irms = 10 × √0.6 = 7.75 A. In a boost PFC, S1 conducts d(t) and S2 conducts (1−d(t)); the RMS² is the average over a half line cycle of (fraction) × iL².</p>`);
    calc(body, 'Calculator: RMS of a switch with constant current', [{ k: 'Io', l: 'Current', v: 20, u: 'A' }, { k: 'ton', l: 'On time', v: 30, u: 'µs' }, { k: 'T', l: 'Period', v: 100, u: 'µs' }], x => [['D', (x.ton / x.T).toFixed(3)], ['Irms', C.rmsBuckSwitch(x.Io, x.ton / x.T).toFixed(2) + ' A']]);
    H(body, `<h2>2 · Why PFC needs a big capacitor: power pulsates at 2×line</h2><p>With unity PF, v = V sin ωt, i = I sin ωt, so p = V·I·sin²ωt = <b>(VI/2)(1 − cos 2ωt)</b>. Input power swings between 0 and VI at <b>100 Hz</b> (for 50 Hz), but the load wants constant power. The DC-link capacitor absorbs the difference, so its voltage ripples at 100 Hz. ${HOT('This is true for ANY single-phase PFC, whatever fsw is (10 kHz, 70 kHz …)', 'W3Q4')}${HOT('', 'W4Q3')}.</p>${F('ΔVpp = P / (2π · fline · Vo · C)', 'W3Q5')}`);
    const L = lab(body, 'Single-phase power pulsation and DC-link ripple', 'Increase the capacitor and the 100 Hz ripple shrinks. Compare with the 3-phase case (flat power) in the later module.');
    const s1 = L.scope({ xmin: 0, xmax: 40, ymin: 0, ymax: 7000, yt: 4, xt: 4, xl: 'ms', yl: 'power W', h: 170 }); L.legend([['input power p(t)', '--ch-i'], ['load power', '--ch-d']]);
    const s2 = L.scope({ xmin: 0, xmax: 40, ymin: 380, ymax: 420, yt: 4, xt: 4, xl: 'ms', yl: 'vo (V)', h: 170 }); L.legend([['DC link voltage', '--ch-v']]); const ro = L.readout();
    const v = controls(L.body, [{ k: 'P', label: 'Power', min: 500, max: 7000, step: 100, v: 3300, unit: 'W', d: 0 }, { k: 'Cm', label: 'DC-link capacitance', min: .2, max: 6, step: .1, v: 2.2, unit: 'mF', d: 1 }, { k: 'Vo', label: 'Vo', min: 350, max: 450, step: 10, v: 400, unit: 'V', d: 0 }], u);
    function u() {
      const dpp = C.dblLineRipple(v.P, 50, v.Vo, v.Cm * 1e-3);
      s1.draw([{ fn: t => v.P * (1 - Math.cos(T2 * 100 * t / 1000)), c: '--ch-i', w: 2.4 }], { h: [{ y: v.P, c: '--ch-d', t: 'P (average)' }] });
      s2.set({ ymin: v.Vo - 25, ymax: v.Vo + 25 }); s2.draw([{ fn: t => v.Vo + dpp / 2 * Math.sin(T2 * 100 * t / 1000), c: '--ch-v', w: 2.4 }]);
      ro([['Pulsation frequency', '100 Hz'], ['Ripple Vpp', dpp.toFixed(2) + ' V'], ['Ripple % of Vo', (dpp / v.Vo * 100).toFixed(1) + ' %'], ['W3Q5 check', '≈ 11.9 V @3.3 kW, 2.2 mF']]);
    }
    u();
    H(body, `<p class="cap">Capacitor sizing trade: electrolytic caps are large and short-lived, and 100 Hz ripple pushes designers to bigger C, or to active ripple-cancelling circuits.</p>${MUST(`${HOT('Dominant output ripple of a single-phase PFC = 2 × line frequency (100/120 Hz)')}, independent of fsw.`, `${F('Irms = Io·√D')}${F('ΔVpp = P/(2π·f·Vo·C)')}`, `3-phase PFC has constant instantaneous power → no 100 Hz ripple → much smaller capacitor (dominant ripple at fsw).`)}`);
  } });

page({ id: 'pfc-control', mod: 'm2', wk: 3, stars: 3, topic: true, title: 'PFC control: dual loop & small-signal model', kw: 'average current control small signal state space transfer function bandwidth gv gi', lede: 'Concept-only: which variables are states/inputs, what the loops do, and how fast each should be.',
  render(body) {
    H(body, `<h2>Average current control (the standard PFC controller)</h2><div class="grid2">${CARD('Outer voltage loop (slow)', '<p>Measures Vo, compares with Vref, a PI regulator outputs the <b>amplitude</b> of the current reference. Bandwidth is kept <b>below 100 Hz</b> (typically 10-20 Hz) so it does not react to the 100 Hz ripple. If it were fast, it would distort the reference and raise THD.</p>')}${CARD('Inner current loop (fast)', '<p>Multiplies amplitude by the shape of |vs| to get iref = Iamp·|sin ωt|; a PI makes iL follow it by adjusting d. Bandwidth: well above 2×line but <b>≲ fsw/10</b> so it ignores switching ripple.</p>')}</div>
    <p>${HOT('Current-loop bandwidth: 500 Hz to 8 kHz for fsw = 80 kHz', 'W4Q7')}.</p>`);
    const L = lab(body, 'Where should the loop bandwidths sit?', 'Slide the switching frequency. Green zone = good range for the inner current loop. Voltage loop must stay far below.');
    const sc = L.scope({ xmin: 0, xmax: 5, ymin: 0, ymax: 1, yt: 1, xt: 5, xl: 'frequency', yl: '', h: 140, xfmt: x => { const f = Math.pow(10, x); return f >= 1e3 ? (f / 1e3).toFixed(0) + 'k' : f.toFixed(0); }, yfmt: () => '' }); const ro = L.readout();
    const v = controls(L.body, [{ k: 'fs', label: 'Switching frequency', min: 20, max: 150, step: 5, v: 80, unit: 'kHz', d: 0 }], u);
    function u() {
      const lo = Math.log10(500), hi = Math.log10(v.fs * 1e3 / 10), l2 = Math.log10(100);
      sc.draw([{ x: [lo, hi], y: [.6, .6], c: '--ch-d', w: 10 }, { x: [0, Math.log10(20)], y: [.6, .6], c: '--ch-v', w: 10 }], { v: [{ x: l2, c: '--bad', t: '2·fline = 100 Hz' }, { x: Math.log10(v.fs * 1e3), c: '--ch-i', t: 'fsw' }], t: [{ x: (lo + hi) / 2, y: .3, s: 'current loop', a: 'center', c: '--ch-d' }, { x: .2, y: .3, s: 'voltage loop', a: 'left', c: '--ch-v' }] });
      ro([['Current-loop range', '500 Hz to ' + (v.fs / 10).toFixed(1) + ' kHz'], ['Voltage loop', '< 20 Hz (below 100 Hz)']]);
    }
    u();
    H(body, `<h2>Small-signal modelling: the order of steps (W3Q1)</h2><ol class="steps"><li><div>Write the switching circuit equations (switch on / off).</div></li><li><div>Average over a switching period → <b>average large-signal model</b>.</div></li><li><div>Introduce perturbations: x = X + x̃ (this is the step where "perturbation is introduced").</div></li><li><div>Neglect products of two small terms → <b>linearise</b>.</div></li><li><div>Laplace transform → transfer functions Gi(s), Gv(s).</div></li></ol>
    <p>${HOT('Validity (W3Q8)')}: switching frequency ≫ line frequency (so averaging is fair) and perturbations ≪ operating point (so linearisation is fair).</p>
    <h2>State-space of the boost PFC</h2>${F('ẋ = A·x + B·u ,   y = C·x')}<div class="grid2">${CARD('Variables', `<p>States x = [iL , vc]ᵀ (energy-storage elements: inductor and capacitor) ${HOT('', 'W3Q9')}</p><p>Inputs u = [d , vs]ᵀ ${HOT('', 'W3Q10')}</p>`)}${CARD('Matrix sizes (2 states, 1 output)', `<p>${HOT('A = 2×2, B = 2×1, C = 1×2', 'W3Q7')} (as the course treats the input vector)</p>`)}</div>
    <h2>Plant transfer functions (concept)</h2>${F('Gi(s) = ĩL(s)/d̃(s)  :  duty → inductor current (inner loop plant)')}${F('Gv(s) = ṽo(s)/ĩL(s) = [Vs,pk·R /(2Vo)] / (1 + s·R·C)', 'W4Q8')}<p>${HOT('Gv is a single-pole low-pass with the load pole at 1/(RC)')}; DC gain Vs,pk·R/(2Vo) comes from power balance Vs,pk·Ipk/2 = Vo·Io.</p>`);
    const L3 = lab(body, 'Gv(s) magnitude: the voltage-loop plant', 'The pole 1/(2πRC) is very low (a few Hz) because C is large. That is why the voltage loop is slow.');
    const sg = L3.scope({ xmin: 0, xmax: 3, ymin: -40, ymax: 40, yt: 4, xt: 3, xl: 'Hz', yl: 'dB', h: 190, xfmt: x => Math.pow(10, x).toFixed(0) }); const ro3 = L3.readout();
    const w = controls(L3.body, [{ k: 'P', label: 'Power', min: 500, max: 7000, step: 100, v: 3300, unit: 'W', d: 0 }, { k: 'Cm', label: 'DC-link C', min: .2, max: 6, step: .1, v: 2.2, unit: 'mF', d: 1 }], u3);
    function u3() { const Vo = 400, R = Vo * Vo / w.P, Vpk = 325, C0 = w.Cm * 1e-3, g = Vpk * R / (2 * Vo); sg.draw([{ fn: x => { const f = Math.pow(10, x), wr = T2 * f * R * C0; return 20 * Math.log10(g / Math.sqrt(1 + wr * wr)); }, c: '--ch-v', w: 2.4 }], { v: [{ x: Math.log10(1 / (T2 * R * C0)), c: '--hot', t: 'pole' }] }); ro3([['R = Vo²/P', R.toFixed(1) + ' Ω'], ['DC gain', g.toFixed(1) + ' Ω (' + (20 * Math.log10(g)).toFixed(1) + ' dB)'], ['Pole', (1 / (T2 * R * C0)).toFixed(2) + ' Hz']]); }
    u3();
    H(body, MUST(`States = <b>iL, vc</b>; inputs = <b>d, vs</b>.`, `Order: perturb → neglect product of small terms → Laplace.`, `Voltage loop slow (&lt;100 Hz), current loop fast (500 Hz … fsw/10). ${HOT('Rule: high gain at 2·fline, BW ≲ fsw/10')}.`, `Gv = (Vs,pk/2Vo)·R/(1+sRC).`));
  } });

page({ id: 'bridgeless', mod: 'm2', wk: 4, stars: 3, topic: true, title: 'Bridgeless & totem-pole PFC', kw: 'totem pole bridgeless pfc polarity devices conduct', lede: 'Remove the diode bridge: fewer devices in the current path, higher efficiency. The key skill is knowing which device does what in each half-cycle.',
  render(body) {
    H(body, `<p>A conventional boost PFC has <b>3 devices</b> in the current path (2 bridge diodes + switch or boost diode). A bridgeless/totem-pole PFC has only <b>2</b> ${HOT('', 'W4Q6')}, so conduction loss drops. Totem-pole: one <b>HF leg</b> (S1, S2 at fsw, GaN/SiC) and one <b>line leg</b> (S3, S4 at 50 Hz, or slow diodes).</p>`);
    const L = lab(body, 'Totem-pole PFC: current path', 'Pick the line polarity and whether the boost switch is ON (inductor charging) or OFF (energy to load). Bright switches conduct.');
    const host = h('div'); let half = 'pos', st = 'chg';
    const P = { pos_chg: 'M40 60 V20 H250 V115 H330 V190 H130 V115 H40', pos_del: 'M40 60 V20 H250 V115 H330 V40 H520 V190 H130 V115 H40', neg_chg: 'M40 115 H130 V40 H330 V115 H250 V20 H40 V60', neg_del: 'M40 115 H130 V40 H520 V190 H330 V115 H250 V20 H40 V60' };
    const ON = { pos_chg: ['S2', 'S4'], pos_del: ['S1', 'S4'], neg_chg: ['S1', 'S3'], neg_del: ['S2', 'S3'] };
    const draw = () => {
      const key = half + '_' + st, on = ON[key];
      const sw = (n, x, y) => `<rect x="${x - 15}" y="${y - 22}" width="30" height="44" rx="6" style="fill:${on.includes(n) ? 'color-mix(in srgb,var(--ch-i) 45%,var(--surface))' : 'var(--surface2)'};stroke:var(--ink);stroke-width:${on.includes(n) ? 2.5 : 1}"/><text class="tx" x="${x}" y="${y + 4}" text-anchor="middle" style="font-weight:700">${n}</text>`;
      host.innerHTML = `<svg class="svgfig" viewBox="0 0 600 235" role="img" aria-label="totem pole PFC"><g class="ln" style="stroke-width:1.6"><path d="M40 60 V20 H250 V115 H330 M130 115 H40 M130 40 H520 M130 190 H520 M130 40 V190 M330 40 V190 M520 40 V190"/></g>
      <path d="${P[key]}" fill="none" style="stroke:var(--ch-i);stroke-width:4.5;stroke-linejoin:round;opacity:.9"/>
      <circle cx="40" cy="88" r="20" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><text x="40" y="92" text-anchor="middle" class="tx">~</text>
      <rect x="250" y="106" width="60" height="18" rx="4" style="fill:var(--surface);stroke:var(--ink);stroke-width:2"/><text class="tx2" x="280" y="148" text-anchor="middle">L</text>
      ${sw('S3', 130, 77)}${sw('S4', 130, 152)}${sw('S1', 330, 77)}${sw('S2', 330, 152)}
      <rect x="500" y="100" width="40" height="30" rx="4" style="fill:var(--surface2);stroke:var(--ink)"/><text class="tx2" x="520" y="120" text-anchor="middle">load</text>
      <text class="tx2" x="130" y="14" text-anchor="middle">line leg (50 Hz)</text><text class="tx2" x="330" y="14" text-anchor="middle">HF leg (fsw)</text>
      <text class="tx2" x="40" y="136" text-anchor="middle">source</text></svg>`;
      $('#tpi', L.body).innerHTML = half === 'pos' ? `<b>Positive half</b>: S4 stays ON (line frequency). <b>S2 is the boost switch</b>: ON → inductor charges through S2+S4; OFF → current goes through S1 (acts as the diode) to the load. S2 conducts <b>d(t)</b>, S1 conducts (1−d).` : `<b>Negative half</b>: S3 stays ON. <b>S1 is the boost switch</b> now, and S2 is the freewheeling (rectifying) switch. S2 now conducts <b>(1−d)</b>.`;
    };
    L.body.append(h('div', { id: 'tpi', class: 'cap' }));
    segmented(L.body, [['pos', 'vs > 0'], ['neg', 'vs < 0']], 'pos', k => { half = k; draw(); });
    segmented(L.body, [['chg', 'Boost switch ON'], ['del', 'Boost switch OFF']], 'chg', k => { st = k; draw(); });
    L.add(host); draw();
    H(body, `<h2>What the assignment asked</h2><ul><li>${HOT('S2 RMS: in one half it is the boost switch (d), in the other the rectifying switch (1−d)', 'W4Q1')}, so the RMS integral has d in one half-cycle and (1−d) in the other.</li><li>${HOT('Duty at the negative peak = 1 − Vpk/Vo = 0.187', 'W4Q2')} (230 V, Vo = 400 V): same law as boost PFC.</li><li>${HOT('Output ripple is still 100 Hz', 'W4Q3')}, even at 70 kHz switching.</li><li>${HOT('No diode bridge; L and C sizing the same as boost PFC', 'W4Q4')}.</li><li>Two-diode bridgeless (D1/D2 on top, S1/S2 at bottom): ${HOT('each switch is modulated in only one half-cycle', 'W4Q5')}; D1 conducts for vs&gt;0, D2 for vs&lt;0 ${HOT('', 'W4Q10')}.</li></ul>
    ${TBL(['', 'Conventional boost PFC', 'Totem-pole'], [['Devices in path', '3 (2 diodes + 1)', '2'], ['Hard-switching devices', '1 switch + boost diode', '2 fast switches (GaN/SiC, ZVS-friendly in CrM)'], ['Needs ZCD / current sensing for polarity', 'No', 'Yes: line-polarity detection (ZCD) to steer S3/S4'], ['DC-link ripple', '100 Hz', '100 Hz']])}
    ${MUST(`Totem-pole = 2 devices conduct (vs 3).`, `Roles of S1/S2 <b>swap each half-cycle</b>; line leg flips at the zero crossing (ZCD).`, `Same formulas: d = 1 − |vs|/Vo, L = Vo/(4ΔIfsw), ΔVpp = P/(2πfVoC).`, `Dual-loop average current control: current loop BW 500 Hz … fsw/10.`)}`);
  } });

page({ id: 'dcm-flyback', mod: 'm2', wk: 4, stars: 2, topic: true, title: 'DCM operation & flyback PFC', kw: 'dcm discontinuous flyback pfc isolated voltage follower', lede: 'Let the inductor current fall to zero every cycle and the converter becomes its own current shaper, which is cheap but peaky.',
  render(body) {
    H(body, `<p>In ${HOT('DCM (discontinuous conduction mode)')} the inductor current returns to zero before the next switching period. With <b>constant duty</b>, the peak current is ipk = |vs|·d·Ts/L, i.e. <b>proportional to the instantaneous input voltage</b>, so the average input current also follows |vs|. The converter is a <b>voltage follower</b>: ${HOT('only a single voltage loop is needed, no current loop', 'W4Q9')}.</p>`);
    const L = lab(body, 'CCM vs DCM inductor current (boost, fixed duty)', 'Reduce L until the current touches zero: that is the CCM/DCM boundary. Notice how DCM raises the peak for the same average.');
    const sc = L.scope({ xmin: 0, xmax: 60, ymin: 0, ymax: 30, yt: 3, xt: 6, xl: 'µs', yl: 'iL (A)', h: 220 }); const ro = L.readout();
    const v = controls(L.body, [{ k: 'vs', label: 'Input |vs|', min: 20, max: 325, step: 5, v: 150, unit: 'V', d: 0 }, { k: 'd', label: 'Duty d', min: .1, max: .8, step: .01, v: .4, d: 2 }, { k: 'L', label: 'Inductance', min: 20, max: 800, step: 10, v: 200, unit: 'µH', d: 0 }], u);
    function u() {
      const Vo = 400, fs = 50e3, T = 1e6 / fs; let i = 0; const X = [], Y = []; let sum = 0, n = 0, pk = 0, dcm = false;
      for (let k = 0; k < 3.01 * 1e3; k++) { const t = k * T / 1e3; const ph = (t % T) / T; let di; if (ph < v.d) di = v.vs / (v.L * 1e-6); else di = (v.vs - Vo) / (v.L * 1e-6); i += di * (T / 1e3) * 1e-6; if (i < 0) { i = 0; if (ph >= v.d) dcm = true; } X.push(t); Y.push(i); if (t > T) { sum += i; n++; pk = Math.max(pk, i); } if (t >= 60) break; }
      sc.set({ xmax: 3 * T, ymax: Math.max(10, Math.ceil(pk * 1.2 / 5) * 5) }); sc.draw([{ x: X, y: Y, c: '--ch-i', w: 2.4, fill: true }]);
      const ccmD = 1 - v.vs / Vo; ro([['Mode', dcm ? 'DCM' : 'CCM'], ['Average iL', (sum / n).toFixed(2) + ' A'], ['Peak iL', pk.toFixed(1) + ' A'], ['CCM would need d', ccmD.toFixed(2)]]);
    }
    u();
    H(body, `${TBL(['', 'CCM', 'DCM'], [['Control', 'Current loop + voltage loop', 'Single voltage loop is enough'], ['Peak / RMS current', 'Low', 'Higher (≈ 2× average peak)'], ['THD / PF', 'Best', 'Slightly worse'], ['Power range', 'High power (kW)', 'Low power (&lt; ~300 W)'], ['Diode reverse recovery', 'Serious (hard turn-off)', 'None (current zero at turn-off)']])}
    <h2>Flyback PFC (single-stage isolated PFC)</h2><p>A flyback converter after the bridge does PFC and isolation in one stage: when S1 is on, the primary magnetises; when off, the energy goes to the secondary. With turns ratio n and duty d at the input peak:</p>${F('Vo = (Vs,pk / n) · d / (1 − d)', 'W5Q7')}`);
    calc(body, 'Calculator: flyback PFC output voltage', [{ k: 'V', l: 'Grid rms', v: 230, u: 'V' }, { k: 'd', l: 'Duty at peak', v: .12, u: '' }, { k: 'n', l: 'n', v: .6, u: '' }], x => [['Vs,pk', (x.V * Math.SQRT2).toFixed(1) + ' V'], ['Vo', C.flybackPFC_Vo(x.V * Math.SQRT2, x.d, x.n).toFixed(1) + ' V']], 'W5Q7: 230 V, d = 0.12, n = 0.6 → ≈ 73.9 V.');
    H(body, `<p class="cap">Heads-up: for W5Q9 (240 V, Vo = 400 V, n = 2) the answer key is 0.64-0.67 while this formula gives 0.70, so the course defines n or the peak differently there. For the exam, remember the key value for that exact question; the method (volt-second balance at the input peak) is what matters.</p>
    <p>${HOT('Isolated-stage PFC question (W5Q6): d is 1 at |vs|=0 and falls as |vs| rises', 'W5Q6')} - write the inductor volt-seconds for each interval and equate to zero.</p>
    ${MUST(`DCM: iL,pk ∝ |vs| (voltage follower), single loop, higher peak/RMS, higher THD.`, `Flyback PFC: Vo = (Vpk/n)·d/(1−d).`, `Use DCM at low power, CCM at high power.`)}`);
  } });

;

page({ id: 'pwm', mod: 'm3', wk: 5, stars: 2, topic: true, title: 'Sinusoidal PWM (SPWM) of a half-bridge', kw: 'spwm pwm modulation index carrier harmonics pole voltage', lede: 'How a DC-link and two switches synthesise a sine: compare a sine (modulating) with a triangle (carrier).',
  render(body) {
    H(body, `<p>A half-bridge (one <b>pole</b>) has S1 on top and S2 below, with output "A" between them. The pole voltage v<sub>AO</sub> (O = fictitious DC-link midpoint) is either +Vdc/2 or −Vdc/2. Rule: ${HOT('S1 ON when modulating signal > carrier')}. The <b>average</b> of the pole voltage over one carrier cycle follows the modulating signal; that is the whole idea of PWM.</p>${F('Modulation index  m = Vm / Vc  (peak of modulating ÷ peak of carrier)')}${F('Fundamental peak = m · Vdc/2      RMS = m·Vdc / (2√2)', 'W5Q4')}`);
    const L = lab(body, 'SPWM generator and spectrum', 'Raise m for a larger fundamental. Raise mf (carrier ÷ fundamental) and the harmonics move far away from the fundamental, so a smaller filter is enough.');
    const s1 = L.scope({ xmin: 0, xmax: 20, ymin: -1.2, ymax: 1.2, yt: 4, xt: 4, xl: 'ms', yl: 'carrier/ref', h: 170 }); L.legend([['carrier', '--ch-b'], ['modulating wave', '--ch-i']]);
    const s2 = L.scope({ xmin: 0, xmax: 20, ymin: -1.3, ymax: 1.3, yt: 2, xt: 4, xl: 'ms', yl: 'vAO / (Vdc/2)', h: 130 }); L.legend([['pole voltage ±Vdc/2', '--ch-v']]);
    const s3 = L.scope({ xmin: 0, xmax: 60, ymin: 0, ymax: 1.1, yt: 4, xt: 6, xl: 'harmonic order (× 50 Hz)', yl: 'amplitude', h: 150 }); const ro = L.readout();
    const v = controls(L.body, [{ k: 'm', label: 'Modulation index m', min: 0.1, max: 1, step: .05, v: .8, d: 2 }, { k: 'mf', label: 'Frequency ratio mf', min: 9, max: 39, step: 2, v: 21, d: 0 }], u);
    function u() {
      const N = 4000, X = [], c = [], r = [], o = []; const Vdc2 = 1;
      for (let k = 0; k <= N; k++) { const t = k / N; X.push(t * 20); const ca = tri(t * v.mf - .25), rf = v.m * Math.sin(T2 * t); c.push(ca); r.push(rf); o.push(rf > ca ? 1 : -1); }
      s1.draw([{ x: X, y: c, c: '--ch-b', w: 1.2 }, { x: X, y: r, c: '--ch-i', w: 2.4 }]); s2.draw([{ x: X, y: o, c: '--ch-v', w: 1.5 }]);
      // DFT
      const H_ = 60, amp = []; for (let n = 1; n <= H_; n++) { let a = 0, b = 0; for (let k = 0; k < N; k++) { const th = T2 * n * k / N; a += o[k] * Math.cos(th); b += o[k] * Math.sin(th); } amp.push(2 * Math.hypot(a, b) / N); }
      s3.draw(amp.map((a, i) => ({ x: [i + 1, i + 1], y: [0, a], c: i === 0 ? '--ch-i' : '--ch-v', w: 3 })), { v: [{ x: v.mf, c: '--hot', t: 'mf' }, { x: 2 * v.mf, c: '--hot', t: '2mf' }] });
      ro([['Fundamental (measured)', amp[0].toFixed(2) + ' × Vdc/2'], ['Theory m', v.m.toFixed(2)], ['Carrier group at', 'h = ' + v.mf + ', ' + 2 * v.mf], ['1st side-bands', 'mf ± 2, ±4 (i=1, j even)']]);
    }
    u();
    H(body, `<h2>DC modulating signal = DC output</h2><p>If the modulating wave is held constant, the average pole voltage is constant: <b>V<sub>avg</sub> = D·Vdc</b> with D = Vm/Vc for a carrier from 0 to Vc. ${HOT('Vm = 4 V, carrier 0-5 V, Vdc = 200 V → D = 0.8 → 160 V', 'W5Q8')}. (For a bipolar ±Vc carrier, D = (1 + Vm/Vc)/2.)</p>`);
    calc(body, 'Calculator: average pole voltage (0 … Vc carrier)', [{ k: 'vm', l: 'Modulating level', v: 4, u: 'V' }, { k: 'vc', l: 'Carrier peak', v: 5, u: 'V' }, { k: 'vdc', l: 'Vdc', v: 200, u: 'V' }], x => [['Duty', (x.vm / x.vc).toFixed(2)], ['Vavg', (x.vm / x.vc * x.vdc).toFixed(1) + ' V']]);
    H(body, `<h2>Harmonics</h2><p>Harmonics appear as <b>sidebands around the carrier and its multiples</b>: h = i·mf ± j (in units of the fundamental). The lecture's rule: <i>i odd → j even; i even → j odd</i>. Harmonic content falls roughly as 1/order. Raising the carrier frequency pushes harmonics up so the filter can be smaller.</p><p class="cap">W5Q5 (10 kHz carrier, 50 Hz fundamental): official key is A, B, C = 10050, 10150, 20100 Hz. This is opposite to the lecture rule above (which would give 10100). Remember the key for that exact question only; see the explanation under it.</p>
    ${MUST(`${HOT('Fundamental peak = m·Vdc/2; RMS = m·Vdc/(2√2)', 'W5Q4')}`, `Average pole voltage is proportional to the modulating signal (W5Q8).`, `m ≤ 1 = linear range; maximum line-line RMS in SPWM = 0.612·m·Vdc.`, `Modulating frequency must be ≪ carrier (mf large).`)}`);
  } });

page({ id: 'vsc3', mod: 'm3', wk: 5, stars: 3, topic: true, title: '3-phase AC-DC converter (VSC): phasors & inductor', kw: 'three phase active rectifier voltage source converter phasor inductance power flow unity pf', lede: 'The grid-side inductor is the "bridge" between two voltage sources. Power flows from the leading phasor to the lagging one.',
  render(body) {
    H(body, `<p>A 3-phase AC-DC converter is six switches (three half-bridge poles) on a DC link, connected to the grid through an inductor L per phase. Per phase: grid voltage <b>Vs</b> — L — converter voltage <b>Vc</b> = pole voltage of the converter. The phasor equation is ${F('Vs − Vc = jωL · I')}</p>
    <ul><li>${HOT('AC → DC (rectifier): the converter voltage must LAG the source voltage', 'W5Q1')}; DC → AC (inverter): it must lead.</li><li>Power flows from the <b>leading</b> to the <b>lagging</b> source: P = (3/2)·Vs·Vc·sin δ / (ωL) (peak values).</li><li>At unity PF the inductor voltage is perpendicular to Vs, so ${F('|Vc|² = |Vs|² + (ωL·I)²')}</li></ul>`);
    const L = lab(body, 'Phasor diagram (per phase)', 'Blue = grid voltage Vs, purple = converter voltage Vc, orange = inductor drop jωL·I, green = line current I (drawn small). Switch mode to see how the lag/lead flips.');
    const host = h('div'); L.add(host); let mode = 'rect';
    const draw = () => {
      const Vs = 100, XI = +$('#xi')?.value || 45; const sgn = mode === 'rect' ? 1 : -1; // Vc = Vs - j X I (rect, I in phase) ; inverter: I opposite -> Vc = Vs + jXI
      const cx = 60, cy = 110, k = 2.2; const vsx = cx + Vs * k, vcx = vsx, vcy = cy + sgn * XI * k; const ang = Math.atan2(sgn * XI, Vs) * 180 / Math.PI;
      host.innerHTML = `<svg class="svgfig" viewBox="0 0 480 230" role="img" aria-label="phasor diagram"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
      <line x1="${cx}" y1="${cy}" x2="${vsx}" y2="${cy}" style="stroke:var(--ch-v);stroke-width:4" marker-end="url(#ah)"/><text class="tx" x="${vsx + 6}" y="${cy + 4}" fill="var(--ch-v)">Vs</text>
      <line x1="${cx}" y1="${cy}" x2="${vcx}" y2="${vcy}" style="stroke:var(--ch-b);stroke-width:4" marker-end="url(#ah)"/><text class="tx" x="${vcx + 8}" y="${vcy + (sgn > 0 ? 14 : -4)}" fill="var(--ch-b)">Vc</text>
      <line x1="${vcx}" y1="${vcy}" x2="${vsx}" y2="${cy}" style="stroke:var(--ch-i);stroke-width:3;stroke-dasharray:6 4" marker-end="url(#ah)"/><text class="tx2" x="${vsx - 70}" y="${(cy + vcy) / 2 + 4}">jωL·I</text>
      <line x1="${cx}" y1="${cy}" x2="${cx + (sgn > 0 ? 1 : -1) * 70}" y2="${cy}" style="stroke:var(--ch-d);stroke-width:2.5;opacity:.0"/>
      <text class="tx" x="14" y="${cy - 100}">δ = ${(-ang).toFixed(1)}° (Vc ${sgn > 0 ? 'lags' : 'leads'} Vs)</text><text class="tx2" x="14" y="${cy - 80}">${sgn > 0 ? 'Rectifier: I in phase with Vs (unity PF), power AC → DC' : 'Inverter: I opposite to Vs, power DC → AC'}</text>
      <text class="tx2" x="14" y="222">|Vc| = ${Math.hypot(Vs, XI).toFixed(1)}  (= √(Vs² + (ωLI)²) → larger than Vs: DC link must exceed grid peak)</text></svg>`;
    };
    const xi = h('input', { type: 'range', id: 'xi', min: 5, max: 90, value: 45, 'aria-label': 'inductor drop', oninput: draw });
    segmented(L.body, [['rect', 'Rectifier (AC → DC)'], ['inv', 'Inverter (DC → AC)']], 'rect', m => { mode = m; draw(); });
    L.add(h('div', { class: 'ctl' }, h('label', {}, 'Inductor drop ωL·I'), xi, h('output', {}, '5-90 % of Vs'))); draw();
    H(body, `<h2>3-phase power is constant (no 100 Hz ripple)</h2><p>For balanced unity-PF currents, instantaneous power p = va·ia + vb·ib + vc·ic = (3/2)·Vpk·Ipk = <b>constant</b>. Therefore ${HOT('the DC-link ripple has no 2×line component, only switching-frequency ripple (so dominant ripple = fsw = 5 kHz in W5Q3)', 'W5Q3')}, and the DC capacitor can be far smaller than in the single-phase PFC.</p>`);
    const L2 = lab(body, 'Single-phase vs 3-phase instantaneous power', 'Same total average power. One pulsates at 100 Hz, the other is flat.');
    const sc = L2.scope({ xmin: 0, xmax: 40, ymin: -1.2, ymax: 3.2, yt: 4, xt: 4, xl: 'ms', yl: 'power (pu)', h: 220 }); L2.legend([['phase voltages (3-φ)', '--ch-b'], ['1-φ power p(t)', '--ch-i'], ['3-φ total power', '--ch-d']]);
    sc.draw([0, 1, 2].map(k => ({ fn: t => Math.sin(T2 * 50 * t / 1000 - k * T2 / 3), c: '--ch-b', w: 1, dash: [3, 3] })).concat([{ fn: t => 1 - Math.cos(T2 * 100 * t / 1000), c: '--ch-i', w: 2.4 }, { fn: t => 1, c: '--ch-d', w: 3, n: 4 }]));
    H(body, `<h2>Inductor sizing (W5Q2)</h2><ol class="steps"><li><div>Modulation index m = Vm/Vc (e.g. 2.7 V / 3 V = 0.9). Converter peak phase voltage Vc = m·Vdc/2.</div></li><li><div>Grid peak phase voltage Vs = √2·VLL/√3.</div></li><li><div>Peak current at unity PF: Ipk = 2P/(3·Vs).</div></li><li><div>Inductor drop ωL·Ipk = √(Vc² − Vs²), so L = √(Vc² − Vs²)/(2π·f·Ipk).</div></li></ol>`);
    calc(body, 'Calculator: grid inductor of a 3-phase active rectifier', [{ k: 'V', l: 'Line-line rms', v: 400, u: 'V' }, { k: 'Vdc', l: 'DC link', v: 750, u: 'V' }, { k: 'm', l: 'Modulation index', v: .9, u: '' }, { k: 'P', l: 'Power', v: 22000, u: 'W' }], x => { const r = C.vscL(x.V, x.Vdc, x.m, x.P); return [['Vs (peak, phase)', r.Vs.toFixed(1) + ' V'], ['Vc (peak, phase)', r.Vc.toFixed(1) + ' V'], ['Ipk', r.Ipk.toFixed(1) + ' A'], ['L per phase', (r.L * 1e3).toFixed(2) + ' mH']]; }, 'W5Q2 → 6.03 mH (the course uses π = 3 in this question, so any value ≈ 6 mH is accepted).');
    H(body, MUST(`${HOT('AC→DC: Vconv lags Vs; DC→AC: leads', 'W5Q1')}. Power goes from leading to lagging.`, `${F('L = √(Vc² − Vs²) / (ω·Ipk) ;  Ipk = 2P/(3Vs)')}`, `3-phase: constant power → only fsw ripple on the DC link (no 100 Hz).`, `DC link must be higher than the grid line-line peak (boost-type converter), e.g. 750 V for 400 V mains.`));
  } });

page({ id: 'dq-control', mod: 'm3', wk: 6, stars: 3, topic: true, title: 'dq control, PLL & PI design (3D)', kw: 'dq transformation park clarke pll pi controller decoupling power factor id iq', lede: 'Rotate your point of view with the grid and sinusoids become DC values that a plain PI controller can track.',
  render(body) {
    H(body, `<h2>abc → αβ → dq</h2><ul><li><b>abc → αβ (Clarke)</b>: three dependent sinusoids (va+vb+vc = 0) become two orthogonal ones. Still sinusoidal at 60 Hz (stationary frame). ${HOT('Result: still 60 Hz AC', 'W6Q7')}</li><li><b>αβ → dq (Park)</b>: rotate the axes at the grid angle θ (from a PLL). For balanced voltages, vd and vq become <b>DC</b>.</li><li>Independent variables: αβ and dq are orthogonal pairs, so their components are independent. The cross-coupling ωL terms are a dynamic coupling in the model, cancelled by feed-forward decoupling ${HOT('', 'W6Q5')}.</li></ul>`);
    const L = lab(body, '3D: space vector in the stationary frame vs the rotating (dq) frame', 'Vertical axis = time (past is lower). In the stationary view the vector draws a helix; in the rotating view the frame turns with it and the trace is a straight vertical line (DC). Use the angle error to see what a PLL error does.');
    let mode = 'stat'; const v = controls(L.body, [{ k: 'eps', label: 'PLL angle error ε', min: -60, max: 60, step: 1, v: 0, unit: '°', d: 0 }], () => { });
    segmented(L.body, [['stat', 'Stationary αβ'], ['rot', 'Rotating dq']], 'stat', m => { mode = m; });
    const N = 150; let arrow, trail, dax, qax, aax, bax;
    const api = Three.mount(L.body, { label: mode === 'stat' ? 'αβ' : 'dq', cam: [0, 0, 7.5], auto: false, setup: (a) => {
      const T = a.T; const mk = (dir, col, len, hl) => { const ah = new T.ArrowHelper(new T.Vector3(...dir), new T.Vector3(0, 0, 0), len, a.col(col).getHex(), hl || .25, .14); a.pivot.add(ah); return ah; };
      aax = mk([1, 0, 0], '--muted', 2.1); bax = mk([0, 0, -1], '--muted', 2.1); mk([0, 1, 0], '--muted', 1.2);
      dax = mk([1, 0, 0], '--ch-v', 2.0); qax = mk([0, 0, -1], '--ch-d', 2.0); arrow = mk([1, 0, 0], '--ch-i', 1.6, .3);
      const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(new Float32Array(N * 3), 3)); trail = new T.Line(g, new T.LineBasicMaterial({ color: a.col('--ch-i') })); a.pivot.add(trail);
      a.pivot.rotation.x = .5; a.pivot.position.y = 1.0;
    }, tick: (t, a) => {
      const w = 2.2, eps = v.eps * Math.PI / 180, R = 1.6, T = a.T; const th = w * t + eps; // d-axis angle
      const P = trail.geometry.attributes.position; const stat = mode === 'stat';
      for (let k = 0; k < N; k++) { const tau = t - (N - 1 - k) * .04; const ang = stat ? w * tau : -eps; const y = -(N - 1 - k) * .04 * .5; P.setXYZ(k, R * Math.cos(ang), y, -R * Math.sin(ang)); }
      P.needsUpdate = true;
      const setDir = (ah, ang) => ah.setDirection(new T.Vector3(Math.cos(ang), 0, -Math.sin(ang)));
      if (stat) { setDir(aax, 0); setDir(bax, Math.PI / 2); setDir(dax, th); setDir(qax, th + Math.PI / 2); setDir(arrow, w * t); }
      else { setDir(dax, 0); setDir(qax, Math.PI / 2); setDir(aax, -th); setDir(bax, -th + Math.PI / 2); setDir(arrow, -eps); }
    } });
    H(body, `<p class="cap">Blue = d axis, green = q axis, grey = α/β axes, orange = voltage vector. With ε = 0 the vector sits exactly on the d-axis: vd = Vpk, vq = 0. That is exactly what the PLL enforces.</p>`);
    const L2 = lab(body, 'Waveforms: abc and dq', 'Balanced abc sinusoids become constant vd and vq. With a PLL error ε, vq ≠ 0: the PLL drives vq to zero.');
    const sc = L2.scope({ xmin: 0, xmax: 40, ymin: -1.3, ymax: 1.3, yt: 4, xt: 4, xl: 'ms', yl: 'pu', h: 220 }); L2.legend([['va', '--ch-b'], ['vb', '--ch-x'], ['vc', '--ch-i'], ['vd', '--ch-v'], ['vq', '--ch-d']]); const ro = L2.readout();
    const w2 = controls(L2.body, [{ k: 'e', label: 'PLL angle error ε', min: -60, max: 60, step: 1, v: 0, unit: '°', d: 0 }], u2);
    function u2() { const e = w2.e * Math.PI / 180; sc.draw([0, 1, 2].map(k => ({ fn: t => Math.sin(T2 * 50 * t / 1000 - k * T2 / 3), c: ['--ch-b', '--ch-x', '--ch-i'][k], w: 1.2, n: 300 })).concat([{ fn: t => Math.cos(e), c: '--ch-v', w: 3, n: 3 }, { fn: t => -Math.sin(e), c: '--ch-d', w: 3, n: 3 }])); ro([['vd', Math.cos(e).toFixed(2) + ' pu'], ['vq', (-Math.sin(e)).toFixed(2) + ' pu']]); }
    u2();
    H(body, `<h2>Power factor from id, iq (very likely asked)</h2><p>Whichever axis the <b>voltage</b> is aligned to carries the active current; the other axis carries reactive current.</p>${F('d-axis ∥ Vs:  PF = id / √(id²+iq²)   (iq = 0 ⇒ unity PF)', 'W6Q2')}${F('q-axis ∥ Vs:  PF = iq / √(id²+iq²)', 'W6Q3')}<p>${HOT('Aligning the current with the q-axis while d is on the voltage gives zero PF (purely reactive)', 'W6Q4')}.</p>`);
    const cc = lab(body, 'Calculator: power factor from dq currents', 'W6Q2: id = 8, iq = 10, d on voltage → 0.625.  W6Q3: iq = 2·id, q on voltage → 0.894.'); const ro3 = cc.readout(); const inp = {}; const row = h('div', { class: 'calc' }); const mkI = (k, l, val) => { const i = h('input', { type: 'number', step: 'any', value: val }); const lb = h('label', {}, l, i); i.addEventListener('input', run); inp[k] = i; return lb; }; const sel = h('select', { class: 'sel', 'aria-label': 'aligned axis', onchange: run }, h('option', { value: 'd' }, 'd-axis'), h('option', { value: 'q' }, 'q-axis'));
    row.append(h('div', { class: 'inputs' }, mkI('id', 'id (A)', 8), mkI('iq', 'iq (A)', 10), h('label', {}, 'Voltage aligned to', sel))); cc.body.insertBefore(row, ro3 && cc.body.children[1]);
    function run() { const id = +inp.id.value, iq = +inp.iq.value, m = Math.hypot(id, iq), a = sel.value === 'd' ? id : iq; ro3([['|i|', m.toFixed(2) + ' A'], ['Power factor', (a / m).toFixed(3)], ['Reactive part', (sel.value === 'd' ? iq : id) + ' A']]); } run();
    H(body, `<h2>Controller structure</h2><p>${HOT('Outer DC-link voltage loop', '')} (slow) → sets id* (active power). iq* = 0 for unity PF (or ≠ 0 to supply reactive power). Two inner PI current loops (fast) with <b>decoupling</b> (±ωL·id, ±ωL·iq) and grid-voltage feed-forward → dq reference voltages → inverse transform → SPWM. The PLL supplies θ and locks vq to 0.</p>
    <h2>PI design by pole-zero cancellation</h2><p>Plant (L with series resistance R): G(s) = 1/(R + sL), pole at R/L. PI = Kp + Ki/s = Kp(1 + Ki/(Kp s)) has a zero at s = −Ki/Kp. ${HOT('Cancel the plant pole: Ki/Kp = R/L, i.e. Kp/Ki = L/R', 'W6Q9')}.</p>`);
    calc(body, 'Calculator: PI zero placement', [{ k: 'L', l: 'L', v: 12, u: 'mH' }, { k: 'R', l: 'R', v: 10, u: 'mΩ' }], x => [['Kp/Ki = L/R', (x.L / x.R).toFixed(3) + ' s'], ['Plant pole R/L', (x.R / x.L).toFixed(4) + ' rad/s']], 'W6Q9: 12 mH / 10 mΩ = 1.2 s.');
    H(body, `<p>${HOT('Time constants: Ts = L/R (plant) is huge (≥ 100 ms) compared to the converter delay Td ≈ 1.5·Tsw (tens of µs): Ts ≫ Td', 'W6Q10')}. So after cancelling the slow plant pole, the loop is shaped only by Td and the integrator, and the bandwidth is set by Td.</p>
    ${MUST(`Balanced abc → dq gives DC; αβ is still AC (W6Q7).`, `Which axis is on the voltage? That axis carries the active current (W6Q2-Q4).`, `${F('Kp/Ki = L/R')}  (pole-zero cancellation)`, `iq* = 0 → unity PF. Decoupling cancels the ωL cross terms. The PLL keeps vq = 0.`)}`);
  } });

;
/* ===== Module 4: isolated DC-DC ===== */
const sq = (ph) => { const x = ((ph % 1) + 1) % 1; return x < .5 ? 1 : -1; }; // ±1 square, phase in cycles

page({ id: 'forward', mod: 'm4', wk: 6, stars: 3, topic: true, title: 'Forward converter & core reset', kw: 'forward converter demagnetizing winding reset flux dmax stress dual switch', lede: 'A buck converter with a transformer. The catch: the core only gets pushed one way, so it must be reset every cycle.',
  render(body) {
    H(body, `<p>Forward converter = <b>buck + transformer</b>. While S1 is on, energy goes straight to the output through the forward diode, so ${F('Vo = n · Vin · D      (n = Ns/Np)', 'W6Q8')}${HOT('Example: Vin = 400 V, Np:Ns = 5:2, ton = 10 µs, toff = 40 µs → D = 0.2, n = 0.4 → Vo = 32 V', 'W6Q8')}.</p>
    <p><b>Problem:</b> during ton the magnetising current ramps up (volt-seconds Vin·ton). The transformer is unipolar, so unless this flux is removed before the next cycle, the core <b>walks up the B-H curve into saturation</b>. A <b>reset (demagnetising) circuit</b> applies a negative voltage for long enough.</p>
    <ul><li>${HOT('Flux swing: 0 → Φmax only (one quadrant of the B-H loop)', 'W6Q1')}; push-pull/half/full-bridge swing −Φmax … +Φmax.</li><li><b>Third (demag) winding Nd</b>: returns magnetising energy to the source via a diode. Reset voltage = Vin·Np/Nd. Reset time = ton·Nd/Np.</li></ul>${F('Dmax = 1 / (1 + Nd/Np)       (reset must finish within the off-time)', 'W7Q4')}${F('Switch stress  VS1 = Vin·(1 + Np/Nd)', 'W7Q3')}`);
    const L = lab(body, 'Core reset in a forward converter', 'Choose Nd/Np and duty D. If D is above Dmax the flux does not return to zero each cycle, and so it ratchets upward: saturation.');
    const sc1 = L.scope({ xmin: 0, xmax: 6, ymin: -2.2, ymax: 1.4, yt: 4, xt: 6, xl: 'switching periods', yl: 'primary vp / Vin', h: 150 }); L.legend([['primary voltage', '--ch-v']]);
    const sc2 = L.scope({ xmin: 0, xmax: 6, ymin: 0, ymax: 2.5, yt: 5, xt: 6, xl: 'switching periods', yl: 'flux (norm.)', h: 170 }); L.legend([['core flux (magnetising current)', '--ch-i']]); const ro = L.readout();
    const v = controls(L.body, [{ k: 'r', label: 'Nd / Np', min: .5, max: 3, step: .5, v: 1, d: 1 }, { k: 'D', label: 'Duty D', min: .1, max: .8, step: .01, v: .4, d: 2 }], u);
    function u() {
      const Dmax = 1 / (1 + v.r), X = [], vp = [], ph = []; let f = 0; const st = 400;
      for (let k = 0; k <= 6 * st; k++) { const t = k / st, c = t % 1; let vv; if (c < v.D) { vv = 1; f += vv / st; } else if (f > 1e-9) { vv = -1 / v.r; f += vv / st; if (f < 0) f = 0; } else vv = 0; X.push(t); vp.push(vv); ph.push(f); }
      sc1.draw([{ x: X, y: vp, c: '--ch-v', w: 2.2 }]); sc2.draw([{ x: X, y: ph, c: '--ch-i', w: 2.4, fill: true }], { h: [{ y: .75, c: '--bad', t: 'saturation level' }] });
      ro([['Dmax = 1/(1+Nd/Np)', Dmax.toFixed(3)], ['Your D', v.D.toFixed(2)], ['Reset', v.D <= Dmax + 1e-9 ? 'complete ✔' : 'INCOMPLETE ✘'], ['Switch stress', (1 + 1 / v.r).toFixed(2) + ' × Vin']]);
    }
    u();
    H(body, `<h2>Reset variants</h2>${TBL(['Method', 'Switch stress', 'Dmax', 'Comment'], [['Demag winding (Nd)', 'Vin(1 + Np/Nd)', '1/(1+Nd/Np)', 'Lossless; most common. Nd = Np → Dmax 0.5, stress 2Vin'], [HOT('Dual-switch (2 switches, 2 clamp diodes)', 'W7Q2'), 'Vin per switch', '0.5', 'Lossless, lower stress, but two switches and two diodes'], [HOT('RCD / resistor + diode reset', 'W6Q6'), 'Vin + reset voltage on S1; diode DS1 sees ≈ Vin', '< 0.5', 'Lossy: reset energy is burned in the resistor']])}`);
    calc(body, 'Calculator: forward converter', [{ k: 'Vin', l: 'Vin', v: 100, u: 'V' }, { k: 'Np', l: 'Np', v: 2, u: 'turns' }, { k: 'Nd', l: 'Nd', v: 2, u: 'turns' }, { k: 'Ns', l: 'Ns', v: 3, u: 'turns' }, { k: 'f', l: 'fsw', v: 20, u: 'kHz' }, { k: 'ton', l: 'ton', v: 20, u: 'µs' }], x => { const T = 1e3 / x.f, D = x.ton / T, Dm = C.forwardDmaxDemag(x.Np, x.Nd); return [['D', D.toFixed(3)], ['Dmax', Dm.toFixed(3)], ['ton,max', (Dm * T).toFixed(1) + ' µs'], ['Vo = n·Vin·D', C.forwardVo(x.Vin, x.Ns / x.Np, D).toFixed(1) + ' V'], ['S1 stress', (x.Vin * (1 + x.Np / x.Nd)).toFixed(0) + ' V'], ['Reset OK?', D <= Dm ? 'yes' : 'NO']]; }, 'W7Q9 → 60 V; W7Q4 (Nd = 3Np, 10 kHz) → ton,max = 25 µs; W7Q3 → 4/3·Vin (key option C).');
    H(body, `<p class="cap">W7Q3: the printed option C reads "2/3 Vin" but physics gives 4/3·Vin (1 + Np/Nd with Np:Nd = 1:3); the official key is C. If this exact question appears, choose the key's option C.</p>${MUST(`${F('Vo = n·Vin·D ;  Dmax = 1/(1+Nd/Np) ;  VS1 = Vin(1 + Np/Nd)')}`, `Flux uses <b>one quadrant</b> (0 … Bmax); bridges use both.`, `Dual-switch forward: each switch blocks Vin only; leakage energy returns to Vin (lossless).`, `Resistor/diode (RCD) reset: lossy.`)}`);
  } });

page({ id: 'bridges', mod: 'm4', wk: 7, stars: 2, topic: true, title: 'Push-pull, half-bridge & full-bridge', kw: 'push pull half bridge full bridge isolated dc dc stress inductor ripple', lede: 'Bipolar-driven transformers: both halves of the B-H loop are used, so the core can be smaller than in a forward converter.',
  render(body) {
    H(body, `${TBL(['', 'Push-pull', 'Half-bridge', 'Full-bridge'], [['Switches', '2 (+ centre-tapped primary)', '2 + split capacitors', '4'], ['Switch voltage stress', HOT('2·Vin', 'W7Q5'), 'Vin', 'Vin'], ['Primary voltage', 'Vin', 'Vin/2', 'Vin'], ['Flux swing', '± (uses both quadrants)', '±', '±'], ['Typical power', '&lt; 1 kW', '≤ 1-2 kW', 'kW to tens of kW'], ['Risk', 'Flux (DC) imbalance → saturation', 'Cap balance', 'Flux imbalance (needs blocking cap)']])}
    ${F('Vo = n · Vin · D      (n = Ns/Np ; D = on-fraction of each half-cycle seen by the rectifier)')}<p>The output inductor ripples at <b>2·fsw</b> (two pulses per period), so ${F('L = Vo·(1 − D) / (2·fsw·ΔI)', 'W7Q10')}${HOT('W7Q1: Vin = 50 V, Ns = 5, Np = 2, D = 0.4 → 50 V (key)', 'W7Q1')}. ${HOT('Bridges swing the flux ±Bmax, so a smaller core than the forward converter can be used', 'W7Q8')}.</p>`);
    const L = lab(body, 'Full-bridge waveforms', 'Primary voltage vab (+Vin, 0, −Vin), rectified secondary voltage (twice the switching frequency) and output-inductor current ripple.');
    const s1 = L.scope({ xmin: 0, xmax: 2, ymin: -1.3, ymax: 1.3, yt: 2, xt: 4, xl: 'switching periods', yl: 'vab / Vin', h: 120 }); L.legend([['vab on primary', '--ch-v']]);
    const s2 = L.scope({ xmin: 0, xmax: 2, ymin: 0, ymax: 1.3, yt: 2, xt: 4, xl: 'switching periods', yl: 'rectified', h: 120 }); L.legend([['rectified secondary voltage (n·|vab|)', '--ch-b']]);
    const s3 = L.scope({ xmin: 0, xmax: 2, ymin: 0, ymax: 2, yt: 4, xt: 4, xl: 'switching periods', yl: 'iL', h: 120 }); L.legend([['inductor current (2·fsw ripple)', '--ch-i']]); const ro = L.readout();
    const v = controls(L.body, [{ k: 'D', label: 'Duty D (per half-cycle)', min: .1, max: .95, step: .01, v: .5, d: 2 }], u);
    function u() {
      const X = [], A = [], B = [], I = []; const N = 800; let i = 1; const D = v.D, ripple = .5; const Vo = D; const ys = []; let acc = 0;
      for (let k = 0; k <= 2 * N; k++) { const t = k / N, c = (t * 2) % 1, half = Math.floor(t * 2) % 2; const on = c < D; const vab = on ? (half ? -1 : 1) : 0; X.push(t); A.push(vab); B.push(Math.abs(vab)); acc += (Math.abs(vab) - Vo) / N * 2 * .6; ys.push(acc); }
      const m = ys.reduce((a, b) => a + b, 0) / ys.length; s1.draw([{ x: X, y: A, c: '--ch-v', w: 2.2 }]); s2.draw([{ x: X, y: B, c: '--ch-b', w: 2.2, fill: true }]); s3.draw([{ x: X, y: ys.map(y => y - m + 1), c: '--ch-i', w: 2.2 }]);
      ro([['Vo/(n·Vin)', D.toFixed(2)], ['Ripple frequency', '2·fsw'], ['Ripple ∝ (1−D)', (1 - D).toFixed(2)]]);
    }
    u();
    calc(body, 'Calculator: output inductor of a full-bridge (W7Q10)', [{ k: 'P', l: 'Power', v: 500, u: 'W' }, { k: 'Vo', l: 'Vo', v: 100, u: 'V' }, { k: 'Vin', l: 'Vin', v: 400, u: 'V' }, { k: 'n', l: 'Ns/Np', v: .5, u: '' }, { k: 'f', l: 'fsw', v: 20, u: 'kHz' }, { k: 'r', l: 'Ripple of Io', v: 5, u: '%' }], x => { const Io = x.P / x.Vo, dI = x.r / 100 * Io, D = x.Vo / (x.n * x.Vin); return [['Io', Io.toFixed(2) + ' A'], ['ΔI', dI.toFixed(3) + ' A'], ['D', D.toFixed(2)], ['L', (C.fullBridgeL(x.Vo, D, dI, x.f * 1e3) * 1e3).toFixed(2) + ' mH']]; }, 'Expected 5 mH for the W7Q10 data.');
    H(body, MUST(`${HOT('Push-pull switch stress = 2·Vin', 'W7Q5')}; half/full-bridge = Vin.`, `Output filter ripple is at <b>2·fsw</b>; L = Vo(1−D)/(2·fsw·ΔI).`, `Bridges: flux ± → smaller core than forward (W7Q8).`, `Full-bridge with phase shift (next topics) enables soft switching.`));
  } });

page({ id: 'softsw', mod: 'm4', wk: 7, stars: 2, topic: true, title: 'Switching loss & soft switching (ZVS/ZCS)', kw: 'zvs zcs switching loss dead time coss dv/dt soft switching', lede: 'Losses appear when voltage and current overlap. Soft switching removes the overlap.',
  render(body) {
    H(body, `<p>In a hard-switched transition, voltage and current are both nonzero for the commutation time: area of overlap = loss. For linear ramps:</p>${F('E_sw = (1/6) · V · I · t_sw       P_sw = E_sw · fsw', 'W7Q7')}${HOT('60 A, 200 V, 200 ns → 400 µJ', 'W7Q7')}<p>If the voltage rises fully first and then the current falls, E = ½VI·t<sub>i</sub> + ½VI·t<sub>v</sub>.</p>`);
    const L = lab(body, 'Turn-off: hard vs soft', 'Hard: voltage rises while the current is still flowing → big overlap (shaded). ZCS turn-off: current is already zero. ZVS turn-on is the same idea with the voltage already at zero before the switch closes.');
    const sc = L.scope({ xmin: 0, xmax: 400, ymin: 0, ymax: 1.25, yt: 5, xt: 4, xl: 'ns', yl: 'v, i (norm.)', h: 230 }); L.legend([['switch voltage v', '--ch-v'], ['switch current i', '--ch-i'], ['loss  v·i', '--bad']]); const ro = L.readout(); let mode = 'hard';
    segmented(L.body, [['hard', 'Hard switching'], ['zcs', 'ZCS turn-off']], 'hard', m => { mode = m; u(); });
    const v = controls(L.body, [{ k: 't', label: 'Transition time', min: 20, max: 200, step: 5, v: 100, unit: 'ns', d: 0 }, { k: 'V', label: 'Bus voltage', min: 100, max: 800, step: 50, v: 200, unit: 'V', d: 0 }, { k: 'I', label: 'Current', min: 5, max: 100, step: 5, v: 60, unit: 'A', d: 0 }], u);
    function u() {
      const t0 = 100, t1 = t0 + v.t; const vi = t => t < t0 ? 0 : t > t1 ? 1 : (t - t0) / v.t; const ii = mode === 'hard' ? (t => t < t0 ? 1 : t > t1 ? 0 : 1 - (t - t0) / v.t) : (t => t < t0 - 40 ? 1 : t > t0 - 40 + 40 ? 0 : 1 - (t - t0 + 40) / 40);
      const X = rng(401, i => i), pr = X.map(t => vi(t) * ii(t));
      sc.draw([{ x: X, y: pr, c: '--bad', w: 1.4, fill: true }, { x: X, y: X.map(vi), c: '--ch-v', w: 2.4 }, { x: X, y: X.map(ii), c: '--ch-i', w: 2.4 }]);
      const E = mode === 'hard' ? C.swLossTri(v.V, v.I, v.t * 1e-9) : 0;
      ro([['Energy per turn-off', (E * 1e6).toFixed(0) + ' µJ'], ['Loss @ 100 kHz', (E * 1e5).toFixed(1) + ' W'], ['Formula', mode === 'hard' ? 'V·I·t/6' : '≈ 0']]);
    }
    u();
    H(body, `<h2>Pairing to remember</h2><div class="grid2">${CARD('ZVS ↔ turn-ON', '<p>Zero Voltage Switching: the switch\'s voltage is already ~0 (its body diode conducts) when the gate turns it on. Removes the Coss·V² discharge loss. Needed for MOSFET/GaN at high frequency.</p>')}${CARD('ZCS ↔ turn-OFF', '<p>Zero Current Switching: current is already 0 when the switch opens. Helps IGBT tail current.</p>')}</div><p class="cap">${HOT('Match soft-switching types: ZVS = turn-on, ZCS = turn-off', 'W7Q12')}</p>
    <h2>Half-bridge leg: who gets ZVS?</h2><p>With C1, C2 across S1, S2 and an inductive load current Io leaving the mid-point: during dead time the current <b>discharges the mid-point to the lower rail</b> (the body diode of S2 takes it), so ${HOT('S2 turns on at zero voltage; S1 does not', 'W7Q6')}. For the opposite current direction S1 gets ZVS. Dead time must be long enough for the full voltage swing, but shorter than the time the current would reverse.</p>${F('dv/dt = Io / (C1 + C2) = Io / (2·Coss)', 'W7Q11')}`);
    calc(body, 'Calculator: dead-time voltage slew', [{ k: 'Io', l: 'Load current', v: 10, u: 'A' }, { k: 'C', l: 'Coss per switch', v: 1, u: 'nF' }, { k: 'V', l: 'Bus voltage', v: 200, u: 'V' }], x => { const dv = x.Io / (2 * x.C * 1e-9) / 1e9; return [['dv/dt', dv.toFixed(2) + ' V/ns'], ['Min dead time to swing Vbus', (x.V / dv).toFixed(0) + ' ns']]; }, 'W7Q11: ≈ 5 V/ns for Io = 10 A, Coss = 1 nF.');
    H(body, MUST(`${F('E = V·I·t/6 (linear overlap)')}`, `${HOT('ZVS ↔ turn-on; ZCS ↔ turn-off')}.`, `Load-current direction decides which switch of a leg gets ZVS.`, `${F('dv/dt = Io/(2·Coss)')}`));
  } });

page({ id: 'psfb', mod: 'm4', wk: 8, stars: 3, topic: true, title: 'Phase-shifted full bridge (PSFB)', kw: 'psfb phase shift full bridge zvs leading lagging leg duty loss dead time resonant inductance', lede: 'The most-asked topic of the isolated DC-DC module (10 questions in Week 8). Know the leading/lagging legs and the output equation.',
  render(body) {
    H(body, `<p>A full bridge with two legs: the <b>leading leg</b> (A) and the <b>lagging leg</b> (B). Every switch is on for 50 % of the period. Instead of changing the duty, the <b>phase shift φ</b> between the legs is varied. When the diagonal switches overlap, vab = ±Vin (power transfer); otherwise vab = 0 (freewheeling).</p>${F('Vo / Vin = n · (1 − φ/180°)', 'W8Q10')}<p>${HOT('φ = 0°: full output; φ = 180°: vab = 0 all the time → Vo = 0', 'W8Q6')}. Example: φ = 72° → Vo/Vin = 1 − 72/180 = 0.6.</p>`);
    const L = lab(body, 'Phase-shift modulation', 'Leg A and leg B gate waveforms, the primary voltage vab and the rectified output. Move φ and watch the zero-voltage (freewheeling) intervals appear.');
    const s1 = L.scope({ xmin: 0, xmax: 2, ymin: -.2, ymax: 3.4, yt: 1, xt: 4, xl: 'periods', yl: '', h: 130, yfmt: () => '' }); L.legend([['leg A (leading) pole', '--ch-v'], ['leg B (lagging) pole', '--ch-i']]);
    const s2 = L.scope({ xmin: 0, xmax: 2, ymin: -1.3, ymax: 1.3, yt: 2, xt: 4, xl: 'periods', yl: 'vab / Vin', h: 120 }); L.legend([['vab', '--ch-b']]); const ro = L.readout();
    const v = controls(L.body, [{ k: 'ph', label: 'Phase shift φ', min: 0, max: 180, step: 1, v: 72, unit: '°', d: 0 }, { k: 'n', label: 'Turns ratio n', min: .5, max: 2, step: .1, v: 1, d: 1 }], u);
    function u() {
      const N = 800, X = [], A = [], B = [], V = []; const sh = v.ph / 360;
      for (let k = 0; k <= 2 * N; k++) { const t = k / N, a = sq(t), b = sq(t - sh); X.push(t); A.push(2.3 + (a > 0 ? 1 : 0) * .9); B.push(1.0 + (b > 0 ? 1 : 0) * .9 - 1); V.push((a - b) / 2); }
      s1.draw([{ x: X, y: A.map(y => y), c: '--ch-v', w: 2 }, { x: X, y: B.map(y => y + 0.1), c: '--ch-i', w: 2 }]); s2.draw([{ x: X, y: V, c: '--ch-b', w: 2.2, fill: true }]);
      ro([['Vo / Vin = n(1−φ/180)', (v.n * (1 - v.ph / 180)).toFixed(3)], ['Zero-voltage time', (v.ph / 180 * 100).toFixed(0) + ' % of half-period']]);
    }
    u();
    H(body, `<h2>Why PSFB is popular: soft switching (ZVS)</h2><p>Dead time + the leakage inductance (Llkg) + the switch capacitances (Coss) give ZVS. The key difference between the legs is <b>how much energy is available to charge/discharge Coss</b>:</p>${TBL(['', 'Leading leg', 'Lagging leg'], [['Current during transition', 'Primary current is held up by the large output filter inductor (reflected, Lo/n²) in series with Llkg', 'Secondary is shorted by the rectifier, so only Llkg is in the loop'], ['Available energy', '<b>½ (Llkg + Lo/n²) I²</b>  (large)', '<b>½ Llkg I²</b>  (small)'], ['Light-load ZVS', 'Easy, current almost constant', 'Lost first: add extra series Lr or magnetising current'], ['Transition shape', 'Linear (constant current)', 'Resonant (Llkg with Coss)']])}<p class="cap">${HOT('', 'W8Q1')}${HOT('', 'W8Q2')}${HOT('', 'W8Q7')} - all three assignment questions ask exactly this comparison.</p>`);
    const L2 = lab(body, 'ZVS energy budget: leading vs lagging leg', 'Lower the load current: the lagging leg runs out of energy first (red). The required energy ≈ Coss·Vin².');
    const bars = h('div', { class: 'heat' }); L2.add(bars); const ro2 = L2.readout();
    const w = controls(L2.body, [{ k: 'I', label: 'Primary current at switching', min: .5, max: 20, step: .5, v: 6, unit: 'A', d: 1 }, { k: 'Llk', label: 'Leakage Llkg', min: 1, max: 30, step: 1, v: 5, unit: 'µH', d: 0 }, { k: 'Lo', label: 'Output filter Lo (reflected)', min: 20, max: 300, step: 10, v: 100, unit: 'µH', d: 0 }, { k: 'C', label: 'Coss per switch', min: .05, max: 1, step: .05, v: .2, unit: 'nF', d: 2 }, { k: 'Vin', label: 'Vin', min: 100, max: 800, step: 50, v: 400, unit: 'V', d: 0 }], u2);
    function u2() {
      const el = .5 * (w.Llk + w.Lo) * 1e-6 * w.I * w.I * 1e6, eg = .5 * w.Llk * 1e-6 * w.I * w.I * 1e6, req = w.C * 1e-9 * w.Vin * w.Vin * 1e6; const mx = Math.max(el, eg, req) * 1.05;
      bars.innerHTML = [['Leading leg energy', el, el >= req], ['Lagging leg energy', eg, eg >= req], ['Required (≈Coss·Vin²)', req, null]].map(([n, e, ok]) => `<div class="heatrow"><span>${n}</span><div class="bar"><i style="width:${e / mx * 100}%;${ok === false ? 'background:var(--bad)' : ok === null ? 'background:var(--ch-b)' : ''}"></i></div><b style="min-width:5em">${e.toFixed(0)} µJ</b></div>`).join('');
      ro2([['Leading leg ZVS', el >= req ? 'yes ✔' : 'no ✘'], ['Lagging leg ZVS', eg >= req ? 'yes ✔' : 'no ✘']]);
    }
    u2();
    H(body, `<h2>Formulas (all numerically examined)</h2>${F('Leading-leg dead time:  td > 2·Coss·Vin / (n·Io)   (linear charging by ~constant current)', 'W8Q3')}${F('Duty-cycle loss:  Dloss = 4·Llkg·Io·fs / (n·Vin)   ⇒   Llkg = Dloss·n·Vin / (4·Io·fs)', 'W8Q5')}${F('Lagging-leg resonance:  Ltotal = 1 / (ωr²·Cs) ,  extra L = Ltotal − Llkg', 'W8Q8')}`);
    calc(body, 'Calculator: PSFB design numbers', [{ k: 'C', l: 'Coss', v: 100, u: 'pF' }, { k: 'Vin', l: 'Vin', v: 200, u: 'V' }, { k: 'n', l: 'n (Ns/Np)', v: 1, u: '' }, { k: 'Io', l: 'Io', v: 5, u: 'A' }, { k: 'fs', l: 'fs', v: 50, u: 'kHz' }, { k: 'dl', l: 'Allowed duty loss', v: 5, u: '%' }], x => [['Leading-leg td,min (W8Q3 → 8 ns)', (C.psfbLeadDead(x.C * 1e-12, x.Vin, x.n, x.Io) * 1e9).toFixed(1) + ' ns'], ['Llkg for given Dloss (W8Q5 → 10 µH)', (x.dl / 100 * x.n * x.Vin / (4 * x.Io * x.fs * 1e3) * 1e6).toFixed(2) + ' µH']]);
    calc(body, 'Calculator: extra series inductance for a resonant lagging leg', [{ k: 'f', l: 'Target resonance', v: 100, u: 'kHz' }, { k: 'C', l: 'Cs', v: 100, u: 'nF' }, { k: 'Llk', l: 'Llkg', v: 5, u: 'µH' }], x => { const wr = 2 * 3.14 * x.f * 1e3, Lt = 1 / (wr * wr * x.C * 1e-9); return [['Ltotal', (Lt * 1e6).toFixed(2) + ' µH'], ['Extra L (W8Q8 → 20.4 µH)', (Lt * 1e6 - x.Llk).toFixed(2) + ' µH']]; }, 'The course uses π = 3.14.');
    H(body, `<h2>Duty-cycle loss and the small-signal model</h2><p>The leakage inductance slows the primary-current reversal, so the secondary sees the full voltage for slightly less time. ${HOT('Dloss ∝ IL/Vin', 'W8Q9')}: effective duty deff = d − Dloss. In the small-signal model: higher Vin → smaller Dloss → effective duty ↑ (same sign as d̃); higher IL → effective duty ↓ (opposite sign).</p>
    <p>${HOT('Lagging-leg dead time (W8Q4: Vin = 100 V, 1:1, 10 Ω, 50 V, Llkg = 10 µH, Coss = 500 pF → key ≈ 100 ns)', 'W8Q4')}: the transition is a resonant ring of Llkg with 2·Coss, with time constant √(Llkg·2Coss) = √(10 µH · 1 nF) = 100 ns. Remember: lagging legs need ~10× the dead time of leading legs.</p>
    ${MUST(`${F('Vo/Vin = n(1 − φ/180°)')}  (φ = phase lag between leading and lagging leg, 0° = full overlap/max output, 180° = 0 V; other texts define effective duty differently)`, `${HOT('Leading leg: Llkg + Lo/n² energy (easy ZVS). Lagging leg: Llkg only (loses ZVS at light load).')}`, `${F('td,lead > 2CVin/(nIo) ;  Dloss = 4·Llkg·Io·fs/(nVin)')}`, `A larger Llkg (or extra Lr) widens the lagging-leg ZVS range but increases duty loss: a trade-off.`)}`);
  } });

page({ id: 'dab', mod: 'm4', wk: 9, stars: 3, topic: true, title: 'Dual active bridge (DAB) & phase-shift power flow', kw: 'dab dual active bridge single phase shift sps power flow bidirectional v2g', lede: 'Two full bridges, a high-frequency transformer and a series inductor: bidirectional, soft-switched, no output inductor.',
  render(body) {
    H(body, `<p>${HOT('DAB = two full bridges + HF transformer + series inductor L (leakage or external)', 'W9Q1')}. It is <b>bidirectional</b> (vehicle-to-grid ready) and needs <b>no output filter inductor</b>. Each bridge produces a ±V square wave; with <b>single phase shift (SPS)</b> δ between them, the inductor sees the difference, and power flows from the leading to the lagging bridge.</p>${F('P = Vin · Vo′ · δ(π − δ) / (2π² · fs · L)      (δ in rad, Vo′ = Vo/n)', 'W9Q7')}${F('Pmax at δ = 90° :  Pmax = Vin · Vo′ / (8·fs·L)', 'W9Q8')}`);
    const L = lab(body, 'DAB: voltages, inductor current and power', 'Change δ (negative = reverse power flow) and the voltage ratio. When Vin = Vo′ the current has a flat top (the volt-seconds across L cancel).');
    const s1 = L.scope({ xmin: 0, xmax: 2, ymin: -1.5, ymax: 1.5, yt: 4, xt: 4, xl: 'switching periods', yl: 'volts (norm.)', h: 150 }); L.legend([['primary bridge vp', '--ch-v'], ['secondary bridge vs′ (reflected)', '--ch-b']]);
    const s2 = L.scope({ xmin: 0, xmax: 2, ymin: -2, ymax: 2, yt: 4, xt: 4, xl: 'switching periods', yl: 'iL (A)', h: 150 }); L.legend([['inductor current iL', '--ch-i']]);
    const s3 = L.scope({ xmin: -180, xmax: 180, ymin: -1.1, ymax: 1.1, yt: 4, xt: 6, xl: 'phase shift δ (°)', yl: 'P / Pmax', h: 150 }); L.legend([['P(δ) ∝ δ(π−δ)', '--ch-d']]); const ro = L.readout();
    const v = controls(L.body, [{ k: 'd', label: 'Phase shift δ', min: -90, max: 90, step: 1, v: 45, unit: '°', d: 0 }, { k: 'Vi', label: 'Vin', min: 100, max: 800, step: 10, v: 400, unit: 'V', d: 0 }, { k: 'Vo', label: 'Vo′ = Vo/n', min: 100, max: 800, step: 10, v: 400, unit: 'V', d: 0 }, { k: 'L', label: 'L', min: 10, max: 200, step: 5, v: 50, unit: 'µH', d: 0 }, { k: 'fs', label: 'fs', min: 20, max: 200, step: 5, v: 100, unit: 'kHz', d: 0 }], u);
    function u() {
      const N = 1000, sh = v.d / 360, X = [], P1 = [], P2 = [], iL = []; let acc = 0; const Lh = v.L * 1e-6, fs = v.fs * 1e3, dt = 1 / (fs * N);
      for (let k = 0; k <= 2 * N; k++) { const t = k / N, vp = v.Vi * sq(t), vs = v.Vo * sq(t - sh); X.push(t); P1.push(vp / 400); P2.push(vs / 400); acc += (vp - vs) / Lh * dt; iL.push(acc); }
      const m = iL.reduce((a, b) => a + b, 0) / iL.length; const I = iL.map(x => x - m); let pw = 0; for (let k = N; k < 2 * N; k++) pw += v.Vi * sq(k / N) * I[k]; pw /= N;
      s1.draw([{ x: X, y: P1, c: '--ch-v', w: 2 }, { x: X, y: P2, c: '--ch-b', w: 2, dash: [5, 3] }]); const im = Math.max(2, Math.ceil(Math.max(...I.map(Math.abs)) * 1.2)); s2.set({ ymin: -im, ymax: im }); s2.draw([{ x: X, y: I, c: '--ch-i', w: 2.4 }]);
      const Pm = C.dabPmax(v.Vi, v.Vo, 1, fs, Lh); s3.draw([{ fn: x => Math.sign(x) * (Math.abs(x) * Math.PI / 180) * (Math.PI - Math.abs(x) * Math.PI / 180) / (Math.PI * Math.PI / 4), c: '--ch-d', w: 2.4, n: 360 }], { v: [{ x: v.d, c: '--ch-i' }, { x: 90, c: '--hot', t: '90° (max)' }] });
      ro([['P (formula)', (C.dabP(v.Vi, v.Vo, 1, v.d * Math.PI / 180, fs, Lh) / 1e3).toFixed(2) + ' kW'], ['P (from waveforms)', (pw / 1e3).toFixed(2) + ' kW'], ['Pmax', (Pm / 1e3).toFixed(2) + ' kW'], ['Current shape', Math.abs(v.Vi - v.Vo) < 5 ? 'flat top (Vin = Vo′)' : 'sloped top']]);
    }
    u();
    H(body, `<h2>Key facts</h2><ul><li>${HOT('Vin = Vo/n ⇒ trapezoidal, flat-top current', 'W9Q5')}; mismatched voltages give sloped tops. With a 3:1 transformer (Np:Ns = 3:1) and a flat top, Vo = Vin/3 ${HOT('', 'W9Q9')}.</li><li>Power ∝ δ(π−δ): rises to max at 90° then falls. Operate below 90°.</li><li>${HOT('Fraction of Pmax: P = x·Pmax ⇒ δ = (1 − √(1−x))/2 · 180°; for x = 0.2: δ ≈ 9.5°', 'W9Q2')}.</li><li>${HOT('Phase shift between the two legs inside one bridge (dual phase shift) gives vab = +V, 0, −V, 0', 'W9Q6')}: an extra control freedom to reduce circulating current.</li></ul>`);
    calc(body, 'Calculator: DAB power', [{ k: 'Vi', l: 'Vin', v: 200, u: 'V' }, { k: 'Vo', l: 'Vo', v: 800, u: 'V' }, { k: 'n', l: 'Np:Ns turn ratio n=Ns/Np', v: 2, u: '' }, { k: 'd', l: 'δ', v: 60, u: '°' }, { k: 'L', l: 'L', v: 10, u: 'µH' }, { k: 'f', l: 'fs', v: 100, u: 'kHz' }], x => [['Vo′ = Vo/n', (x.Vo / x.n).toFixed(0) + ' V'], ['P(δ)', (C.dabP(x.Vi, x.Vo, x.n, x.d * Math.PI / 180, x.f * 1e3, x.L * 1e-6) / 1e3).toFixed(2) + ' kW'], ['Pmax', (C.dabPmax(x.Vi, x.Vo, x.n, x.f * 1e3, x.L * 1e-6) / 1e3).toFixed(2) + ' kW']], 'W9Q7 → 8.89 kW. For W9Q8 use Vin = 400, Vo = 400, n = 4, L = 100 µH, fs = 100 kHz, δ = 90° → 500 W.');
    H(body, MUST(`${F('P = Vin·Vo′·δ(π−δ)/(2π²·fs·L)')}${F('Pmax = Vin·Vo′/(8·fs·L)  at δ = 90°')}`, `Bidirectional (V2G); no output inductor; ZVS over a wide range when Vin ≈ Vo′.`, `Equal (reflected) voltages → flat-top current.`, `Power flows from the bridge that <b>leads</b> in phase.`));
  } });

page({ id: 'magnetics', mod: 'm4', wk: 9, stars: 2, topic: true, title: 'Magnetics: flux, core loss, copper loss & air gap (3D)', kw: 'transformer inductor core loss steinmetz copper loss air gap flux density area', lede: 'Concepts only: what sets the core size, why the loss curve is U-shaped and why inductors have an air gap.',
  render(body) {
    H(body, `<h2>Core area from volt-seconds</h2><p>Faraday: v = N·dΦ/dt ⇒ ${F('Ac = V·t / (N · ΔBpp)       (volt-seconds ÷ turns ÷ flux-density swing)', 'W9Q3')}Higher allowed ΔB or more turns → smaller core. (W9Q3 key = 200 with λ = 400, N = 10, ΔBpp = 2×0.1 T.)</p>
    <h2>Loss trade-off: the U-curve</h2><p>${F('Pcore = k · f^α · ΔB^β  (Steinmetz)       Pcu ≈ a / ΔB²')}Copper loss falls with higher ΔB (fewer turns, shorter wire); core loss rises. Total loss has a minimum. For β = 2: ${F('d(Pcu+Pcore)/dΔB = 0  ⇒  ΔBopt = (a/b)^(1/4)', 'W9Q4')}`);
    const L = lab(body, 'Transformer loss vs flux swing', 'Slide the exponent β and the frequency factor. Higher frequency lifts the core-loss curve and moves the optimum to lower ΔB.');
    const sc = L.scope({ xmin: 0.05, xmax: 1, ymin: 0, ymax: 40, yt: 4, xt: 5, xl: 'ΔB (arb.)', yl: 'loss (W)', h: 240 }); L.legend([['copper a/ΔB²', '--ch-i'], ['core b·ΔBβ', '--ch-v'], ['total', '--ch-d']]); const ro = L.readout();
    const v = controls(L.body, [{ k: 'a', label: 'Copper coefficient a', min: .5, max: 6, step: .1, v: 2, d: 1 }, { k: 'b', label: 'Core coefficient b (∝ f^α)', min: 5, max: 80, step: 1, v: 30, d: 0 }, { k: 'be', label: 'Exponent β', min: 2, max: 3, step: .1, v: 2, d: 1 }], u);
    function u() { const f1 = x => v.a / (x * x), f2 = x => v.b * Math.pow(x, v.be), f3 = x => f1(x) + f2(x); let bm = .05, pm = 1e9; for (let x = .05; x <= 1; x += .001) { const p = f3(x); if (p < pm) { pm = p; bm = x; } } sc.draw([{ fn: f1, c: '--ch-i', w: 1.6, dash: [5, 3] }, { fn: f2, c: '--ch-v', w: 1.6, dash: [5, 3] }, { fn: f3, c: '--ch-d', w: 3, fill: true }], { v: [{ x: bm, c: '--hot', t: 'optimum' }] }); ro([['Optimum ΔB (numeric)', bm.toFixed(3)], ['(a/b)^¼ (β = 2 exact)', C.optDeltaB(v.a, v.b).toFixed(3)], ['Minimum loss', pm.toFixed(1) + ' W']]); }
    u();
    H(body, `<p>${HOT('Core loss vs ΔB for several frequencies: the lowest curve is the lowest frequency', 'W9Q10')}.</p>
    <h2>Air gap in inductors</h2><p>An inductor stores energy in its magnetic field; a ferrite core alone would saturate at tiny currents. The <b>air gap</b> takes most of the reluctance and most of the stored energy:</p>${F('L ≈ μ0 · N² · Ac / lg        B = μ0·N·I / lg')}<ul><li>${HOT('Gap allows more ampere-turns before saturation', 'W10Q6')} and makes L set by the gap, not by the material permeability or tolerances.</li><li>The gap lowers L for the same turns (needs more turns), and does <b>not</b> change Bsat of the material.</li><li>Fringing flux at the gap causes extra winding loss: keep windings away from the gap.</li></ul>`);
    const L2 = lab(body, '3D inductor core: change the air gap', 'Flux particles circulate round the core. A bigger gap → lower L, lower B for the same current (more headroom before saturation). Drag to rotate.');
    const g = controls(L2.body, [{ k: 'g', label: 'Air gap lg', min: .05, max: 1.5, step: .05, v: .8, unit: 'mm', d: 2 }, { k: 'I', label: 'Current', min: 1, max: 20, step: 1, v: 5, unit: 'A', d: 0 }], u2); const ro2 = L2.readout();
    let gapMesh, parts = [], upper, lower;
    const api = Three.mount(L2.body, { label: 'gapped core', cam: [0, 0, 8], setup: a => {
      const T = a.T, mat = new T.MeshStandardMaterial({ color: 0x6d7782, metalness: .3, roughness: .5 }), W = 3.2, Hh = 2.6, t = .55, d = .8;
      const box = (w, h_, x, y) => { const m = new T.Mesh(new T.BoxGeometry(w, h_, d), mat); m.position.set(x, y, 0); a.pivot.add(m); return m; };
      box(t, Hh + t, -W / 2, 0); box(W + t, t, 0, Hh / 2 + t / 2 - .0); box(W + t, t, 0, -Hh / 2 - t / 2 + 0);
      upper = box(t, Hh / 2, W / 2, Hh / 4); lower = box(t, Hh / 2, W / 2, -Hh / 4);
      const cm = new T.MeshStandardMaterial({ color: a.col('--ch-i'), metalness: .6, roughness: .35 });
      for (let k = 0; k < 12; k++) { const r = new T.Mesh(new T.TorusGeometry(.56, .08, 10, 28), cm); r.rotation.x = Math.PI / 2; r.position.set(-W / 2, -1 + k * .18, 0); a.pivot.add(r); }
      const pm = new T.MeshBasicMaterial({ color: a.col('--ch-v') }); for (let k = 0; k < 28; k++) { const s = new T.Mesh(new T.SphereGeometry(.09, 10, 10), pm); a.pivot.add(s); parts.push(s); }
    }, tick: (tm, a) => {
      const W = 3.2, Hh = 2.6, gp = g.g * .35, sp = g.I / 20; upper.position.y = Hh / 4 + gp / 2; lower.position.y = -Hh / 4 - gp / 2; upper.scale.y = 1 - gp / Hh * 0; 
      const per = 2 * (W + Hh); parts.forEach((s, i) => { let p = ((i / parts.length) + tm * (.08 + .35 * sp * (.3 / (g.g + .15)))) % 1 * per; let x, y; if (p < Hh / 2 * 2) { x = W / 2; y = -Hh / 2 + p; } else if (p < Hh + W) { x = W / 2 - (p - Hh); y = Hh / 2; } else if (p < 2 * Hh + W) { x = -W / 2; y = Hh / 2 - (p - Hh - W); } else { x = -W / 2 + (p - 2 * Hh - W); y = -Hh / 2; } s.position.set(x, y, .45); });
    } });
    function u2() { const mu0 = 4e-7 * Math.PI, N = 30, Ac = 1e-4, lg = g.g * 1e-3; const Lh = mu0 * N * N * Ac / lg, B = mu0 * N * g.I / lg; ro2([['L ≈ μ0N²Ac/lg (N = 30, Ac = 1 cm²)', (Lh * 1e6).toFixed(0) + ' µH'], ['B in the gap = μ0NI/lg', B.toFixed(2) + ' T'], ['Saturation (≈0.3 T ferrite)', B > .3 ? 'SATURATED ✘' : 'ok ✔']]); } u2();
    H(body, MUST(`${F('Ac = V·t / (N·ΔBpp)')}`, `${F('ΔBopt = (a/b)^(1/4)  for β = 2')}  Copper ↓ with ΔB, core ↑ with ΔB: U-shaped total.`, `Core loss ∝ f^α·ΔB^β: at a given ΔB a higher frequency means higher loss.`, `${HOT('Air gap: higher ampere-turns before saturation; L set by the gap; Bsat unchanged; L ≈ μ0N²Ac/lg', 'W10Q6')}`));
  } });
