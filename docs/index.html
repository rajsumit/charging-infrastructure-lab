page({ id: 'ac-type2', mod: 'm5', wk: 10, stars: 3, topic: true, title: 'AC Type-2 charging: CP & PP signalling (SAE J1772 / IEC 61851)', kw: 'control pilot cp pp proximity pilot duty cycle state a b c d e f pwm current limit resistor', lede: 'Two pins do all the talking in AC charging: CP says "what state am I in and how much current may you take", PP says "which plug/cable am I".',
  render(body) {
    H(body, `<div class="grid2">${CARD('CP: Control Pilot', '<p>A <b>±12 V, 1 kHz PWM</b> generated by the EVSE. The <b>duty cycle</b> tells the car the maximum current available; the <b>voltage level</b> (changed by the car with resistors/diode) tells the EVSE the car\'s state.</p>')}${CARD('PP: Proximity Pilot', '<p>A resistor in the plug (R6) to PE. The car measures the voltage at PP to know (1) the plug is inserted (so it blocks driving) and (2) the <b>cable current rating</b>.</p>')}</div>
    <p>${HOT('AC Type-1/2 communication = SAE J1772 PWM signalling (low-level)', 'W1Q9')}; ISO 15118/DIN 70121 is the high-level PLC used for DC; OCPP is EVSE ↔ back-end. ${HOT('', 'W10Q7')}EVSE → car: PWM duty. Car → EVSE: voltage level via S2/resistors.</p><h2>The six states (CP high-level voltage)</h2>${TBL(['State', 'CP voltage', 'Meaning'], [['A', '+12 V (DC)', 'No vehicle connected'], ['B', '+9 V PWM', 'Vehicle connected, not ready (S2 open)'], ['C', '+6 V PWM', 'Vehicle ready, <b>charging</b> (S2 closed, R2 = 1.3 kΩ in parallel)'], ['D', '+3 V PWM', 'Charging, ventilation required'], ['E', '0 V', 'Error / EVSE off / short to PE'], ['F', '−12 V', 'EVSE unavailable']])}<p class="cap">${HOT('Mnemonic: A-12, B-9, C-6, D-3, E-0, F-minus', 'W10Q1')} (drops 3 V per step).</p>`);
    const L = lab(body, 'Control-pilot simulator', 'Pick the vehicle state and the duty cycle. The PWM low level is −12 V when the vehicle diode is present (B, C, D).');
    const sc = L.scope({ xmin: 0, xmax: 3, ymin: -14, ymax: 14, yt: 4, xt: 6, xl: 'ms', yl: 'CP volts', h: 210, xfmt: x => x.toFixed(1) }); const ro = L.readout(); let st = 'C';
    segmented(L.body, ['A', 'B', 'C', 'D', 'E', 'F'].map(s => [s, 'State ' + s]), 'C', s => { st = s; u(); });
    const v = controls(L.body, [{ k: 'd', label: 'PWM duty cycle', min: 3, max: 96, step: 1, v: 60, unit: '%', d: 0 }], u);
    function u() {
      const hi = { A: 12, B: 9, C: 6, D: 3, E: 0, F: -12 }[st], pwm = ['B', 'C', 'D'].includes(st); const X = [], Y = [];
      if (!pwm) { X.push(0, 3); Y.push(hi, hi); } else for (let k = 0; k < 3; k++) { const t0 = k; X.push(t0, t0 + v.d / 100, t0 + v.d / 100, t0 + 1); Y.push(hi, hi, -12, -12); }
      sc.draw([{ x: X, y: Y, c: '--ch-v', w: 2.6, step: true }], { h: [{ y: 0, c: '--muted' }] });
      const D = v.d, Imax = D < 10 ? 'digital comm. (5 %)' : D <= 85 ? (D * .6).toFixed(1) + ' A' : D <= 96 ? ((D - 64) * 2.5).toFixed(0) + ' A' : '-';
      ro([['CP high level', hi + ' V'], ['Frequency', '1 kHz (T = 1000 µs)'], ['On-time', (D / 100 * 1000).toFixed(0) + ' µs'], ['Max current offered', pwm || st === 'A' ? Imax : 'no PWM']]);
    }
    u();
    H(body, `<h2>Duty cycle ↔ current (IEC 61851-1)</h2>${F('10 % ≤ D ≤ 85 % :   Imax = D[%] × 0.6  A', 'W10Q2')}${F('85 % < D ≤ 96 % :   Imax = (D[%] − 64) × 2.5  A')}<ul><li>${HOT('36 A → 60 % duty', 'W10Q2')}; ${HOT('48 A → 80 % duty → on-time at 1 kHz = 800 µs', 'W10Q3')}; 30 % → 18 A.</li><li>${HOT('3-7 % (nominally 5 %) = "digital communication required": DC / ISO 15118', '')}. An AC Type-2 plug plugged into a CCS2 inlet uses 10-85 % ${HOT('(30 % and 60 % are valid, 5 % and 4 % are not)', 'W10Q10')}.</li></ul>`);
    calc(body, 'Calculator: duty ↔ current', [{ k: 'I', l: 'Max current', v: 36, u: 'A' }, { k: 'f', l: 'CP frequency', v: 1, u: 'kHz' }], x => { const D = C.ampToDuty(x.I); return [['Duty', D.toFixed(1) + ' %'], ['On-time', (D / 100 / x.f * 1e3).toFixed(0) + ' µs']]; }, 'W10Q2 → 60 %; W10Q3 → 80 % / 800 µs.');
    H(body, `<h2>Proximity pilot (PP)</h2><p>The vehicle supplies +5 V through R4 = 330 Ω; the plug carries R6 to PE; the car has R5 = 4.7 kΩ to PE. When plugged in, V<sub>PP</sub> = 5·(R5∥R6)/(R4 + R5∥R6).</p>`);
    calc(body, 'Calculator: PP voltage and cable rating', [{ k: 'R', l: 'R6 in plug', v: 300, u: 'Ω' }], x => [['R5 ∥ R6', C.par(4700, x.R).toFixed(0) + ' Ω'], ['VPP', C.ppV(x.R).toFixed(2) + ' V']], 'W10Q4: R6 = 300 Ω → 2.30 V.');
    H(body, TBL(['R6', 'VPP (typ.)', 'Cable rating'], [['1.5 kΩ', '3.87 V', '13 A (also CCS2 DC)'], ['680 Ω', '3.21 V', '20 A'], ['220 Ω', '1.94 V', '32 A'], ['100 Ω', '1.14 V', '63 A']]) + `<h2>CP circuit voltage levels</h2><p>EVSE: 12 V through R1 = 1 kΩ. Vehicle: diode + R3 = 2.74 kΩ (state B). When ready, S2 closes and R2 = 1.3 kΩ is added in parallel: R<sub>veh</sub> = 2.74 k ∥ 1.3 k = 881 Ω → V<sub>CP</sub> = 12·881/(1000 + 881) = 5.6 V ≈ the nominal +6 V of state C ${HOT('', 'W10Q5')}.</p>`);
    calc(body, 'Calculator: CP level for a vehicle resistance', [{ k: 'R', l: 'Vehicle resistance', v: 881, u: 'Ω' }], x => [['VCP high', C.cpV(x.R).toFixed(2) + ' V']], 'R = 2740 → 8.9 V (B), 881 → 5.6 V (C), 246 → 2.9 V (D).');
    H(body, `<h2>Charging handshake (AC)</h2><ol class="steps"><li><div><b>A → B:</b> plug inserted; EVSE sees 9 V and starts the PWM (the duty = what the cable/EVSE can supply).</div></li><li><div>Car reads PWM duty and PP (cable rating), picks I = min(EVSE, cable, OBC).</div></li><li><div><b>B → C:</b> car closes S2 (adds R2) → CP drops to 6 V.</div></li><li><div>EVSE sees 6 V → closes the AC contactor. Charging.</div></li><li><div>Unplug/stop: car opens S2 (back to B), EVSE opens the contactor.</div></li></ol>${MUST(`${HOT('States: A +12, B +9, C +6, D +3, E 0, F −12')}`, `${F('I(A) = 0.6 × D(%) for 10-85 %')}  1 kHz PWM.`, `PP = cable rating via R6 (1.5k = 13 A, 680 = 20 A, 220 = 32 A, 100 = 63 A).`, `EVSE → EV: PWM duty. EV → EVSE: voltage level.`)}`);
  } });

page({ id: 'ccs2', mod: 'm5', wk: 11, stars: 3, topic: true, title: 'CCS2 DC charging: PLC, SLAC, SDP & pre-charge', kw: 'ccs2 plc slac slaac sdp osi layers pre-charge homeplug green phy iso 15118 din 70121', lede: '14 assignment questions: the highest of any topic. It is memory work, so use the layer map, the state sequence and the numbers.',
  render(body) {
    H(body, `<p>CCS2 (Combined Charging System, Type-2 based) does AC <i>and</i> DC through one inlet. For DC the car and charger talk via <b>PLC (Power Line Communication, HomePlug Green PHY, 2-28 MHz)</b> that rides on the CP-PE wires, superimposed on the ±12 V / 1 kHz PWM ${HOT('', 'W10Q9')}. The higher-level protocol is <b>ISO 15118 / DIN 70121</b>. Because PLC is a shared medium, the car must first find out which charger it is physically plugged into: that is what SLAC does.</p><h2>The communication stack (OSI view)</h2>`);
    const L = lab(body, 'Tap a layer', 'Which protocol sits where? These are exactly the layer questions in the assignment.');
    const LAY = [['Application', 'ISO 15118 / DIN 70121 messages (session setup, charge parameters, power delivery) and <b>SDP</b> (SECC Discovery Protocol, UDP) per the course key', 'W11Q5'], ['Presentation', 'EXI (binary XML) encoding: converts data so both sides read it the same way', 'W11Q14'], ['Session', 'Session ID / V2G session handling', ''], ['Transport', '<b>UDP</b> (fast: SDP) · <b>TCP</b> (reliable) · <b>TLS</b> (secure; strictly runs above TCP) → course answer for "fast, reliable and safer" = Transport', 'W11Q12'], ['Network', 'IPv6 and <b>SLAAC</b> (stateless address auto-configuration, link-local addresses)', 'W11Q2'], ['Data link', '<b>SLAC</b> (signal level attenuation characterisation): logical network pairing at MAC level (HomePlug GP)', 'W11Q4'], ['Physical', 'HomePlug Green PHY power-line carrier on the CP/PE pair', 'W10Q9']];
    const detail = h('div', { class: 'card', style: 'min-height:4.5em' }); const stack = h('div', { style: 'display:grid;gap:6px' });
    LAY.forEach((l, i) => stack.append(h('button', { class: 'btn', style: `text-align:left;border-left:6px solid var(${['--ch-i', '--ch-b', '--ch-x', '--ch-v', '--ch-d', '--hot', '--muted'][i]})`, onclick: () => { detail.innerHTML = `<b>${l[0]} layer:</b> ${l[1]} ${l[2] ? `<mark class="hot" data-q="${l[2]}">asked</mark>` : ''}`; } }, `${7 - i}. ${l[0]}`)));
    L.add(stack); L.add(detail); detail.innerHTML = '<span class="cap">← tap a layer</span>';
    H(body, `<p class="cap">Don't mix up: <b>SLAC</b> (data link, pairing by attenuation) vs <b>SLAAC</b> (network, IPv6 addressing). ${HOT('SLAC = layer 2, SLAAC = layer 3', 'W11Q4')}.</p><h2>Charging sequence</h2>`);
    const L2 = lab(body, 'Step through a DC charging session', 'Use Next/Back to walk the sequence. The CP/PWM state on top follows the standard.');
    const STEPS = [['A → B1', 'Connector plugged in; CP changes +12 → +9 V; the charger locks the connector. No PWM yet.', 'B1'], ['B2: 5 % PWM', 'EVSE starts the <b>5 % PWM</b> = "digital communication required".  <mark class="hot" data-q="W11Q1">SLAC starts in B2.</mark>', 'B2'], ['SLAC (data link)', 'EV sends <b>CM_SLAC_PARM.REQ</b>, then <b>3 × CM_START_ATTEN_CHAR.IND</b> <mark class="hot" data-q="W11Q9">(three)</mark>, then <b>10 sounding messages (M-SOUND)</b> <mark class="hot" data-q="W11Q3">measured over 58 frequency groups</mark>. Each EVSE reports the <b>average attenuation</b>; the EV picks the <b>lowest attenuation</b> <mark class="hot" data-q="W11Q6">(closest = its own cable)</mark>, then CM_SLAC_MATCH → shared network key; logical network formed.', 'B2'], ['SLAAC + SDP', 'IPv6 link-local addresses configured (SLAAC). EV multicasts a UDP <b>SDP</b> request; the EVSE (SECC) answers with its IP address and port, and says TCP or TLS.', 'B2'], ['TCP/TLS + ISO 15118 handshake', 'Application protocol handshake (ISO 15118 or DIN 70121), session setup, service discovery, payment selection, charge-parameter discovery.', 'B2'], ['Cable check', 'Charger checks insulation (isolation monitoring) while the contactors are still open; EV closes S2 → <b>state C</b> (6 V).', 'C1'], ['Pre-charge', 'EV requests <b>target voltage = battery voltage</b> and a <mark class="hot" data-q="W11Q10">current limit below 2 A</mark>. The EVSE ramps its output; when <mark class="hot" data-q="W11Q13">|VEVSE − Vbatt| < 20 V</mark> the EV closes its disconnecting device.', 'C1'], ['Power delivery (C2)', '<mark class="hot" data-q="W11Q7">DC contactors close in state C2</mark>, then charging runs in a current-demand loop (EV requests V and I, EVSE follows).', 'C2'], ['Stop', 'EV ends charging; current ramps to ~0; contactors open (welding detection), connector unlocks, session closes.', 'B']];
    let k = 0; const tag = h('div', { class: 'pill hot', style: 'width:fit-content' }), txt = h('div', { class: 'card' }), nav = h('div', { class: 'nextprev', style: 'margin:0' });
    const upd = () => { tag.textContent = `Step ${k + 1}/${STEPS.length}: ${STEPS[k][0]}  ·  CP state ${STEPS[k][2]}`; txt.innerHTML = STEPS[k][1]; bar.style.width = (k + 1) / STEPS.length * 100 + '%'; };
    const bar = h('i', { style: 'display:block;height:100%;background:var(--ch-v);width:0;border-radius:99px' });
    nav.append(h('button', { class: 'btn', onclick: () => { k = Math.max(0, k - 1); upd(); } }, '← Back'), h('button', { class: 'btn primary', onclick: () => { k = Math.min(STEPS.length - 1, k + 1); upd(); } }, 'Next →'));
    L2.add(h('div', { class: 'heatrow', style: 'grid-template-columns:1fr' }, h('div', { class: 'bar' }, bar))); L2.add(tag); L2.add(txt); L2.add(nav); upd();
    const L3 = lab(body, 'SLAC: which charger am I connected to?', 'Type the average attenuation (dB) the car measures from four chargers. The car picks the smallest value, because signal loss is lowest through its own cable (W11Q6: 80, 90, 50, 110 → EVSE 3).');
    const ins = [80, 90, 50, 110].map((x, i) => h('input', { type: 'number', value: x, style: 'width:5.5em', 'aria-label': 'EVSE' + (i + 1) })); const res = h('div', { class: 'verdict ok' });
    const run = () => { const vs = ins.map(i => +i.value); const m = Math.min(...vs); res.textContent = 'Car sends attenuation request to EVSE' + (vs.indexOf(m) + 1) + ' (lowest: ' + m + ' dB)'; }; ins.forEach(i => i.addEventListener('input', run)); run();
    L3.add(h('div', { class: 'nat' }, ...ins.map((i, n) => h('label', {}, 'EVSE' + (n + 1) + ' ', i)))); L3.add(res);
    H(body, `<h2>DC power transfer facts (numbers to memorise)</h2>${TBL(['Item', 'Value'], [['PLC', 'HomePlug Green PHY, 2-28 MHz, on CP-PE'], ['PWM during DC', '5 % duty, 1 kHz'], ['SLAC sounding', '3 × START_ATTEN_CHAR, then 10 M-SOUND, 58 frequency groups'], ['Pre-charge current limit', '2 A (upper limit; W11Q10 key)'], ['Pre-charge voltage tolerance', '&lt; 20 V difference before the EV closes its contactor'], ['Contactors close in', 'State C2'], ['PP in CCS2 (DC)', '1.5 kΩ-type cable code (13 A rating) for the AC part']])}
    ${MUST(`${HOT('SLAC = data link; SLAAC = network; SDP = application (UDP); EXI = presentation; TCP/UDP = transport (TLS secures TCP; course groups it here)')}.`, `${HOT('PLC rides on CP-PE; 5 % PWM; SLAC starts in B2')}.`, `3 × START_ATTEN_CHAR → 10 sounds × 58 groups → lowest attenuation wins.`, `Pre-charge: I limit 2 A, ΔV &lt; 20 V, contactors in C2.`)}`);
  } });

page({ id: 'dc001-can', mod: 'm5', wk: 11, stars: 3, topic: true, title: 'CAN bus & BEVC-DC001 / GB/T 27930', kw: 'can bus 2.0b arbitration id priority pgn bevc dc001 gbt 27930 0x56 0xf4 termination decode', lede: 'Light-EV and Chinese DC chargers talk over CAN. Be able to decode an ID, decode data bytes and say who wins arbitration.',
  render(body) {
    H(body, `<h2>CAN basics</h2><ul><li>Two-wire differential bus (CANH, CANL). <b>Dominant = 0</b> (≈ 2 V differential, CANH 3.5 V, CANL 1.5 V), <b>recessive = 1</b> (≈ 0 V). A dominant bit overrides a recessive one: wired-AND.</li><li>${HOT('Two 120 Ω terminators, one at each end of the bus (≈ 60 Ω across a powered-off bus)', 'W11Q15')}.</li><li>${HOT('CAN 2.0A: 11-bit ID → 2¹¹ messages; CAN 2.0B (extended): 29-bit ID → 2²⁹ messages', 'W12Q1')}. GB/T 27930 / BEVC-DC001 use the 29-bit extended ID (J1939 style).</li><li><b>Arbitration</b>: all nodes may start at once; each sends its ID MSB-first and listens. A node sending recessive while seeing dominant drops out. ${HOT('The <b>lowest ID wins</b> (highest priority)', 'W12Q3')}.</li></ul>`);
    const L = lab(body, 'Arbitration simulator (11-bit IDs)', 'Edit the four IDs (0-2047). Bits are sent MSB-first; a node that sends 1 while the bus shows 0 loses and goes silent.');
    const ids = [10, 20, 30, 40].map(x => h('input', { type: 'number', min: 0, max: 2047, value: x, style: 'width:5.5em' })); const out = h('div', { class: 'tblwrap' }), win = h('div', { class: 'verdict ok' });
    L.add(h('div', { class: 'nat' }, ...ids.map((i, n) => h('label', {}, 'Node ' + (n + 1) + ' ', i)))); L.add(out); L.add(win);
    const run = () => { const vs = ids.map(i => Math.max(0, Math.min(2047, +i.value | 0))); const alive = vs.map(() => true), lost = vs.map(() => -1); const bus = []; const bits = vs.map(v => v.toString(2).padStart(11, '0'));
      for (let b = 0; b < 11; b++) { const bb = Math.min(...vs.map((v, n) => alive[n] ? +bits[n][b] : 1)); bus.push(bb); vs.forEach((v, n) => { if (alive[n] && +bits[n][b] > bb) { alive[n] = false; lost[n] = b; } }); }
      out.innerHTML = `<table><thead><tr><th>Node</th><th>ID</th>${bits[0].split('').map((_, b) => `<th>${b}</th>`).join('')}<th>result</th></tr></thead><tbody>${vs.map((v, n) => `<tr><td>${n + 1}</td><td>${v}</td>${bits[n].split('').map((c, b) => `<td style="${lost[n] === b ? 'background:var(--bad);color:#fff' : lost[n] >= 0 && b > lost[n] ? 'opacity:.35' : ''};text-align:center;font-family:var(--f-mono)">${c}</td>`).join('')}<td>${alive[n] ? '<b>WINS</b>' : 'lost at bit ' + lost[n]}</td></tr>`).join('')}<tr><td colspan="2"><b>bus</b></td>${bus.map(c => `<td style="text-align:center;font-family:var(--f-mono)"><b>${c}</b></td>`).join('')}<td></td></tr></tbody></table>`;
      win.textContent = 'Winner: node ' + (alive.indexOf(true) + 1) + ' (ID ' + vs[alive.indexOf(true)] + '): the smallest ID wins'; }; ids.forEach(i => i.addEventListener('input', run)); run();
    H(body, `<h2>The 29-bit identifier (J1939 style, GB/T 27930-2015 and BEVC-DC001)</h2>${TBL(['Bits', '3', '1', '1', '8', '8', '8'], [['Field', 'Priority', 'R', 'DP', 'PF (PDU format)', 'PS (= destination address DA)', 'SA (source address)'], ['Example 0x181056F4', '110 = 6', '0', '0', '0x10', '0x56', '0xF4']])}
    <p>${HOT('Addresses: charger = 0x56 (86), BMS = 0xF4 (244)', 'W11Q8')}. Memory trick: <b>"56 – charger, F4 – BMS"</b>. A frame from the BMS to the charger therefore has DA = 0x56 and SA = 0xF4 ${HOT('', 'W12Q6')}.</p>${F('PGN = (DP << 16) | (PF << 8) | (PF ≥ 240 ? PS : 0)', 'W12Q7')}`);
    const L2 = lab(body, '29-bit ID decoder', 'Type a hex ID. Try 181056F4 (W12Q5/Q6 → priority 6, DA 0x56, SA 0xF4) and 182656F4 (W12Q7 → PGN 0x002600).');
    const hx = h('input', { type: 'text', value: '181056F4', style: 'font:600 1rem var(--f-mono);padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);width:12em', 'aria-label': 'hex ID' }); const ro = L2.readout();
    L2.add(h('div', { class: 'nat' }, h('label', {}, 'ID (hex) ', hx)));
    const dec = () => { const n = parseInt(hx.value.replace(/^0x/i, ''), 16); if (isNaN(n)) return ro([['error', 'not hex']]); const sa = n & 255, ps = (n >> 8) & 255, pf = (n >> 16) & 255, dp = (n >> 24) & 1, r = (n >> 25) & 1, pr = (n >> 26) & 7, pgn = (dp << 16) | (pf << 8) | (pf >= 240 ? ps : 0); const hx2 = x => '0x' + x.toString(16).toUpperCase().padStart(2, '0'); ro([['Priority', pr + ' (' + pr.toString(2).padStart(3, '0') + ')'], ['R / DP', r + ' / ' + dp], ['PF', hx2(pf)], ['PS / DA', hx2(ps) + (ps === 0x56 ? ' charger' : ps === 0xF4 ? ' BMS' : '')], ['SA', hx2(sa) + (sa === 0x56 ? ' charger' : sa === 0xF4 ? ' BMS' : '')], ['PGN', '0x' + pgn.toString(16).toUpperCase().padStart(6, '0')]]); }; hx.addEventListener('input', dec); dec();
    H(body, `<p class="cap">${HOT('Priority = top 3 bits of the 29-bit ID: 0x18 → 110 = 6', 'W12Q5')}. For 0x18 you drop the 3 unused MSBs of the 32-bit word: 0001 1000 → (000)(11 000): priority 110, R = 0, DP = 0.</p><h2>Decoding data bytes</h2><p>Signals are packed with a resolution (scale) and offset: <b>physical = raw × resolution + offset</b>; multi-byte values are <b>little-endian</b> in J1939 style, but the assignment lists the bytes in the order shown, so follow the figure.</p>`);
    const L3 = lab(body, 'Signal decoder (W12Q8 layout)', 'Byte 1 = final SOC (1 %/bit); 2-3 = min cell V (0.01 V/bit); 4-5 = max cell V (0.01 V/bit); 6 = min temp; 7 = max temp. Data 0x56012C019A053200 → max cell voltage 4.10 V.');
    const dx = h('input', { type: 'text', value: '56012C019A053200', style: 'font:600 1rem var(--f-mono);padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);width:19em', 'aria-label': 'data hex' }); const ro3 = L3.readout();
    L3.add(h('div', { class: 'nat' }, h('label', {}, 'Data (hex) ', dx)));
    const dd = () => { const s = dx.value.replace(/\s|0x/gi, ''); if (!/^[0-9a-f]{16}$/i.test(s)) return ro3([['need 16 hex digits', '8 bytes']]); const B = s.match(/../g).map(x => parseInt(x, 16)); ro3([['Final SOC', B[0] + ' %'], ['Min cell V', ((B[1] << 8 | B[2]) * .01).toFixed(2) + ' V'], ['Max cell V', ((B[3] << 8 | B[4]) * .01).toFixed(2) + ' V'], ['Min temp', B[5] + ' °C'], ['Max temp', B[6] + ' °C']]); }; dx.addEventListener('input', dd); dd();
    H(body, `<h2>Charging stages over CAN (GB/T 27930 family)</h2>${TBL(['Stage', 'What happens', 'Example messages'], [['1 Handshake', 'Charger and BMS wake up, check each other', 'CHM, BHM'], ['2 Identification', 'Exchange versions and battery data', 'CRM, BRM'], ['3 Parameter configuration', 'Battery limits, charger capability, time sync, ready', 'BCP, CTS, CML, BRO, CRO'], ['4 Charging', 'BMS requests voltage/current; both report status', 'BCL, BCS, CCS, BSM'], ['5 End', 'Stop reasons, statistics', 'BST, CST, BSD, CSD']])}<p class="cap">Names are for orientation; the exam asks about the ID/address/decoding mechanics above.</p>
    ${MUST(`${HOT('Charger 0x56 (86), BMS 0xF4 (244)')}; ID = priority(3) | R | DP | PF | DA | SA.`, `${HOT('Lowest ID wins arbitration')}; dominant = 0.`, `CAN 2.0A = 2¹¹ IDs; 2.0B = 2²⁹ IDs; 120 Ω at both ends.`, `Data: physical = raw × resolution + offset.`)}`);
  } });

page({ id: 'stations-ocpp', mod: 'm5', wk: 12, stars: 2, topic: true, title: 'Charging stations, OCPP & V2G', kw: 'ocpp 1.6j call callresult callerror websocket json csms cpo v2g smart charging', lede: 'The back-end: how a charger talks to the cloud, and how the grid can talk back.',
  render(body) {
    H(body, `<h2>Who talks to whom</h2><div class="legendbox"><span class="pill">EV</span>→ <span class="pill hot">ISO 15118 / CAN / PWM</span> → <span class="pill">Charge point (EVSE)</span>→ <span class="pill hot">OCPP 1.6J (WebSocket + JSON)</span> → <span class="pill">Central system (CSMS / CPO back-end)</span>→ <span class="pill hot">OCPI</span> → <span class="pill">e-mobility service providers (roaming)</span></div>
    <ul><li><b>OCPP (Open Charge Point Protocol)</b>: open, vendor-neutral protocol between charge points and the central system. Version 1.6J = JSON over WebSocket. The charge point connects <b>out</b> to the server (works behind NAT).</li><li>Functions: boot/registration, authorisation (RFID/app), start/stop transaction, meter values, status, remote start/stop, firmware update, reservation, smart charging (current limits to balance the site load).</li><li><b>V2G / V1G</b>: V1G = controlled one-way charging (smart charging); V2G = bidirectional (needs a bidirectional converter such as the DAB and ISO 15118-20).</li></ul>
    <h2>OCPP-J message format</h2>${F('CALL:        [2, "<b>UniqueId</b>", "Action", {payload}]')}${F('CALLRESULT:  [3, "<b>UniqueId</b>", {payload}]')}${F('CALLERROR:   [4, "<b>UniqueId</b>", "errorCode", "errorDescription", {details}]', 'W12Q4')}<p>${HOT('Message type number: CALL = 2, CALLRESULT = 3, CALLERROR = 4', 'W12Q4')}. ${HOT('The 2nd element is the unique Message ID; a CALLRESULT/CALLERROR echoes the ID of the CALL so the sender can match them', 'W12Q9')}. ${HOT('Message [3, "ef234867", {…}] → type 3 (CALLRESULT), Message ID = "ef234867"', 'W12Q2')}.</p>`);
    const L = lab(body, 'OCPP-J message builder and decoder', 'Pick an action to see a CALL and its CALLRESULT, or paste any message to decode it.');
    const ACT = { BootNotification: [{ chargePointVendor: 'Acme', chargePointModel: 'AC22' }, { status: 'Accepted', currentTime: '2026-10-11T08:00:00Z', interval: 300 }], Authorize: [{ idTag: 'RFID1234' }, { idTagInfo: { status: 'Accepted' } }], StartTransaction: [{ connectorId: 1, idTag: 'RFID1234', meterStart: 0, timestamp: '2026-10-11T08:01:00Z' }, { transactionId: 42, idTagInfo: { status: 'Accepted' } }], Heartbeat: [{}, { currentTime: '2026-10-11T08:05:00Z' }], StatusNotification: [{ connectorId: 1, errorCode: 'NoError', status: 'Charging' }, {}], MeterValues: [{ connectorId: 1, transactionId: 42, meterValue: [{ timestamp: '2026-10-11T08:10:00Z', sampledValue: [{ value: '5.2', measurand: 'Energy.Active.Import.Register', unit: 'kWh' }] }] }, {}], StopTransaction: [{ transactionId: 42, meterStop: 5200, timestamp: '2026-10-11T09:00:00Z' }, { idTagInfo: { status: 'Accepted' } }], RemoteStartTransaction: [{ idTag: 'APP-77' }, { status: 'Accepted' }] };
    const sel = h('select', { class: 'sel', 'aria-label': 'action' }, Object.keys(ACT).map(k => h('option', {}, k))); const outc = h('pre', { class: 'formula', style: 'white-space:pre-wrap;word-break:break-all' }), outr = h('pre', { class: 'formula', style: 'white-space:pre-wrap;word-break:break-all' }), id = () => Math.random().toString(36).slice(2, 10);
    const build = () => { const a = sel.value, u = id(); outc.textContent = 'CALL (charge point → server)\n' + JSON.stringify([2, u, a, ACT[a][0]]); outr.textContent = 'CALLRESULT (server → charge point), same ID\n' + JSON.stringify([3, u, ACT[a][1]]); }; sel.addEventListener('change', build); build();
    L.add(h('div', { class: 'nat' }, h('label', {}, 'Action ', sel), h('button', { class: 'btn', onclick: build }, 'New ID'))); L.add(outc); L.add(outr);
    const ta = h('textarea', { rows: 2, style: 'width:100%;font:600 .95rem var(--f-mono);padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)', 'aria-label': 'paste message' }, '[3, "ef234867", {"currentTime": "2026-10-11T08:00:00Z", "status": "Accepted", "interval": 300}]'); const ro = L.readout();
    L.add(h('b', {}, 'Decode a message:')); L.add(ta);
