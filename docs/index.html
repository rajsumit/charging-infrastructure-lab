<style>/* Layout concept: lab-bench study notebook. Left rail = syllabus, main = one topic at a time, widgets styled as probe-coloured scopes. */

  --r:10px; --shadow:0 1px 2px rgba(20,32,46,.06),0 4px 14px rgba(20,32,46,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --brand:#8DB8F2; --brand-ink:#0C131B; --hot:#7A5F0B; --hot-ink:#FFF1BF; --good:#4CD08A; --bad:#FF7B68; --warn:#F2B04A;
  --ch-v:#5CA5FF; --ch-i:#FF8E52; --ch-d:#41D18C; --ch-b:#B890FF; --ch-x:#4FCFE3; --grid:#223244; --scope:#0F1923; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C131B; --surface:#141E29; --surface2:#1B2836; --ink:#E5ECF4; --muted:#92A3B5; --line:#26364A;
  --brand:#8DB8F2; --brand-ink:#0C131B; --hot:#7A5F0B; --hot-ink:#FFF1BF; --good:#4CD08A; --bad:#FF7B68; --warn:#F2B04A;
  --ch-v:#5CA5FF; --ch-i:#FF8E52; --ch-d:#41D18C; --ch-b:#B890FF; --ch-x:#4FCFE3; --grid:#223244; --scope:#0F1923; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--f-body);margin:0;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;margin-top:2.2rem;margin-bottom:.6rem}
h3{font-size:1.15rem;font-weight:700;margin-top:1.4rem;margin-bottom:.4rem}
p{margin:.55rem 0}
a{color:var(--brand)}
code,.mono{font-family:var(--f-mono);font-size:.9em}
.app{display:grid;grid-template-columns:292px minmax(0,1fr);height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 40px;position:relative}
.main{overflow-y:auto;scroll-behavior:smooth;min-width:0}
.page{max-width:960px;margin:0 auto;padding-inline:20px;padding-block:20px 90px}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand b{font-family:var(--f-display);font-size:1.05rem;line-height:1.1;display:block}
.brand small{color:var(--muted);font-size:.78rem}
.logo{width:34px;height:34px;flex:none}
.navmod{font:700 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 8px 4px}
.navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;color:var(--ink);font:inherit;font-size:.95rem;cursor:pointer;line-height:1.25}

<script>// Pure formula library. Used by the calculators on the site and by tests/verify.js
const PI = Math.PI;
const C = {
  // ---- Week 1/2 rectifiers
  halfWaveAvg: (Vpk) => Vpk / PI,
  fullWaveAvg: (Vpk) => 2 * Vpk / PI,
  // full-bridge + capacitor: ripple spec as fraction of Vpk, power P, line f (Hz)
  capFilter(Vrms, f, P, ripFrac) {
    const Vpk = Vrms * Math.SQRT2, dV = ripFrac * Vpk, Vmin = Vpk - dV;
    const Iavg = P / ((Vpk + Vmin) / 2);
    const ang = PI + Math.asin(Vmin / Vpk) - PI / 2;                // rad from peak to restart of conduction
    const tdis = ang / (2 * PI * f), tc = 1 / (2 * f) - tdis;
    return { Vpk, dV, Vmin, Iavg, tdis, tc, Cmin: Iavg * tdis / dV };
  },
  // ---- boost PFC
  boostD: (vs, Vo) => 1 - Math.abs(vs) / Vo,
  boostIpk: (P, Vrms) => Math.SQRT2 * P / Vrms,
  boostL: (Vo, dI, fsw) => Vo / (4 * dI * fsw),
  boostRipplePk: (vs, Vo, L, fsw) => { const d = 1 - Math.abs(vs) / Vo; return Math.abs(vs) * d / (L * fsw); },
  dblLineRipple: (P, fline, Vo, Cap) => P / (2 * PI * fline * Vo * Cap),   // peak-to-peak
  // ---- switch RMS currents
  rmsBuckSwitch: (Io, D) => Io * Math.sqrt(D),
  // ---- 3-phase VSC
  vscL(Vll, Vdc, m, P) {
    const Vs = Vll * Math.SQRT2 / Math.sqrt(3), Vc = m * Vdc / 2;
    const Ipk = 2 * P / (3 * Vs);
    return { Vs, Vc, Ipk, L: Math.sqrt(Vc * Vc - Vs * Vs) / (2 * PI * 50 * Ipk) };
  },
  spwmFundRms: (m, Vdc) => m * Vdc / (2 * Math.SQRT2),
  flybackPFC_Vo: (Vpk, d, n) => (Vpk / n) * d / (1 - d),
  pfFromDQ_dAligned: (id, iq) => id / Math.hypot(id, iq),
  // ---- isolated DC-DC
  forwardVo: (Vin, n, D) => n * Vin * D,
  forwardDmaxDemag: (Np, Nd) => 1 / (1 + Nd / Np),
  fullBridgeL: (Vo, D, dI, fsw) => Vo * (1 - D) / (2 * fsw * dI),
  swLossTri: (V, I, t) => V * I * t / 6,
  // ---- PSFB
  psfbLeadDead: (Cs, Vin, n, Io) => 2 * Cs * Vin / (n * Io),
  psfbDutyLoss: (Llk, Io, fs, n, Vin) => 4 * Llk * Io * fs / (n * Vin),
  psfbExtraL: (fr, Cs, Llk) => 1 / Math.pow(2 * 3.14 * fr, 2) / Cs - Llk,
  // ---- DAB
  dabP: (Vin, Vo, n, deltaRad, fs, L) => Vin * (Vo / n) * deltaRad * (PI - deltaRad) / (2 * PI * PI * fs * L),
  dabPmax: (Vin, Vo, n, fs, L) => Vin * (Vo / n) / (8 * fs * L),
  dabDeltaForFrac(frac) { // P = frac*Pmax, delta in degrees (<90)
    const s = (1 - Math.sqrt(1 - frac)) / 2; return s * 180;
  },
  optDeltaB: (a, b) => Math.pow(a / b, 0.25),
  // ---- AC Type-2
  cpDutyToAmp(d) { return d < 85 ? d * 0.6 : (d - 64) * 2.5; },
  ampToDuty(A) { return A <= 51 ? A / 0.6 : A / 2.5 + 64; },
  ppV: (R6, R4 = 330, R5 = 4700) => 5 * (R5 * R6 / (R5 + R6)) / ((R5 * R6 / (R5 + R6)) + R4),
  cpV: (Rvehicle) => 12 * Rvehicle / (1000 + Rvehicle),
  par: (a, b) => a * b / (a + b),
};

/* Assignment question bank, part 1 (Weeks 1-5). Answers are the official answer keys. Explanations are ours. */
window.QBANK = window.QBANK || [];
(function(){
const I = (id)=>QIMG[id];
const Q = (wk,n,topic,type,text,o)=>QBANK.push(Object.assign({id:`W${wk}Q${n}`,wk,n,topic,type,text},o));
/* ---------- WEEK 1 ---------- */
Q(1,1,'standards','mcq','Match each name with its <b>vehicle inlet connector</b> image: I = CCS1, II = CCS2, III = Type-7.',{img:I('w1q1'),opts:['I-b, II-c, III-a','I-a, II-b, III-c','I-c, II-b, III-a','I-a, II-c, III-b'],ans:[2],exp:'<b class="k">CCS1</b> = round Type-1 top (L1, L2, CP, PP, PE) + two big DC pins below (c). <b class="k">CCS2</b> = Type-2 top with the L1-L2-L3-N pins + two DC pins (b). <b class="k">Type-7</b> (IS 17017-2-7, light EVs, single-phase AC + DC in one inlet, Type-2-like shape but different small pins) = (a). Use the 3D connector viewer on the Standards page.'});
Q(1,2,'standards','msq','Which vehicle inlet connector(s) support <b>3-phase AC</b> charging?',{img:I('w1q2'),opts:['I (CCS1)','II (CCS2)','III (Type-7)','IV (GB/T AC)'],ans:[1,3],exp:'Only inlets with L1-L2-L3-N pins do 3-phase: the Type-2 family (CCS2 top part) and GB/T AC. CCS1 (Type-1) and Type-7 are single-phase only.'});
Q(1,3,'standards','msq','Which charging system(s) use <b>CAN communication</b>?',{opts:['CHAdeMO','AC Type-2','Type-7','CCS2'],ans:[0,2],exp:'CHAdeMO, GB/T DC, BEVC-DC001, Type-6 and Type-7 use CAN. CCS (1 and 2) use <b>PLC</b> for DC. AC Type-1/2 use only the PWM CP signal (SAE J1772).'});
Q(1,4,'standards','mcq','A charging system that takes input <b>directly from a home socket with protection</b> (in-cable control box, RCD) is classified as:',{opts:['Mode-1','Mode-2','Mode-3','Mode-4'],ans:[1],exp:'Mode-1 = plain socket, no protection. <b>Mode-2</b> = socket + portable control unit with RCD. Mode-3 = dedicated AC EVSE. Mode-4 = dedicated DC EVSE.'});
Q(1,5,'charger-arch','msq','Components present <b>inside a DC EVSE</b>:',{opts:['Rectifier','DC-DC converter','BMS','Safety interlocks'],ans:[0,1,3],exp:'DC EVSE = full power conversion (rectifier + isolated DC-DC) + interlocks (contactors/relays). The <b>BMS is in the vehicle</b>, never in the EVSE.'});
Q(1,6,'charger-arch','msq','Components present <b>inside an AC EVSE</b>:',{opts:['Rectifier','DC-DC converter','BMS','Safety interlocks'],ans:[3],exp:'An AC EVSE is only a smart switch: interlocks, sensors, metering, controller. The rectifier and DC-DC sit in the vehicle (onboard charger).'});
Q(1,7,'rectifier','nat','Single-phase <b>half-wave</b> rectifier (one diode, resistive load) fed from 220 V, 60 Hz; source shown as 310 sin ωt. Average output voltage? (π = 3.14)',{lo:98,hi:99,show:'98.73 V',exp:'V<sub>avg</sub> = V<sub>pk</sub>/π = 310/3.14 = <b>98.73 V</b>. The 60 Hz / 220 V values are distractors: use the peak given in the figure.'});
Q(1,8,'rectifier','mcq','Same half-wave circuit (310 sin ωt): <b>peak repetitive reverse voltage</b> of the diode?',{opts:['155','310','219','620'],ans:[1],exp:'In a half-wave circuit with resistive load the diode blocks the full negative peak: V<sub>RRM</sub> = V<sub>pk</sub> = 310 V. (Full-bridge: also V<sub>pk</sub> per diode.)'});
Q(1,9,'ac-type2','mcq','Communication between EVSE and EV in <b>AC Type-2</b> uses which protocol?',{opts:['ISO 15118','DIN SPEC 70121','OCPP','SAE J1772'],ans:[3],exp:'AC Type-1 and Type-2 use the <b>SAE J1772</b> PWM signalling on the CP pin (low-level communication). ISO 15118 / DIN 70121 are the high-level PLC protocols for CCS DC. OCPP is EVSE ↔ central system.'});
Q(1,10,'standards','mcq','Identify the connector shown.',{img:I('w1q10'),opts:['BEVC DC001','Type-6','CHAdeMO','DC GB/T'],ans:[2],exp:'<b>CHAdeMO</b>: round face with two large DC pins and a few small signal pins, DC only, CAN. It has no combined AC part, which is why CCS was invented.'});
/* ---------- WEEK 2 ---------- */
Q(2,1,'boost-pfc','mcq','Boost PFC converter: voltage across the inductor during the <b>d(t)T<sub>s</sub></b> interval (S1 on)?',{opts:['|v<sub>s</sub>(t)|','|v<sub>s</sub>(t)| − V<sub>o</sub>','V<sub>o</sub>','−|v<sub>s</sub>(t)|','−(|v<sub>s</sub>(t)| − V<sub>o</sub>)','−V<sub>o</sub>'],ans:[0],exp:'While the low-side switch S1 is on, the rectified input is across L: v<sub>L</sub> = |v<sub>s</sub>|, current rises. During (1−d)T<sub>s</sub> it is |v<sub>s</sub>| − V<sub>o</sub> (negative), current falls.'});
Q(2,2,'boost-pfc','mcq','Full-bridge (4-switch) PFC: S1 and S4 on together for d(t)T<sub>s</sub>, S2 and S3 for (1−d)T<sub>s</sub>; conduction of S1/S4 always longer than S2/S3. Expression for d(t)?',{opts:['1 − |v<sub>s</sub>|/V<sub>o</sub>','1 + |v<sub>s</sub>|/V<sub>o</sub>','(1 − |v<sub>s</sub>|/V<sub>o</sub>)/2','(1 + |v<sub>s</sub>|/V<sub>o</sub>)/2'],ans:[3],exp:'This is the 3-level behaviour: the inductor sees +|v<sub>s</sub>| ... the effective volt-second balance gives d = (1 + |v<sub>s</sub>|/V<sub>o</sub>)/2, always above 0.5 (hence “S1,S4 conduct longer”). Check: at v<sub>s</sub> = 0 → d = 0.5; at v<sub>s</sub> = V<sub>o</sub> → d = 1.'});
Q(2,3,'boost-pfc','mcq','In a single-phase boost PFC, how many times in <b>one line cycle</b> does the duty ratio of the switches take the <u>same value</u>?',{opts:['1','2','3','4'],ans:[3],exp:'d(t) = 1 − |V<sub>pk</sub> sin ωt|/V<sub>o</sub> repeats symmetrically: each value (except the extreme ones) occurs 2× per half-cycle × 2 half-cycles = <b>4</b> times per line cycle.'});
Q(2,4,'boost-pfc','mcq','Single-phase boost PFC from 230 V, 50 Hz, V<sub>o</sub> = 400 V. At what |v<sub>s</sub>(t)| is the <b>inductor current ripple maximum</b>?',{opts:['400','325','200','230'],ans:[2],exp:'Ripple ∝ |v<sub>s</sub>|(1 − |v<sub>s</sub>|/V<sub>o</sub>) which peaks at |v<sub>s</sub>| = <b>V<sub>o</sub>/2 = 200 V</b>. (Max ripple = V<sub>o</sub>/(4Lf<sub>sw</sub>).)'});
Q(2,5,'rectifier','mcq','Peak repetitive reverse voltage of a diode in a <b>single-phase full-bridge rectifier with capacitive filter</b> (V<sub>s,pk</sub> = input peak)?',{opts:['V<sub>s,pk</sub>','V<sub>s,pk</sub>/2','V<sub>s,pk</sub>/√2','2·V<sub>s,pk</sub>'],ans:[0],exp:'Each diode blocks about the peak of the source: V<sub>RRM</sub> ≥ V<sub>s,pk</sub> (the output cap sits near +V<sub>pk</sub> while the opposite diode pair conducts, so the reverse diode sees ≈ V<sub>s,pk</sub>, not twice).'});
Q(2,6,'boost-pfc','mcq','Match duty ratio variation: I = S1, II = S2 of the boost PFC (S1 = low-side switch, S2 = upper switch/diode).',{img:I('w2q6'),opts:['I-a, II-b','I-b, II-a','I-a, II-a','I-b, II-b'],ans:[0],exp:'S1: d(t) = 1 − |v<sub>s</sub>|/V<sub>o</sub> → a valley (a): large near zero-crossing, smallest at the peak. S2 is the complement 1 − d = |v<sub>s</sub>|/V<sub>o</sub> → rectified sine hump (b).'});
Q(2,7,'boost-pfc','nat','Circuit with D1–D4 bridge, L, D5/S1 and S2/D6 and a 325 sin ωt source: S1 and S2 on together for d(t)T<sub>s</sub>, D5 and D6 on together for (1−d)T<sub>s</sub>. If the <b>minimum duty at the positive peak is 0.15</b>, find V<sub>o</sub>.',{lo:463,hi:465,show:'≈ 464 V',exp:'Answer key: <b>≈ 464 V</b>. It matches V<sub>o</sub> = V<sub>s,pk</sub>/(1 − 2d<sub>min</sub>) = 325/0.7 = 464.3 V, i.e. the 2-switch version has d(t) = (1 − |v<sub>s</sub>|/V<sub>o</sub>)/2 (each of the two series switches carries half of the boost action). If in doubt in the exam: the key is 463–465.'});
Q(2,8,'boost-pfc','nat','Boost PFC from 230 V, 50 Hz feeds 1100 W, f<sub>sw</sub> = 60 kHz, V<sub>o</sub> = 450 V, lossless, CCM. Find L (mH) for peak-to-peak ripple = 10 % of the input peak current.',{lo:2.7,hi:2.8,show:'2.77 mH',exp:'I<sub>pk</sub> = √2·P/V<sub>rms</sub> = √2·1100/230 = 6.763 A. ΔI = 0.1·I<sub>pk</sub> = 0.676 A. L = V<sub>o</sub>/(4·ΔI·f<sub>sw</sub>) = 450/(4·0.676·60000) = <b>2.77 mH</b>.'});
Q(2,9,'rectifier','nat','Single-phase full-bridge diode rectifier with capacitive filter, 220 V, 50 Hz, load 200 W, output ripple ≤ 10 % of the peak input. Smallest C (µF)? (π = 3.14; 1 rad = 57.3°)',{lo:185,hi:190,show:'186 µF',exp:'V<sub>pk</sub> = 311 V, ΔV = 31.1 V → V<sub>min</sub> = 280 V (0.9 V<sub>pk</sub>). Cap discharges from the peak until |v<sub>s</sub>| rises back to V<sub>min</sub>: t<sub>dis</sub> = (π/2 + arcsin 0.9)/(2π·50) ≈ 8.56 ms. I = P/V<sub>avg</sub> = 200/295.5 = 0.677 A. C = I·t<sub>dis</sub>/ΔV = <b>186 µF</b>.'});
Q(2,10,'boost-pfc','nat','Single-phase boost PFC, 50 Hz source varies 180–265 V (rms), V<sub>o</sub> = 500 V. <b>Minimum duty ratio</b> of S1?',{lo:.23,hi:.27,show:'0.25',exp:'Minimum d occurs at the highest peak: V<sub>pk</sub> = 265·√2 = 374.8 V. d<sub>min</sub> = 1 − 374.8/500 = <b>0.25</b>. Note V<sub>o</sub> must exceed 375 V here, so 500 V is fine.'});
/* ---------- WEEK 3 ---------- */
Q(3,1,'pfc-control','mcq','While doing small-signal modelling to obtain a transfer function, the <b>perturbation</b> is introduced after:',{opts:['Average large-signal model','Linearization around the operating point','Conversion from time domain to s-domain'],ans:[0],exp:'Order: switching model → <b>average large-signal model</b> → add perturbation (x = X + x̃) → neglect product of two small terms (linearize) → Laplace transform → transfer function.'});
Q(3,2,'pfc-stress','nat','Buck-type leg: switch S1 on for 30 µs at 10 kHz, V<sub>dc</sub> = 200 V, I<sub>o</sub> = 20 A (constant), negligible dead time. <b>RMS current of S1</b>?',{lo:10.5,hi:11.5,show:'10.95 A',exp:'T = 100 µs → D = 0.3. S1 carries I<sub>o</sub> for D of the period: I<sub>rms</sub> = I<sub>o</sub>√D = 20·√0.3 = <b>10.95 A</b>.'});
Q(3,3,'pfc-stress','nat','Full bridge: S1&S4 on 30 µs, S2&S3 on 20 µs (complementary), V<sub>dc</sub> = 400 V, I<sub>o</sub> = 10 A. <b>RMS current of S1</b>?',{lo:7.7,hi:8.7,show:'7.75 A',exp:'T = 50 µs → D<sub>S1</sub> = 30/50 = 0.6. I<sub>rms</sub> = I<sub>o</sub>√0.6 = <b>7.75 A</b>.'});
Q(3,4,'pfc-stress','mcq','A single-phase PFC at 10 kHz with perfect unity PF from 230 V, 50 Hz. The dominant frequency component of the <b>output-capacitor voltage ripple</b> is:',{opts:['50 Hz','100 Hz','10 kHz','20 kHz'],ans:[1],exp:'Instantaneous input power p = V·I(1 − cos 2ωt) pulsates at <b>2×line frequency = 100 Hz</b>. That low-frequency ripple is what forces a big electrolytic cap. The 10 kHz ripple is much smaller.'});
Q(3,5,'pfc-stress','nat','Boost PFC, 230 V 50 Hz, 3300 W, f<sub>sw</sub> = 20 kHz, V<sub>o</sub> = 400 V, C = 2.2 mF. <b>Peak-to-peak output ripple</b>? (π = 3.14)',{lo:11.5,hi:12.5,show:'11.94 V',exp:'ΔV<sub>pp</sub> = P/(2π f<sub>line</sub> V<sub>o</sub> C) = 3300/(2π·50·400·2.2×10⁻³) = <b>11.94 V</b> (the 100 Hz ripple).'});
Q(3,6,'pfc-stress','mcq','Boost PFC: expression for the <b>RMS current of switch S2</b> (upper switch, conducts in (1−d)).',{opts:['√((2/T)∫₀^(T/2) d(t)·i<sub>s</sub>² dt)','√((2/T)∫₀^(T/2) (1−d(t))·i<sub>s</sub>² dt)','I<sub>s,pk</sub>/2','I<sub>s,pk</sub>/√2'],ans:[1],exp:'S1 conducts for d(t) of each switching cycle, S2 for (1 − d(t)). RMS² = average over a half line cycle of (conduction fraction)·i<sub>s</sub>².'});
Q(3,7,'pfc-control','mcq','State-space of the boost PFC: x = [i<sub>L</sub> , v<sub>c</sub>]ᵀ, u = [d , v<sub>s</sub>]. Matrix sizes: I = A, II = B, III = C. Options: a = 2×2, b = 1×2, c = 2×1.',{opts:['I-a, II-b, III-c','I-a, II-c, III-b','I-b, II-a, III-c','I-b, II-c, III-a','I-c, II-a, III-b','I-c, II-b, III-a'],ans:[1],exp:'A (2×2: states×states). B maps inputs to states → listed as 2×1 (one input vector, state count 2). C maps states to the single output → 1×2. So A = 2×2, B = 2×1, C = 1×2.'});
Q(3,8,'pfc-control','msq','Correct assumptions in the small-signal model of the boost PFC (average current control):',{opts:['f<sub>sw</sub> ≫ f<sub>s</sub> (line)','f<sub>s</sub> ≫ f<sub>sw</sub>','Perturbations ≫ operating-point values','Perturbations ≪ operating-point values'],ans:[0,3],exp:'Averaging needs switching much faster than the line; linearization needs perturbations much smaller than the operating point so that products of perturbations vanish.'});
Q(3,9,'pfc-control','msq','<b>State variables</b> of the boost PFC converter:',{opts:['Inductor current','Duty ratio','Input AC voltage','Output capacitor voltage'],ans:[0,3],exp:'State variables = energy storage elements: i<sub>L</sub> and v<sub>c</sub>. Duty ratio and v<sub>s</sub> are inputs.'});
Q(3,10,'pfc-control','msq','<b>Input variables</b> in the state-space representation:',{opts:['Inductor current','Duty ratio','Input AC voltage','Output capacitor voltage'],ans:[1,2],exp:'Inputs u = [d(t), v<sub>s</sub>(t)]. i<sub>L</sub> and v<sub>c</sub> are states.'});
/* ---------- WEEK 4 ---------- */
Q(4,1,'bridgeless','mcq','Totem-pole PFC: <b>RMS current of S2</b>? (S1,S2 = HF leg; S3,S4 = line-frequency leg)',{opts:['√((1/T)[∫₀^(T/2) d·i² dt + ∫_(T/2)^T (1−d)·i² dt])','√((1/T)[∫₀^(T/2) (1−d)·i² dt + ∫_(T/2)^T d·i² dt])','I<sub>s,pk</sub>/2','I<sub>s,pk</sub>/√2'],ans:[0],exp:'The HF leg swaps roles every half line-cycle: in the half where S2 is the “boost switch” it conducts d(t); in the other half it is the “diode-like” switch conducting 1 − d(t). So the RMS integral has d in one half and (1−d) in the other.'});
Q(4,2,'bridgeless','nat','Bridgeless PFC from 230 V, 50 Hz, V<sub>o</sub> = 400 V. <b>Duty ratio of S2 at the negative peak</b> of the input?',{lo:.17,hi:.2,show:'0.187',exp:'Same law as boost PFC: d = 1 − |v<sub>s</sub>|/V<sub>o</sub> = 1 − 325.3/400 = <b>0.187</b> (minimum duty).'});
Q(4,3,'bridgeless','mcq','Totem-pole PFC switching at 70 kHz with perfect unity PF from 230 V, 50 Hz. Dominant frequency in the output-cap voltage ripple?',{opts:['50 Hz','100 Hz','70 kHz','140 kHz'],ans:[1],exp:'Still single-phase → power pulsates at <b>2 f<sub>line</sub> = 100 Hz</b>. Topology does not change this.'});
Q(4,4,'bridgeless','msq','True statements about the <b>totem-pole PFC</b>:',{opts:['It uses a diode bridge rectifier','It needs a minimum of two fast switching devices','Output capacitor sizing differs from single-phase boost PFC','Inductor sizing is the same as single-phase boost PFC'],ans:[1,3],exp:'No diode bridge (that is the point). Two fast switches (S1,S2) at f<sub>sw</sub>; S3/S4 or diodes at 50 Hz. L = V<sub>o</sub>/(4ΔI f<sub>sw</sub>) and the C sizing (100 Hz ripple) are the same as boost PFC.'});
Q(4,5,'bridgeless','mcq','Bridgeless PFC (two diodes D1/D2 on top, switches S1/S2 at the bottom): duty-ratio variation of <b>S2</b>?',{img:I('w4q5'),opts:['A','B','C','D'],ans:[2],exp:'S2 is the boost switch only in <b>one</b> half of the line cycle (the half in which it is the active low-side switch); there its duty is the valley 1 − |v<sub>s</sub>|/V<sub>o</sub>. In the other half it is not modulated (0). Answer C: one valley per line cycle, zero elsewhere.'});
Q(4,6,'bridgeless','mcq','At any time, how many devices conduct in a <b>totem-pole PFC</b>?',{opts:['4','3','2','1'],ans:[2],exp:'Conventional boost PFC: 3 devices in the path (2 bridge diodes + 1 switch/diode). Bridgeless/totem-pole: only <b>2</b>. That is where the efficiency gain comes from.'});
Q(4,7,'pfc-control','mcq','Totem-pole PFC from 230 V, 50 Hz at 80 kHz with dual closed-loop average current control. Best range of <b>current-controller bandwidth</b>?',{opts:['≥ 80 kHz','< 50 Hz','40 kHz < BW < 80 kHz','500 Hz < BW < 8 kHz'],ans:[3],exp:'Rule: high gain at 2f<sub>line</sub> = 100 Hz (so BW well above 100 Hz) and BW ≲ f<sub>sw</sub>/10 = 8 kHz to reject switching ripple. → 500 Hz–8 kHz.'});
Q(4,8,'pfc-control','mcq','Boost PFC transfer function G<sub>v</sub>(s) = ṽ<sub>o</sub>(s)/ĩ<sub>l</sub>(s)?',{opts:['(V<sub>s,pk</sub>/V<sub>o</sub>)·[R/(RCs + 1)]','(V<sub>s,pk</sub>/2V<sub>o</sub>)·[R/(RCs + 1)]','(V<sub>s,pk</sub>/2V<sub>o</sub>)·[1/(RCs + 1)]','(V<sub>s,pk</sub>/V<sub>o</sub>)·[1/(RCs + 1)]'],ans:[1],exp:'From power balance (V<sub>s,pk</sub> I<sub>pk</sub>/2 = V<sub>o</sub>I<sub>o</sub>): a single-pole low-pass with the load pole 1/(RC): <b>G<sub>v</sub> = (V<sub>s,pk</sub>/2V<sub>o</sub>)·R/(1 + sRC)</b>. DC gain V<sub>s,pk</sub>R/(2V<sub>o</sub>).'});
Q(4,9,'dcm-flyback','msq','True for <b>DCM</b> operation of the boost PFC:',{opts:['Peak of input current follows the input AC voltage','No multiplier block / dual-loop structure required','Inductor current becomes zero in every switching cycle','THD of drawn current is lower than CCM'],ans:[0,1,2],exp:'DCM: i<sub>L,pk</sub> ∝ |v<sub>s</sub>| automatically (voltage-follower), so a single voltage loop is enough. Cost: higher peak/RMS currents and <b>higher</b> THD than CCM.'});
Q(4,10,'bridgeless','msq','Bridgeless PFC (D1, D2 upper diodes; S1, S2 lower switches): which statements are true? v<sub>s</sub> = input AC voltage.',{opts:['D1 conducts when v<sub>s</sub> > 0','D1 conducts when v<sub>s</sub> < 0','D2 conducts when v<sub>s</sub> > 0','D2 conducts when v<sub>s</sub> < 0'],ans:[0,3],exp:'Positive half: current goes through D1 to the output and returns through the body diode of S2 (S1 is the boost switch). Negative half: D2 conducts and S2 boosts. So D1 ↔ v<sub>s</sub> > 0, D2 ↔ v<sub>s</sub> < 0.'});
/* ---------- WEEK 5 ---------- */
Q(5,1,'vsc3','mcq','3-phase AC-DC converter at unity PF. For power flow <b>AC → DC</b>, the converter voltage phasor must:',{opts:['lead the source voltage phasor','lag the source voltage phasor','be aligned with the source voltage phasor','be at 90° from the source voltage phasor'],ans:[1],exp:'Power flows from the leading phasor to the lagging one: P = (V<sub>s</sub>V<sub>c</sub>/X) sin δ. For AC → DC (rectifying) the source leads, so V<sub>conv</sub> lags V<sub>s</sub>. Inverting (DC → AC) is the opposite.'});
Q(5,2,'vsc3','nat','22 kW, 3-phase AC-DC converter from 400 V, 50 Hz mains (line-line), V<sub>dc</sub> = 750 V; carrier ±3 V, modulating peak 2.7 V. <b>Per-phase inductance (mH)</b>? Lossless, π = 3.14.',{lo:5,hi:7,show:'6.03 mH',exp:'m = 2.7/3 = 0.9. V<sub>c,pk</sub> = m·V<sub>dc</sub>/2 = 337.5 V; V<sub>s,pk</sub> = 400√2/√3 = 326.6 V; I<sub>pk</sub> = 2P/(3V<sub>s,pk</sub>) = 44.9 A. At unity PF the inductor drop is perpendicular: ωL·I<sub>pk</sub> = √(V<sub>c</sub>² − V<sub>s</sub>²) = 85.1 V → L = <b>6.03 mH</b>.'});
Q(5,3,'vsc3','mcq','3-phase PFC at 5 kHz with perfect unity PF from 400 V, 50 Hz (V<sub>m</sub> < V<sub>c</sub>). Dominant frequency in output-cap voltage ripple?',{opts:['50 Hz','100 Hz','5 kHz','300 Hz'],ans:[2],exp:'Balanced 3-phase instantaneous power is <b>constant</b>: no 100 Hz component. Only switching-frequency ripple remains → dominant at f<sub>sw</sub> = 5 kHz. Hence 3-phase needs a much smaller DC-link C.'});
Q(5,4,'pwm','mcq','Half-bridge VSC with sine PWM and DC link V<sub>dc</sub>. <b>RMS of the fundamental</b> in the output pole voltage for modulation index m?',{opts:['mV<sub>dc</sub>','mV<sub>dc</sub>/2','mV<sub>dc</sub>/√2','mV<sub>dc</sub>/(2√2)'],ans:[3],exp:'Pole voltage swings 0…V<sub>dc</sub> around V<sub>dc</sub>/2. Fundamental peak = m·V<sub>dc</sub>/2 → RMS = m·V<sub>dc</sub>/(2√2).'});
Q(5,5,'pwm','msq','Half-bridge with SPWM, carrier 10 kHz, fundamental 50 Hz. Which harmonic frequencies exist?',{opts:['10050 Hz','10150 Hz','20100 Hz','10100 Hz'],ans:[0,1,2],exp:'<b>Official key: A, B, C.</b> Note the lecture states the sideband rule as h = i·m<sub>f</sub> ± j with <i>i odd ⇒ j even, i even ⇒ j odd</i> (m<sub>f</sub> = f<sub>c</sub>/f<sub>1</sub> = 200); applied literally that rule points to 10100, which is the opposite of the key. Because the assignment key is what was marked correct, <b>in the exam give A, B, C if you see this exact question</b>, but for any other SPWM question remember the lecture rule and that all harmonics cluster around multiples of the carrier (10 kHz, 20 kHz …) as sidebands at multiples of 50 Hz.'});
Q(5,6,'dcm-flyback','mcq','PFC with an isolated DC-DC stage (S1 on d·T<sub>s</sub>, S2 on (1−d)T<sub>s</sub>, transformer n<sub>1</sub>:n<sub>2</sub>). Expression for d(t)?',{opts:['1 − (n<sub>2</sub>/n<sub>1</sub>)|v<sub>s</sub>|/V<sub>o</sub>','(V<sub>o</sub> − |v<sub>s</sub>|)/(V<sub>o</sub> + (n<sub>2</sub>/n<sub>1</sub>)|v<sub>s</sub>|)','(V<sub>o</sub> + |v<sub>s</sub>|)/(V<sub>o</sub> − (n<sub>2</sub>/n<sub>1</sub>)|v<sub>s</sub>|)','1/(1 + (n<sub>1</sub>/n<sub>2</sub>)|v<sub>s</sub>|/V<sub>o</sub>)'],ans:[1],exp:'Answer key = B. Derived from volt-second balance of the coupled inductor; at |v<sub>s</sub>| = 0 d = 1 and d falls as |v<sub>s</sub>| rises. (Study the method: write inductor volt-seconds in each interval and equate to zero.)'});
Q(5,7,'dcm-flyback','nat','Flyback PFC from 230 V, 50 Hz. Duty of S1 at the positive peak is 0.12, n = 0.6. Output voltage? (lossless, ideal)',{lo:70,hi:75,show:'73.9 V',exp:'Flyback in DCM at peak: V<sub>o</sub> = (V<sub>s,pk</sub>/n)·d/(1−d) = (325.3/0.6)·0.12/0.88 = <b>73.9 V</b>.'});
Q(5,8,'pwm','nat','Half-bridge VSC, V<sub>dc</sub> = 200 V. S1 on when modulating wave > carrier. Carrier triangular 0–5 V, modulating held at 4 V. <b>Average output voltage</b>?',{lo:158,hi:162,show:'160 V',exp:'DC modulating wave → duty = v<sub>m</sub>/v<sub>carrier,pk</sub> = 4/5 = 0.8. V<sub>avg</sub> = 0.8·200 = <b>160 V</b>. “Average pole voltage ∝ modulating signal” is the key PWM idea.'});
Q(5,9,'dcm-flyback','nat','Flyback PFC from 240 V, 50 Hz, V<sub>o</sub> = 400 V, n = 2. Duty ratio at the positive peak?',{lo:.64,hi:.67,show:'≈ 0.65',exp:'Answer key 0.64–0.67. Method: set DCM volt-second balance at the input peak and solve d. (Our reverse-engineering with V<sub>o</sub> = (V<sub>pk</sub>/n)d/(1−d) gives 0.70, so the lecture defines n or V<sub>pk</sub> differently here. For the exam, remember the key.)'});
})();

/* Assignment question bank, part 2 (Weeks 6-9) */
(function(){
const I=(id)=>QIMG[id];
const Q=(wk,n,topic,type,text,o)=>QBANK.push(Object.assign({id:`W${wk}Q${n}`,wk,n,topic,type,text},o));
/* ---------- WEEK 6 ---------- */
Q(6,1,'forward','mcq','<b>Flux swing</b> in a forward converter:',{opts:['−Φmax to Φmax','0 to Φmax','0 to 0.5 Φmax','−0.5 Φmax to 0.5 Φmax'],ans:[1],exp:'Forward converter drives the core only one way (unipolar volt-seconds, then resets to ~0): flux swings <b>0 → Φmax</b>, using only one quadrant of the B-H loop. Push-pull, half- and full-bridge swing −Φmax…+Φmax.'});
Q(6,2,'dq-control','nat','dq control of a 3-phase AC-DC converter, d-axis aligned with the supply voltage vector. i<sub>q</sub> = 10 A, i<sub>d</sub> = 8 A. <b>Power factor</b> of the drawn current?',{lo:.6,hi:.65,show:'0.625',exp:'d-axis is along V<sub>s</sub>, so i<sub>d</sub> is the in-phase (active) component: PF = cos φ = i<sub>d</sub>/√(i<sub>d</sub>² + i<sub>q</sub>²) = 8/12.81 = <b>0.625</b>.'});
Q(6,3,'dq-control','nat','i<sub>q</sub> = 2·i<sub>d</sub>, and now the <b>q-axis is aligned</b> with the supply voltage vector. Power factor?',{lo:.87,hi:.92,show:'0.894',exp:'Now i<sub>q</sub> is the active component: PF = i<sub>q</sub>/√(i<sub>d</sub>² + i<sub>q</sub>²) = 2/√5 = <b>0.894</b>. Always ask: which axis carries the voltage?'});
Q(6,4,'dq-control','mcq','In 3-phase AC-DC converter control, aligning the supply <b>current vector with the q-axis</b> (d-axis on the voltage) ensures:',{opts:['unity power factor current','zero power factor current','power flow from inverter to grid','stable operation'],ans:[1],exp:'d-axis = voltage axis. Current along q is 90° from the voltage → purely reactive → <b>zero PF</b>. Unity PF needs i<sub>q</sub> = 0.'});
Q(6,5,'dq-control','msq','True statements for d-q based 3-phase AC-DC converter control:',{opts:['d, q components are independent of each other','d, q components are dependent on each other','α, β components are independent of each other','α, β components are dependent on each other'],ans:[0,2],exp:'Both α-β and d-q are <b>orthogonal</b> pairs: they are independent (the zero-sum constraint of abc is what made 3 phase currents dependent). Cross-coupling (ωL terms) is a dynamic coupling in the model that you cancel with feed-forward — it does not make the components dependent variables.'});
Q(6,6,'forward','mcq','Forward converter with a resistor (R<sub>f</sub>) / diode D<sub>S1</sub> core-reset: maximum <b>voltage stress across diode D<sub>S1</sub></b>?',{opts:['V<sub>in</sub>','2V<sub>in</sub>','V<sub>in</sub> + drop across the reset resistor','V<sub>in</sub>/2'],ans:[0],exp:'Answer key A: V<sub>in</sub>. Key idea of the lecture: the lossy reset clamps at ≈ V<sub>in</sub> on the diode, while the main switch sees V<sub>in</sub> + reset voltage.'});
Q(6,7,'dq-control','msq','A dq transformation applied to balanced 3-phase voltages of 60 Hz gives:',{opts:['α, β components which are constant','α, β components which are 60 Hz sinusoids','d, q components which are constant','d, q components which are 60 Hz sinusoids'],ans:[1,2],exp:'abc → αβ (Clarke) is stationary: still sinusoidal at 60 Hz. αβ → dq (Park) rotates with the grid: balanced sinusoids become <b>DC</b>. That is why simple PI controllers work in dq.'});
Q(6,8,'forward','nat','Forward converter, V<sub>in</sub> = 400 V, N<sub>p</sub>:N<sub>s</sub> = 5:2. S1 ON 10 µs and OFF 40 µs. <b>Output voltage</b>?',{lo:30,hi:35,show:'32 V',exp:'D = 10/50 = 0.2; n = N<sub>s</sub>/N<sub>p</sub> = 0.4. V<sub>o</sub> = n·V<sub>in</sub>·D = 0.4·400·0.2 = <b>32 V</b> (buck-derived: V<sub>o</sub> = D × reflected input).'});
Q(6,9,'dq-control','mcq','3-phase converter with L = 12 mH, R<sub>s</sub> = 10 mΩ. PI current controller chosen to <b>cancel the plant pole</b>. K<sub>pc</sub>/K<sub>ic</sub> = ?',{opts:['1.2','0.834','0.1','1'],ans:[0],exp:'Plant 1/(R + sL) has a pole at R/L. PI = K<sub>pc</sub>(1 + K<sub>ic</sub>/(K<sub>pc</sub>s)); zero at K<sub>ic</sub>/K<sub>pc</sub> placed on R/L → K<sub>pc</sub>/K<sub>ic</sub> = L/R = 12 mH/10 mΩ = <b>1.2 s</b>.'});
Q(6,10,'dq-control','mcq','Relation between the time constant T<sub>s</sub> = L/R<sub>s</sub> and the converter/delay time constant T<sub>d</sub>:',{opts:['T<sub>s</sub> < T<sub>d</sub>','T<sub>s</sub> > T<sub>d</sub>','T<sub>s</sub> = T<sub>d</sub>'],ans:[1],exp:'L/R is ~ hundreds of ms – seconds (very slow plant pole) while T<sub>d</sub> ≈ 1.5 T<sub>sw</sub> is tens of µs. So T<sub>s</sub> ≫ T<sub>d</sub>; the PI zero cancels the slow pole and the loop is shaped by T<sub>d</sub>.'});
/* ---------- WEEK 7 ---------- */
Q(7,1,'bridges','nat','Push-pull: V<sub>in</sub> = 50 V, N<sub>s</sub> = 5, N<sub>p</sub> = 2, D = 0.4. <b>Output voltage</b>?',{lo:49.5,hi:50.5,show:'50 V',exp:'n = N<sub>s</sub>/N<sub>p</sub> = 2.5. The key uses V<sub>o</sub> = n·V<sub>in</sub>·D = 2.5·50·0.4 = <b>50 V</b>. (Here D is the on-time of each switch measured against the full switching period of the transformer waveform; with “D per switch of T” the output-filter frequency is 2f<sub>sw</sub> and V<sub>o</sub> = 2nDV<sub>in</sub>. Follow the key.)'});
Q(7,2,'forward','mcq','In a <b>dual-switch forward converter</b> the voltage stress on each switch is:',{opts:['the input voltage','twice the input voltage','input voltage + leakage-inductance spike','twice input voltage + spike'],ans:[0],exp:'The two clamp diodes return leakage energy to V<sub>in</sub>, so each switch blocks at most <b>V<sub>in</sub></b> and there is lossless reset. Price: two switches and two diodes.'});
Q(7,3,'forward','mcq','Forward converter with <b>demagnetizing winding</b>, N<sub>p</sub>:N<sub>s</sub>:N<sub>D</sub> = 1:2:3, L<sub>lkg</sub> = 0. Voltage stress on S1?',{opts:['V<sub>in</sub>','⅓ V<sub>in</sub>','⅔ V<sub>in</sub>','3 V<sub>in</sub>','4 V<sub>in</sub>'],ans:[2],exp:'<b>Answer key: C.</b> Physics: stress = V<sub>in</sub>(1 + N<sub>p</sub>/N<sub>D</sub>) = V<sub>in</sub>(1 + 1/3) = <b>4/3 V<sub>in</sub></b>; the printed “2/3” in option C looks like a typo for 4/3 (a switch can never block less than V<sub>in</sub>). Choose C if you see this exact question.'});
Q(7,4,'forward','nat','Forward converter with demagnetizing winding, N<sub>D</sub> = 3·N<sub>p</sub>, f<sub>sw</sub> = 10 kHz. <b>Maximum on-time</b> (µs) of S1?',{lo:24,hi:26,show:'25 µs',exp:'D<sub>max</sub> = 1/(1 + N<sub>D</sub>/N<sub>p</sub>) = 1/(1+3) = 0.25. T = 100 µs → t<sub>on,max</sub> = <b>25 µs</b>. Reset voltage on the primary = V<sub>in</sub>N<sub>p</sub>/N<sub>D</sub> = V<sub>in</sub>/3 so reset takes 3× longer than on-time.'});
Q(7,5,'bridges','mcq','Push-pull converter (n = 2). Maximum voltage stress on switches S1, S2?',{opts:['V<sub>in</sub>','2V<sub>in</sub>','0.5V<sub>in</sub>','3V<sub>in</sub>'],ans:[1],exp:'When one half-primary conducts, the other half is induced to V<sub>in</sub> in series with the supply: switch stress = <b>2V<sub>in</sub></b> (plus leakage spike). This is the big drawback of push-pull; full-bridge has V<sub>in</sub>.'});
Q(7,6,'softsw','mcq','Half-bridge leg with C1, C2 across S1, S2 and an inductive load current I<sub>o</sub> flowing out of the mid-point. Which switch(es) obtain <b>ZVS</b> (sufficient dead time, ZVS condition satisfied)?',{opts:['S1','S2','Both S1 and S2'],ans:[1],exp:'The direction of the load current picks the winner. With I<sub>o</sub> flowing out of the half-bridge, the current pulls the mid-point down and the lower switch S2 turns on at zero voltage; the opposite switch is hard-switched (current would have to reverse). Key B.'});
Q(7,7,'softsw','nat','A switch turns off: current falls 60 A → 0 and voltage rises 0 → 200 V in 200 ns (linear, overlapping). <b>Turn-off energy loss</b> (µJ)?',{lo:399,hi:401,show:'400 µJ',exp:'Linear overlapping ramps: E = (1/6)·V·I·t = 200·60·200 ns/6 = <b>400 µJ</b>. (If voltage rose fully first, then current fell: E = ½VI·t<sub>i</sub> + ½VI·t<sub>v</sub>.) P<sub>sw</sub> = E·f<sub>sw</sub>.'});
Q(7,8,'bridges','msq','True about isolated DC-DC converters:',{opts:['Full-bridge: flux swings 0 → B<sub>max</sub>','Full-bridge: flux swings −B<sub>max</sub> → B<sub>max</sub>','Forward: flux swings 0 → B<sub>max</sub>','Forward: flux swings −B<sub>max</sub> → B<sub>max</sub>'],ans:[1,2],exp:'Forward uses one quadrant (0…B<sub>max</sub>), bridges use both (±B<sub>max</sub>) so can use a smaller core.'});
Q(7,9,'forward','nat','Forward converter with N<sub>P</sub> = 2, N<sub>D</sub> = 2, N<sub>s</sub> = 3, V<sub>in</sub> = 100 V, f<sub>sw</sub> = 20 kHz, S1 on 20 µs. <b>Output voltage</b>?',{lo:59,hi:61,show:'60 V',exp:'T = 50 µs, D = 0.4 (≤ D<sub>max</sub> = 0.5 for N<sub>D</sub> = N<sub>p</sub>: reset OK). n = 3/2 = 1.5. V<sub>o</sub> = 1.5·100·0.4 = <b>60 V</b>.'});
Q(7,10,'bridges','nat','Full-bridge converter: 500 W, 100 V load, V<sub>in</sub> = 400 V, transformer primary 4 turns / secondary 2 turns, f<sub>sw</sub> = 20 kHz. <b>Output inductance (mH)</b> for ΔI<sub>pp</sub> ≤ 5 % of full load current?',{lo:4,hi:6,show:'5 mH',exp:'I<sub>o</sub> = 5 A → ΔI = 0.25 A. n = 0.5 → D = V<sub>o</sub>/(nV<sub>in</sub>) = 0.5. Inductor ripple is at 2f<sub>sw</sub>: L = V<sub>o</sub>(1−D)/(2f<sub>sw</sub>ΔI) = 100·0.5/(2·20000·0.25) = <b>5 mH</b>.'});
Q(7,11,'softsw','nat','Half-bridge (200 V input, 200 µH, 100 V, 100 µF) with S2 achieving ZVS; negligible output-current ripple. <b>dv/dt at the half-bridge output</b> (V/ns) when S1 turns off, C<sub>oss</sub> of each switch = 1 nF?',{lo:4,hi:6,show:'5 V/ns',exp:'During dead time the load current I<sub>o</sub> charges C<sub>oss1</sub> and discharges C<sub>oss2</sub>: dv/dt = I<sub>o</sub>/(C<sub>oss1</sub> + C<sub>oss2</sub>) = I<sub>o</sub>/2 nF. For I<sub>o</sub> = 10 A that is <b>5 V/ns</b> (answer key 4–6). Remember the formula: dv/dt = I/(2C<sub>oss</sub>).'});
Q(7,12,'softsw','msq','Soft switching in a conventional half-bridge converter:',{opts:['ZVS gives zero switching loss at turn-on','ZVS gives zero switching loss at turn-off','ZCS gives zero switching loss at turn-on','ZCS gives zero switching loss at turn-off'],ans:[0,3],exp:'Pair them: <b>ZVS ↔ turn-on</b> (voltage already 0 when the switch closes, the output capacitance C<sub>oss</sub> energy is not dumped), <b>ZCS ↔ turn-off</b> (current already 0 when the switch opens).'});
/* ---------- WEEK 8 ---------- */
Q(8,1,'psfb','msq','True for the <b>phase-shifted full-bridge</b>:',{opts:['Leading-leg switches achieve ZVS turn-on even at light load','Lagging-leg switches achieve ZVS turn-on even at light load','Increasing the resonant inductance helps lagging-leg ZVS at light load','Both legs achieve ZVS irrespective of load'],ans:[0,2],exp:'Leading leg: energy = ½(L<sub>lkg</sub> + L<sub>o</sub>/n²)I² (large, load-current driven) → easy. Lagging leg: only ½L<sub>lkg</sub>I² (leakage) and the current is small at light load → ZVS lost; a bigger L<sub>r</sub> helps.'});
Q(8,2,'psfb','msq','PSFB: how is the switch capacitive energy removed at turn-on?',{opts:['Lagging leg: using L<sub>lkg</sub>','Lagging leg: using L<sub>lkg</sub> + L/n²','Leading leg: using L<sub>lkg</sub>','Leading leg: using L<sub>lkg</sub> + L/n²'],ans:[0,3],exp:'Lagging leg: the secondary is shorted by the rectifier, only L<sub>lkg</sub> is in the loop. Leading leg: output filter inductor (reflected, L/n²) is in series with L<sub>lkg</sub> → much larger energy.'});
Q(8,3,'psfb','nat','PSFB: V<sub>in</sub> = 200 V, 1:1 transformer, V<sub>o</sub> = 100 V, 500 W, L<sub>lkg</sub> = 40 µH, C<sub>oss</sub> = 100 pF. <b>Minimum dead-time (ns)</b> for the leading leg ZVS?',{lo:6,hi:10,show:'8 ns',exp:'I<sub>o</sub> = 500/100 = 5 A. Leading leg: the (nearly constant) current charges 2 capacitors: t<sub>d</sub> > 2C·V<sub>in</sub>/(n·I<sub>o</sub>) = 2·100 pF·200/5 = <b>8 ns</b>.'});
Q(8,4,'psfb','nat','PSFB: V<sub>in</sub> = 100 V, 1:1, 10 Ω load at V<sub>o</sub> = 50 V, L<sub>lkg</sub> = 10 µH, C<sub>oss</sub> = 500 pF. <b>Minimum dead-time (ns)</b> for the <u>lagging</u> leg soft turn-on? (1 rad = 57.3°)',{lo:90,hi:110,show:'≈ 100 ns',exp:'Answer key ≈ 100 ns (100.369). Lagging leg is a resonant transition: L<sub>lkg</sub> rings with the switch capacitances; the dead time must exceed the resonant transition time, of order (1/ω<sub>r</sub>)·angle with ω<sub>r</sub> = 1/√(L<sub>lkg</sub>·2C). Compare the leading-leg case (8 ns, linear charging): lagging legs need much longer dead time – the exam-worthy fact.'});
Q(8,5,'psfb','nat','PSFB: V<sub>in</sub> = 200 V, load 5 A at 95 V, allowable duty loss 5 %, f<sub>sw</sub> = 50 kHz, 1:1. <b>Resonant (leakage) inductance (µH)</b>?',{lo:8,hi:12,show:'10 µH',exp:'D<sub>loss</sub> = 4·L<sub>r</sub>·I<sub>o</sub>·f<sub>sw</sub>/(n·V<sub>in</sub>) → L<sub>r</sub> = D<sub>loss</sub>·V<sub>in</sub>/(4·I<sub>o</sub>·f<sub>sw</sub>) = 0.05·200/(4·5·50k) = <b>10 µH</b>.'});
Q(8,6,'psfb','mcq','Ideal full-bridge with phase-shift modulation: <b>180°</b> phase shift between the diagonal switches gives V<sub>o</sub>:',{opts:['0','equal to input','greater than input','half of input'],ans:[0],exp:'V<sub>AB</sub> is zero all the time (both legs identical) → V<sub>o</sub> = 0. Output ∝ the overlap = 1 − φ/180° (full overlap at 0° shift).'});
Q(8,7,'psfb','msq','PSFB, 1:1 transformer, equal switch capacitance, negligible load ripple. ZVS energy conditions (I = primary current at switching):',{opts:['Lagging: ½ L<sub>lkg</sub> I² > C V<sub>in</sub>²','Lagging: ½ (L<sub>lkg</sub> + L/n²) I² > C V<sub>in</sub>²','Leading: ½ (L<sub>lkg</sub> + L/n²) I² > C V<sub>in</sub>²','Leading: ½ L<sub>lkg</sub> I² > C V<sub>in</sub>²'],ans:[0,2],exp:'Same pairing as Q1/Q2: lagging uses leakage only, leading uses leakage + reflected output inductor.'});
Q(8,8,'psfb','nat','PSFB: L<sub>lkg</sub> = 5 µH, L<sub>m</sub> = 1000 µH, output filter L = 100 µH, C<sub>oss</sub> = 100 nF per switch. Lagging-leg resonance must be 100 kHz. <b>Additional series inductor (µH)</b>? (π = 3.14)',{lo:17,hi:23,show:'20.36 µH',exp:'ω<sub>r</sub> = 2π·100k = 6.28×10⁵. L<sub>total</sub> = 1/(ω<sub>r</sub>²·C) = 1/((6.28e5)²·100 nF) = 25.36 µH. Extra = 25.36 − 5 = <b>20.36 µH</b>.'});
Q(8,9,'psfb','msq','PSFB small-signal model: true statements about the extra terms in effective duty ratio d̃<sub>eff</sub>:',{opts:['d̃<sub>v</sub> (from input-voltage change) has the <u>opposite</u> effect on d̃','d̃<sub>v</sub> has the <u>same</u> effect on d̃','d̃<sub>i</sub> (from inductor-current change) has the opposite effect on d̃','d̃<sub>i</sub> has the same effect on d̃'],ans:[1,2],exp:'D<sub>loss</sub> ∝ I<sub>L</sub>/V<sub>in</sub>. Higher V<sub>in</sub> → less duty loss → effective duty ↑ (same sign as d̃). Higher I<sub>L</sub> → more duty loss → effective duty ↓ (opposite).'});
Q(8,10,'psfb','nat','Ideal PSFB with <b>72°</b> phase shift between diagonal switches, 1:1 transformer. V<sub>o</sub>/V<sub>in</sub>?',{lo:.5,hi:.7,show:'0.6',exp:'V<sub>o</sub>/V<sub>in</sub> = n(1 − φ/180°) = 1 − 72/180 = <b>0.6</b>.'});
/* ---------- WEEK 9 ---------- */
Q(9,1,'dab','msq','True for the <b>dual active bridge</b> converter:',{opts:['Facilitates bidirectional power transfer','Cannot do bidirectional power transfer','Requires an inductive filter at the output','Has two active bridges'],ans:[0,3],exp:'DAB = two full bridges + HF transformer + series inductor L. Bidirectional (V2G), no output filter inductor needed.'});
Q(9,2,'dab','nat','DAB, single phase shift. At what phase shift (degrees, < 90°) is <b>1/5th of the maximum power</b> transferred?',{lo:9,hi:10,show:'9.5°',exp:'P ∝ δ*(1−δ*) with δ* = δ/π. P<sub>max</sub> at δ* = 0.5 (value 0.25). Need 4δ*(1−δ*) = 0.2 → δ* = 0.0528 → δ = 0.0528·180° = <b>9.5°</b>.'});
Q(9,3,'magnetics','nat','Transformer core cross-section A<sub>c</sub> (m²): peak AC flux density 0.1 T, primary flux linkage λ = 400 V·s, N<sub>1</sub> = 10 turns.',{lo:190,hi:210,show:'200',exp:'The key treats the λ given as the total (peak-to-peak) swing: A<sub>c</sub> = λ/(N·2ΔB) = 400/(10·0.2) = <b>200</b> (units as in the problem). General: A<sub>c</sub> = V·t/(N·ΔB<sub>pp</sub>).'});
Q(9,4,'magnetics','mcq','Transformer: P<sub>cu,tot</sub> = a/ΔB², P<sub>core</sub> = b·ΔB<sup>β</sup>. If β = 2, the <b>optimum ΔB</b> (minimum total loss) is:',{opts:['(−a/b)^0.25','(a/b)^0.25','(−a/b)^0.5','(a/b)^0.5'],ans:[1],exp:'d/dΔB (a ΔB⁻² + b ΔB²) = 0 → ΔB⁴ = a/b → <b>ΔB<sub>opt</sub> = (a/b)^¼</b>. Copper loss falls with ΔB, core loss rises → U-shaped total.'});
Q(9,5,'dab','mcq','DAB with SPS: match input/output voltage relation with the inductor current shape: I: V<sub>in</sub> > V<sub>o</sub>/n; II: V<sub>in</sub> < V<sub>o</sub>/n; III: V<sub>in</sub> = V<sub>o</sub>/n.',{img:I('w9q5'),opts:['I-a, II-b, III-c','I-b, II-c, III-a','I-c, II-a, III-b','I-b, II-a, III-c','I-c, II-b, III-a','I-a, II-c, III-b'],ans:[1],exp:'Matched voltages (III) give a <b>flat-top (trapezoid)</b> current (a): the inductor sees zero volt in the overlap. Mismatched cases give sloped tops; I-b is rising-then-falling and II-c falling during the plateau. Mnemonic: <b>equal → flat</b>.'});
Q(9,6,'dab','mcq','A phase shift is introduced between the two <b>half bridges of one full bridge</b> in a DAB. The full-bridge output voltage looks like:',{img:I('w9q6'),opts:['a','b','c','d'],ans:[3],exp:'Shifting the legs inside a bridge creates <b>zero-voltage intervals</b>: +V, 0, −V, 0 (quasi-square wave with a zero state) → option d. (This is the “dual phase shift” degree of freedom.)'});
Q(9,7,'dab','nat','DAB with SPS, δ = 60°, V<sub>o</sub> = 800 V, transformer 2 turns primary : 4 secondary, L = 10 µH, V<sub>in</sub> = 200 V, f<sub>s</sub> = 100 kHz. <b>Power</b> (kW)?',{lo:7.5,hi:10,show:'8.89 kW',exp:'n = 2 → V<sub>o</sub>′ = 400 V. P = V<sub>in</sub>V<sub>o</sub>′ δ(π−δ)/(2π² f<sub>s</sub> L) = 200·400·(1.047·2.094)/(2π²·10⁵·10⁻⁵) = <b>8.89 kW</b>.'});
Q(9,8,'dab','nat','DAB: V<sub>in</sub> = 400 V, V<sub>o</sub> = 400 V, turns 1:4, L = 100 µH, f<sub>s</sub> = 100 kHz. <b>Maximum power</b> (kW)?',{lo:.4,hi:.6,show:'0.5 kW',exp:'V<sub>o</sub>′ = 400/4 = 100 V. P<sub>max</sub> = V<sub>in</sub>V<sub>o</sub>′/(8 f<sub>s</sub> L) = 400·100/(8·10⁵·10⁻⁴) = <b>500 W</b> at δ = 90°.'});
Q(9,9,'dab','mcq','DAB with SPS and a <b>3:1</b> transformer ratio. If the transformer current has a <b>flat top</b>, then:',{opts:['V<sub>o</sub> = 3V<sub>in</sub>','V<sub>o</sub> = V<sub>in</sub>/3','V<sub>o</sub> = V<sub>in</sub>','V<sub>o</sub> = 0, V<sub>in</sub> ≠ 0'],ans:[1],exp:'Flat top ⇔ V<sub>in</sub> = V<sub>o</sub>/n (reflected voltages equal). With N<sub>p</sub>:N<sub>s</sub> = 3:1, V<sub>o</sub>′ = 3V<sub>o</sub> = V<sub>in</sub> → V<sub>o</sub> = V<sub>in</sub>/3.'});
Q(9,10,'magnetics','mcq','Core loss per unit volume vs ΔB is plotted for four frequencies f1…f4 (lines f4 highest, f1 lowest on the graph). Which is the <b>minimum frequency</b>?',{opts:['f1','f2','f3','f4'],ans:[0],exp:'Steinmetz: P<sub>core</sub> ∝ f<sup>α</sup>ΔB<sup>β</sup>. At a given ΔB, the lowest loss curve belongs to the lowest frequency: f1.'});

Q(10,1,'ac-type2','mcq','Match <b>CP-line voltage</b> with the SAE J1772 / IEC 61851 state: I = +12 V, II = +6 V, III = +9 V, IV = +3 V, V = −12 V, VI = 0 V.',{opts:['I-a, II-b, III-c, IV-d, V-e, VI-f','I-a, II-d, III-c, IV-b, V-f, VI-e','I-b, II-c, III-d, IV-a, V-e, VI-f','I-a, II-c, III-b, IV-d, V-f, VI-e'],ans:[3],exp:'<b>+12 V = A</b> (no EV), <b>+9 V = B</b> (connected), <b>+6 V = C</b> (ready to charge), <b>+3 V = D</b> (needs ventilation), <b>0 V = E</b> (fault), <b>−12 V = F</b> (EVSE unavailable). Mnemonic: A-12, B-9, C-6, D-3 (drops 3 V per state), E-0, F-minus.'});
Q(10,2,'ac-type2','nat','AC Type-2: max current the EV may demand (IEC 61851-1) = 36 A. <b>Duty ratio (%)</b> of the CP PWM?',{lo:59.9,hi:60.1,show:'60 %',exp:'In the 10–85 % band: I<sub>max</sub> = 0.6·D (A, D in %). 36/0.6 = <b>60 %</b>.'});
Q(10,3,'ac-type2','nat','Max current 48 A (IEC 61851-1, AC Type-2). Time (µs) during which the <b>positive level</b> is on the CP line in one PWM cycle?',{lo:790,hi:810,show:'800 µs',exp:'48/0.6 = 80 % duty (still in the 10–85 % band). CP frequency = 1 kHz → T = 1000 µs → t<sub>on</sub> = <b>800 µs</b>.'});
Q(10,4,'ac-type2','nat','AC connector equivalent circuit: when plugged into the vehicle inlet, <b>voltage at the PP pin</b> if R6 = 300 Ω? (+5 V supply, R4 = 330 Ω, R5 = 4.7 kΩ)',{img:I('w10q4'),lo:2.1,hi:2.7,show:'2.30 V',exp:'R6 appears in parallel with R5: (4700 ∥ 300) = 282 Ω. V<sub>PP</sub> = 5·282/(282 + 330) = <b>2.30 V</b>. Table to remember: R6 = 100 Ω → 1.14 V (63 A), 220 Ω → 1.94 V (32 A), 680 Ω → 3.21 V (20 A), 1500 Ω → 3.87 V (13 A or CCS2 DC).'});
Q(10,5,'ac-type2','nat','CCS2 charging, CP equivalent circuit (EVSE: 12 V through 1 kΩ; EV: 2.74 kΩ with R2 = 1.3 kΩ switched in via S2). <b>CP-to-PE voltage</b>?',{img:I('w10q5'),lo:5,hi:6.5,show:'5.62 V',exp:'State C: R<sub>vehicle</sub> = 2.74 k ∥ 1.3 k = 881 Ω. V<sub>CP</sub> = 12·881/(1000 + 881) = <b>5.62 V</b> ≈ the “+6 V” of state C (the diode D1 and tolerances account for the rest).'});
Q(10,6,'magnetics','msq','True for the <b>air-gap in inductors</b>:',{opts:['Air-gap allows larger ampere-turns before the core saturates','Air-gap increases the inductance value','Air-gap reduces the saturation flux density of the core material','Air-gap makes the inductance independent of the core dimensions'],ans:[0,3],exp:'The gap stores most of the energy and dominates the reluctance: L ≈ μ₀N²A<sub>c</sub>/l<sub>g</sub>. So the core saturates later (more ampere-turns) and L depends on the gap, not on core permeability. The gap <u>reduces</u> L for the same turns and does not change B<sub>sat</sub> (a material property).'});
Q(10,7,'ac-type2','msq','True for the <b>SAE J1772</b> signalling protocol:',{opts:['Voltage level on CP is detected by the EV controller','Voltage level on CP is detected by the EVSE controller','Duty ratio and frequency on CP are detected by the EV controller','Duty ratio and frequency on CP are detected by the EVSE controller'],ans:[1,2],exp:'EVSE <u>generates</u> the 1 kHz PWM (duty = max current it offers) → the EV <b>measures duty and frequency</b>. The EV <u>changes the voltage level</u> via S2/resistor (state change) → the EVSE <b>measures the voltage</b>.'});
Q(10,8,'ac-type2','msq','True for <b>AC Type-2</b> charging:',{opts:['CP detects insertion of the correct plug','PP communicates the status of charging','PP detects insertion of the correct plug','CP communicates the status of charging'],ans:[2,3],exp:'<b>PP</b> = proximity: “right plug present + cable current rating (R6)”. <b>CP</b> = control pilot: PWM signalling of state and available current.'});
Q(10,9,'ccs2','mcq','CCS2 DC charging: the power-line communication takes place over:',{opts:['CP – PE pins','DC+ – DC− pins','PP – PE pins'],ans:[0],exp:'HomePlug Green PHY PLC (2–28 MHz) rides on the <b>CP–PE</b> pair, superimposed (0.3–1.3 V pk-pk) on the ±12 V / 1 kHz PWM.'});
Q(10,10,'ac-type2','msq','Possible CP <b>duty ratio (%)</b> when an <u>AC Type-2 charger plug</u> is plugged into a CCS2 vehicle inlet?',{opts:['30','5','60','4'],ans:[0,2],exp:'AC charging uses duty in the 10–85 % band (30 % → 18 A, 60 % → 36 A). 3–7 % (e.g. 5 %) is the signature of <b>DC / high-level communication</b>.'});

Q(11,1,'ccs2','mcq','CCS2 DC: the <b>SLAC</b> procedure is followed when the charging is in state:',{opts:['B1','B2','C1','C2'],ans:[1],exp:'After connector detection (B1), the EVSE starts the 5 % PWM (B2) and the EV starts SLAC to logically pair its PLC modem with the right EVSE.'});
Q(11,2,'ccs2','mcq','In which layer does <b>SLAAC</b> happen?',{opts:['Application','Data link','Network','Transport'],ans:[2],exp:'SLAAC (stateless address auto-configuration, IPv6 link-local addresses) = <b>network layer</b>. SLAC (signal level attenuation characterization) = data link layer. Don’t mix the two letters.'});

      if (o.userData.kind === 'shell') { selStage = o.userData.stage; selPart = null; focus(); showInfo(); paint(); return; }
      selPart = o.userData.ref; if (selStage !== selPart.stage) { selStage = selPart.stage; focus(); } showInfo(selPart); paint(); });
    el.addEventListener('pointermove', e => { if (down) return; const o = pick(e); const r = o && o.userData.ref ? o.userData.ref : null; el.style.cursor = o ? 'pointer' : 'grab'; if (r !== hov) { hov = r; paint(); } });
    a.box.style.maxHeight = '660px'; a.box.style.aspectRatio = '16/11';
    rebuild();
  }, tick: (t, a) => {
    if (!world) return; curE += (tgtE - curE) * .12; layout();
    world.position.x += (tx - world.position.x) * .1; world.position.y += ((selStage ? -1.5 : -1.0) * curE - world.position.y) * .1;
    if (cam.move) { a.camera.position.z += (cam.tz - a.camera.position.z) * .1; if (Math.abs(cam.tz - a.camera.position.z) < .05) cam.move = false; }
    const xs = stageObjs.map(g => g.position.x), x0 = Math.min(...xs), x1 = Math.max(...xs), D = stageObjs.map(g => g.userData.st.id), ip = xs[D.indexOf('pfc')], id_ = xs[D.indexOf('dcdc')];
    fl.forEach((s, i) => { s.visible = flow; const f = ((i / fl.length) + t * .06) % 1, x = x0 + (x1 - x0) * f; s.position.set(x, -.45, .75); s.material = s.userData.fm[x < ip ? 0 : x < id_ ? 1 : 2]; });

page({ id: 'ev-system', mod: 'm1', wk: 1, stars: 1, topic: true, title: 'EV charging system & battery basics', kw: 'bms cccv battery c-rate soc', lede: 'What a charger actually does to a Li-ion battery: constant current first, constant voltage later, with the BMS in charge.',
  render(body) {
    H(body, `<h2>The big picture</h2><p>An EV charger is a <b>controlled power source</b>: it turns grid AC into DC at the voltage and current the battery asks for. The battery's own computer, the ${HOT('BMS (Battery Management System)')}, is the <b>master</b>: it measures cell voltages and temperatures and tells the charger how much current/voltage it may deliver. The charger is the <b>slave</b>.</p>
    <p>Li-ion cells are charged with the ${HOT('CC-CV (constant current, constant voltage)')} method:</p><ol class="steps"><li><div><b>CC stage:</b> the charger holds the current at the allowed level; cell voltage rises. Most energy (≈ 70-80 % SOC) goes in here.</div></li><li><div><b>CV stage:</b> when cell voltage reaches its maximum (≈ 4.2 V/cell for NMC), the charger holds the voltage and the current <b>tapers</b> automatically as the cell fills.</div></li><li><div><b>Termination:</b> charging stops when the current falls to a small cut-off (about C/20 to C/10).</div></li></ol>`);
    const L = lab(body, 'CC-CV charging of one cell', 'Move the C-rate: a higher C-rate reaches the voltage limit sooner and spends less time in CC.');
    const sc = L.scope({ xmin: 0, xmax: 120, ymin: 0, ymax: 4.5, xl: 'minutes', yl: 'cell V', xt: 6, yt: 3, h: 250 }); L.legend([['cell voltage (V)', '--ch-v'], ['current (× C-rate/1C, scaled)', '--ch-i']]);
    const ro = L.readout();
    const v = controls(L.body, [{ k: 'c', label: 'Charge rate', min: .25, max: 3, step: .05, v: 1, unit: 'C', d: 2 }, { k: 'tau', label: 'CV taper time constant', min: 5, max: 40, step: 1, v: 18, unit: 'min', d: 0 }], upd);
    function upd() {
      // simple model: open-circuit v(soc) + I*R
      const R = 0.04, C = v.c, dt = .5; let soc = 0, I = C, t = 0, tcv = null; const X = [], Vv = [], Ii = [];
      const Voc = s => 3.0 + 1.0 * s + .2 * Math.pow(s, 6) - .0 * s; // ~3.0..4.2
      for (; t <= 120; t += dt) {
        let V = Voc(soc) + I * R;
        if (tcv === null && V >= 4.2) tcv = t;
        if (tcv !== null) { I = C * Math.exp(-(t - tcv) / v.tau); V = 4.2; }
        if (I < 0.05) I = 0.0;
        X.push(t); Vv.push(I === 0 ? Voc(soc) : V); Ii.push(I / Math.max(C, 1) * 1.4 + 0); soc = Math.min(1, soc + I / 60 * dt);
        if (I === 0 && tcv) { for (let k = t + dt; k <= 120; k += dt) { X.push(k); Vv.push(4.2); Ii.push(0); } break; }
      }
      sc.draw([{ x: X, y: Vv, c: '--ch-v' }, { x: X, y: Ii.map(y => y * 1.2), c: '--ch-i', fill: true }], { h: [{ y: 4.2, c: '--bad', t: '4.2 V limit' }], v: tcv ? [{ x: tcv, c: '--ch-d', t: 'CC → CV' }] : [] });
      ro([['C-rate', C.toFixed(2) + ' C'], ['CC → CV at', tcv ? tcv.toFixed(0) + ' min' : '>120 min'], ['Pack 75 kWh, power at 1C', (75 * C).toFixed(0) + ' kW']]);
    }
    upd();
    H(body, MUST(
      `${HOT('BMS is the master')}: it requests voltage/current; the EVSE only supplies. The BMS lives in the vehicle, never in the charger (W1Q5).`,
      `CC first (current constant, voltage rises) then CV (voltage constant, current tapers).`,
      `C-rate = charging current ÷ rated capacity (1C of a 100 Ah pack = 100 A). Power = V × I.`,
      `Fast charging is limited by cell temperature and lithium plating, not just by the charger rating.`
    ));
  } });

page({ id: 'charger-arch', mod: 'm1', wk: 1, stars: 2, topic: true, title: 'AC vs DC charger architecture', kw: 'evse onboard charger obc rectifier', lede: 'Where is the power electronics: in the car (AC charging) or in the station (DC charging)?',

    <p>${HOT('DC EVSE = full charger', 'W1Q5')}: rectifier with PFC, isolated DC-DC converter, interlocks, metering and controller. DC goes straight into the battery pack; the OBC is bypassed. Power can be 50-350 kW because the size/cost of the converter is in the station, not in the car.</p>`);

      <text class="tx2" x="${ac ? 8 : 8}" y="176">${ac ? 'Cable carries AC (1-φ or 3-φ). Power limited by the on-board charger: typically 3.3-22 kW.' : 'Cable carries DC at battery voltage. Power set by the station: 50-350 kW. OBC bypassed.'}</text>
      <text class="tx2" x="8" y="194">${ac ? 'Communication: PWM on the CP pin (SAE J1772) → current limit.' : 'Communication: PLC (CCS) or CAN (CHAdeMO, GB/T, BEVC-DC001) between BMS and station.'}</text></svg>`;
    };
    segmented(L.body, [['ac', 'AC charging'], ['dc', 'DC fast charging']], 'ac', draw); draw('ac');
    H(body, `<div class="card"><b>Want the full chain with waveforms?</b> <button class="btn primary" onclick="go('simulator')">Open the end-to-end charger simulator</button></div>`);
    H(body, `<h2>Charger power-stage chain (what you will design in the next modules)</h2>${TBL(['Stage', 'Job', 'Typical topology (this course)'], [['AC-DC with PFC', 'Make DC from AC <b>and</b> draw sinusoidal current in phase with voltage', 'Boost PFC, totem-pole PFC (1-φ); 3-phase active rectifier (VSC)'], ['Isolated DC-DC', 'Galvanic isolation, voltage matching, regulation', 'Forward, push-pull, half/full bridge, PSFB, DAB, LLC'], ['Control', 'Current/voltage loops, protection, communication', 'Average current control, dq control, CAN/PLC']])}
    ${MUST(`${HOT('AC EVSE: no rectifier')}. DC EVSE: rectifier + isolated DC-DC + interlocks. BMS is never in the EVSE.`, `Mode-4 charging = DC EVSE; Mode-3 = AC EVSE with control pilot; Mode-2 = cable with in-cable control box (RCD); Mode-1 = plain socket.`, `Isolation (transformer) is needed in the charger for safety and to match voltage levels.`)}`);

page({ id: 'standards', mod: 'm1', wk: 1, stars: 2, topic: true, title: 'Charging standards, modes & connectors (3D)', kw: 'ccs1 ccs2 chademo gbt type 1 type 2 type 6 type 7 connector mode level', lede: 'Names, modes and pin layouts. Spin the connectors and learn which pins exist.',
